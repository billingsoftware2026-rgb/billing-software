<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TableMaster Pro — Restaurant & Cafe Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  --bg: #f8fafc;
  --surface: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius-xl: 20px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06);
  --shadow-md: 0 8px 24px -4px rgba(15,23,42,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text-main); font-size: 14px; min-height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; }

/* Auth Screen */
.auth-wrap {
  min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: 20px; background: radial-gradient(ellipse at top left, #1e293b 0%, #0f172a 60%), #0f172a;
}
.auth-card {
  background: #fff; padding: 32px 24px; border-radius: 24px; width: 100%; max-width: 420px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); text-align: left;
}
.auth-brand { text-align: center; margin-bottom: 24px; }
.auth-brand .icon {
  width: 52px; height: 52px; background: var(--primary-gradient); border-radius: 14px;
  display: inline-flex; align-items: center; justify-content: center; color: #fff; margin-bottom: 10px;
}
.auth-tabs { display: flex; gap: 4px; background: #f1f5f9; padding: 4px; border-radius: 12px; margin-bottom: 20px; }
.auth-tab {
  flex: 1; padding: 9px; border-radius: 8px; border: none; background: transparent;
  color: var(--text-muted); font-weight: 700; font-size: 13px; cursor: pointer;
}
.auth-tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); }

/* Top Header */
.topbar {
  position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
}
.brand-box { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; color: var(--primary); }
.brand-icon {
  width: 36px; height: 36px; background: var(--primary-gradient);
  border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff;
  box-shadow: 0 4px 12px rgba(37,99,235,0.3);
}
.top-actions { display: flex; align-items: center; gap: 8px; }

.lang-toggle-btn {
  display: flex; align-items: center; gap: 6px; padding: 6px 12px;
  border-radius: 20px; border: 1.5px solid var(--border); background: #fff;
  font-size: 12px; font-weight: 700; color: var(--primary); cursor: pointer; transition: 0.15s;
}
.lang-toggle-btn:active { transform: scale(0.95); background: #f1f5f9; }

.btn-icon {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: #fff; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); cursor: pointer; transition: 0.15s;
}
.btn-icon:active { transform: scale(0.92); background: #f1f5f9; }

/* Main Content */
.main-wrapper { flex: 1; padding: 16px; padding-bottom: calc(100px + env(safe-area-inset-bottom)); max-width: 850px; margin: 0 auto; width: 100%; }

.tm-card {
  background: var(--surface); border-radius: var(--radius-xl); padding: 18px;
  box-shadow: var(--shadow-md); border: 1px solid rgba(226, 232, 240, 0.8); margin-bottom: 16px;
}
.tm-card-title {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; font-weight: 700; font-size: 15px; color: var(--text-main);
}

/* Quick Action Tiles */
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.quick-tile {
  background: var(--surface); border-radius: var(--radius-xl); padding: 16px;
  border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex;
  flex-direction: column; align-items: flex-start; gap: 8px; cursor: pointer;
  position: relative; overflow: hidden; transition: 0.15s; border-left: 5px solid var(--primary);
}
.quick-tile:active { transform: scale(0.96); }
.quick-tile.amber { border-left-color: var(--warning); }
.quick-tile.emerald { border-left-color: var(--success); }
.quick-tile.purple { border-left-color: #8b5cf6; }
.tile-bubble {
  width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center;
  justify-content: center; background: #eff6ff; color: var(--primary);
}
.quick-tile.amber .tile-bubble { background: #fffbeb; color: var(--warning); }
.quick-tile.emerald .tile-bubble { background: #ecfdf5; color: var(--success); }
.quick-tile.purple .tile-bubble { background: #f3e8ff; color: #8b5cf6; }
.tile-title { font-weight: 700; font-size: 14px; margin-top: 2px; }
.tile-desc { font-size: 11.5px; color: var(--text-muted); }

/* Floor Table Visuals */
.table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.table-card {
  background: #fff; border: 2px solid var(--border); border-radius: var(--radius-lg);
  padding: 16px 12px; text-align: center; cursor: pointer; position: relative; transition: 0.15s;
}
.table-card:active { transform: scale(0.96); }
.table-card.available { border-color: #a7f3d0; background: linear-gradient(180deg, #ecfdf5 0%, #fff 100%); }
.table-card.occupied { border-color: #fde68a; background: linear-gradient(180deg, #fffbeb 0%, #fff 100%); }
.table-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; }
.table-card.available .table-dot { background: var(--success); }
.table-card.occupied .table-dot { background: var(--warning); animation: pulse 1.4s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* POS Layout */
.cat-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-btn {
  padding: 8px 16px; border-radius: 99px; background: #f1f5f9; border: none;
  font-size: 12.5px; font-weight: 600; color: var(--text-muted); white-space: nowrap; cursor: pointer;
}
.cat-btn.active { background: var(--primary-gradient); color: #fff; box-shadow: 0 4px 10px rgba(37,99,235,0.25); }

.dish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.dish-card {
  background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius-md);
  padding: 12px; display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; min-height: 85px; transition: 0.15s;
}
.dish-card:active { border-color: var(--primary); background: #f8fafc; }
.dish-name { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.dish-price { font-weight: 800; color: var(--primary); margin-top: 6px; font-size: 14px; }

/* Sticky Cart */
.floating-cart {
  position: fixed; bottom: calc(68px + env(safe-area-inset-bottom)); left: 14px; right: 14px;
  background: var(--text-main); color: #fff; border-radius: 16px; padding: 12px 18px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 12px 28px rgba(15,23,42,0.3); z-index: 95;
}
.btn-place {
  background: var(--success); color: #fff; border: none; border-radius: 10px;
  padding: 9px 18px; font-weight: 700; font-size: 13px; cursor: pointer;
}

/* Profit Banner & Reports */
.profit-banner {
  padding: 18px; border-radius: var(--radius-lg); margin-bottom: 16px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;
}
.profit-banner.profit { background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%); border-left: 5px solid #059669; }
.profit-banner.loss { background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%); border-left: 5px solid #dc2626; }
.profit-banner .label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
.profit-banner.profit .label { color: #047857; }
.profit-banner.loss .label { color: #b91c1c; }
.profit-banner .val { font-size: 28px; font-weight: 800; }
.profit-banner.profit .val { color: #065f46; }
.profit-banner.loss .val { color: #991b1b; }
.profit-breakdown { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; }
.profit-breakdown div { display: flex; flex-direction: column; }
.profit-breakdown span:first-child { color: #64748b; font-weight: 700; font-size: 10px; text-transform: uppercase; }
.profit-breakdown span:last-child { font-size: 14px; font-weight: 800; margin-top: 2px; }

.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.filter-chip {
  padding: 6px 14px; border-radius: 99px; background: #f1f5f9; border: none;
  font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.15s;
}
.filter-chip.active { background: var(--primary-gradient); color: #fff; box-shadow: 0 4px 10px rgba(37,99,235,0.25); }

.bar-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
.bar-row:last-child { border-bottom: none; }
.bar-label { flex: 0 0 35%; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1; height: 8px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--primary-gradient); }
.bar-fill.green { background: linear-gradient(90deg, #10b981, #059669); }
.bar-val { flex: 0 0 auto; font-size: 12px; font-weight: 700; text-align: right; min-width: 70px; }

/* Data Tables */
.table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-md); border: 1px solid var(--border); }
.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
.data-table th, .data-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
.data-table th { background: #f8fafc; font-weight: 700; color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
.data-table tr:last-child td { border-bottom: none; }

.badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.badge.cat-raw { background: #fee2e2; color: #b91c1c; }
.badge.cat-util { background: #fef3c7; color: #b45309; }
.badge.cat-sal { background: #e0e7ff; color: #4338ca; }
.badge.cat-rent { background: #dbeafe; color: #1e40af; }
.badge.cat-other { background: #f1f5f9; color: #475569; }

/* Bottom Bar */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(16px);
  border-top: 1px solid var(--border); display: flex; justify-content: space-around;
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
}
.bar-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: transparent; border: none; font-size: 10px; font-weight: 600;
  color: var(--text-muted); cursor: pointer; padding: 6px 4px; border-radius: 10px; flex: 1;
}
.bar-item.active { color: var(--primary); background: #eff6ff; }
.bar-item svg { width: 19px; height: 19px; }

/* Developer Watermark Footer */
.dev-footer {
  text-align: center; padding: 18px 10px; font-size: 12px; color: var(--text-muted);
  border-top: 1px solid var(--border); margin-top: 24px;
}
.dev-footer b { color: var(--primary); font-weight: 800; }

/* Modal Sheet */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center;
  z-index: 200;
}
.sheet-backdrop.active { display: flex; }
.sheet-modal {
  background: #fff; width: 100%; max-width: 520px; border-radius: 24px 24px 0 0;
  padding: 20px; max-height: 88dvh; overflow-y: auto; display: flex; flex-direction: column;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-title { font-size: 17px; font-weight: 800; }
.btn-x { background: #f1f5f9; border: none; border-radius: 50%; width: 32px; height: 32px; font-weight: bold; cursor: pointer; }

input, select, textarea {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 14px; margin-bottom: 12px; background: #fff; font-family: inherit;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }

.btn-primary { width: 100%; background: var(--primary-gradient); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
.btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn-sm-outline { border: 1px solid var(--border); background: #fff; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }

/* Thermal Receipt Paper */
.receipt-paper {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; background: #fff;
  color: #000; padding: 14px; border: 1px dashed #cbd5e1; border-radius: 8px;
  width: 290px; margin: 0 auto; text-align: left; line-height: 1.4;
}
.receipt-paper hr { border: none; border-top: 1px dashed #000; margin: 7px 0; }
.receipt-paper .c { text-align: center; }
.receipt-paper .r { text-align: right; }
.receipt-paper .qr-img { width: 105px; height: 105px; display: block; margin: 0 auto; }
.receipt-dev { text-align: center; font-size: 9px; font-weight: 700; margin-top: 8px; border-top: 1px dotted #000; padding-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

@media print {
  body > * { display: none !important; }
  #print-area { display: block !important; width: 100%; margin: 0; padding: 0; }
  .receipt-paper { width: 100% !important; border: none !important; padding: 0 !important; }
}
#print-area { display: none; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="auth-wrap" style="display:none">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="icon">
        <svg width="28" height="28" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 3v18M3 8h4a4 4 0 010 8H3M17 3v18M17 8c0-2 3-2 3 0v6c0 2 3 2 3 0V3"/></svg>
      </div>
      <h2 style="font-size:22px;font-weight:800;color:#0f172a">TableMaster Pro</h2>
      <p style="font-size:12px;color:var(--text-muted);margin-top:2px">Developed by <b>Debapriya Sarkar</b></p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')" id="tab-login">Login</button>
      <button class="auth-tab" onclick="switchAuthTab('register')" id="tab-register">Register Cafe</button>
    </div>
    <form id="form-login" onsubmit="handleLogin(event)">
      <label>Username</label>
      <input id="log-user" required placeholder="admin or staff username">
      <label>Password</label>
      <input id="log-pass" type="password" required placeholder="••••••••">
      <button type="submit" class="btn-primary" style="margin-top:8px">Sign In →</button>
    </form>
    <form id="form-register" style="display:none" onsubmit="handleRegister(event)">
      <label>Restaurant / Cafe Name</label>
      <input id="reg-name" required placeholder="e.g. Royal Cafe">
      <label>Owner Name</label>
      <input id="reg-owner" required placeholder="Full Name">
      <label>Phone Number</label>
      <input id="reg-phone" required placeholder="+91 XXXXX XXXXX">
      <label>Admin Username</label>
      <input id="reg-user" required placeholder="Choose username">
      <label>Admin Password</label>
      <input id="reg-pass" type="password" required placeholder="Password">
      <label>Master PIN (4 Digits)</label>
      <input id="reg-pin" type="password" pattern="[0-9]{4}" required placeholder="e.g. 1234">
      <button type="submit" class="btn-primary" style="margin-top:8px">Register & Launch →</button>
    </form>
    <div style="text-align:center;font-size:10.5px;color:#94a3b8;margin-top:16px;">
      Software Architecture by <b>Debapriya Sarkar</b>
    </div>
  </div>
</div>

<!-- MAIN APP CONTAINER -->
<div id="app-container" style="display:none">
  <header class="topbar">
    <div class="brand-box">
      <div class="brand-icon">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 3v18M3 8h4a4 4 0 010 8H3M17 3v18M17 8c0-2 3-2 3 0v6c0 2 3 2 3 0V3"/></svg>
      </div>
      <span id="txt-cafe-name">TableMaster Pro</span>
    </div>
    <div class="top-actions">
      <button class="lang-toggle-btn" onclick="toggleLanguage()" id="btn-lang-toggle">
        🌐 <span>English</span>
      </button>
      <button class="btn-icon" id="btn-staff-header" onclick="openStaffModal()" title="Staff Management">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      </button>
      <button class="btn-icon" id="btn-settings-header" onclick="openSettingsSheet()" title="Settings">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
      <button class="btn-icon" onclick="handleLogout()" title="Logout" style="color:var(--danger)">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <main class="main-wrapper" id="main-view"></main>

  <nav class="bottom-bar" id="app-bottom-bar"></nav>
</div>

<!-- Sheet Modal -->
<div class="sheet-backdrop" id="sheet-backdrop" onclick="sheetBackdropClick(event)">
  <div class="sheet-modal" id="sheet-modal">
    <div class="sheet-head">
      <div class="sheet-title" id="sheet-title">Title</div>
      <button class="btn-x" onclick="closeSheet()">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="print-area"></div>

<script>

/* Authentication Handlers */
function checkAuth() {
  if (SYSTEM_DB.session && currentAccount()) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-container').style.display = 'block';

    const role = SYSTEM_DB.session.role;
    document.getElementById('btn-staff-header').style.display = (role === 'owner') ? 'flex' : 'none';
    document.getElementById('btn-settings-header').style.display = (role === 'owner') ? 'flex' : 'none';

    setupRoleBasedNavigation();
    renderCurrentView();
  } else {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-container').style.display = 'none';
  }
}

function switchAuthTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
}

function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('log-user').value.trim();
  const p = document.getElementById('log-pass').value.trim();

  for (const acc of SYSTEM_DB.accounts) {
    if (acc.username === u && acc.password === p) {
      SYSTEM_DB.session = { accountId: acc.id, role: 'owner', name: acc.owner };
      persistSystemData();
      checkAuth();
      return;
    }
    const staffUser = (acc.staff || []).find(s => s.username === u && s.password === p);
    if (staffUser) {
      SYSTEM_DB.session = { accountId: acc.id, role: staffUser.role, name: staffUser.name };
      persistSystemData();
      checkAuth();
      return;
    }
  }
  alert('Invalid credentials! Try: admin / 123');
}

function handleRegister(e) {
  e.preventDefault();
  const name = document.getElementById('reg-name').value.trim();
  const owner = document.getElementById('reg-owner').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const user = document.getElementById('reg-user').value.trim();
  const pass = document.getElementById('reg-pass').value.trim();
  const pin = document.getElementById('reg-pin').value.trim();

  const exists = SYSTEM_DB.accounts.some(a => a.username === user);
  if (exists) { alert('Username already exists!'); return; }

  const newAcc = {
    id: 'acc_' + Date.now(),
    name, owner, phone, address: 'India',
    username: user, password: pass, masterPin: pin,
    upi: 'payment@upi', googleReview: '', gstRate: 5,
    staff: [],
    tables: [{ id: 't1', name: 'T-01', seats: 4, status: 'available' }],
    menu: [{ id: 'm1', name: 'Signature Coffee', category: 'Drinks', price: 60 }],
    orders: [], expenses: []
  };

  SYSTEM_DB.accounts.push(newAcc);
  SYSTEM_DB.session = { accountId: newAcc.id, role: 'owner', name: newAcc.owner };
  persistSystemData();
  checkAuth();
}

function handleLogout() {
  if (!confirm('Are you sure you want to log out?')) return;
  SYSTEM_DB.session = null;
  persistSystemData();
  checkAuth();
}

function setupRoleBasedNavigation() {
  const role = SYSTEM_DB.session.role;
  const bottomBar = document.getElementById('app-bottom-bar');
  const allowed = ALL_NAV_ITEMS.filter(it => it.roles.includes(role));

  bottomBar.innerHTML = allowed.map(it => `

function createSafeQR(text) {
  if (!text) return '';
  try {
    const qr = qrcode(0, 'M');
    qr.addData(String(text));
    qr.make();
    return qr.createDataURL(4);
  } catch (err) { return ''; }
}

  if (q) {

    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--text-muted);">No matching food items found!</div>';

/* --- LOGIC HANDLERS --- */
function handleTableSelect(tblId) {
  cartState.tableId = tblId;
  navigate('pos');
}

function addItemToCart(dishId) {
  const acc = currentAccount();
  const dish = acc.menu.find(d => d.id === dishId);
  if (!dish) return;
  const item = cartState.items.find(i => i.dishId === dishId);
  if (item) item.qty += 1;
  else cartState.items.push({ dishId, name: dish.name, price: dish.price, qty: 1 });
  renderCurrentView();
}

function openCartReviewSheet() {
  const acc = currentAccount();
  if (!cartState.tableId) {
    alert(t('selectDishWarning'));
    return;
  }
  const subtotal = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);
  const gst = subtotal * (acc.gstRate / 100);
  const grandTotal = subtotal + gst;
  const tbl = acc.tables.find(tData => tData.id === cartState.tableId);

  const existingOrder = acc.orders.find(o => o.tableId === cartState.tableId && o.status !== 'completed');

  const body = `
    <div style="font-weight:700;margin-bottom:12px;">${t('table')}: ${tbl ? tbl.name : ''}</div>
    ${existingOrder ? `<div style="font-size:11.5px;color:#1e40af;margin-bottom:8px;">Appending items to Running Bill #${existingOrder.billNo}</div>` : ''}
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
      ${cartState.items.map(it => `
        <div style="display:flex;justify-content:space-between;border-bottom:1px solid #f1f5f9;padding-bottom:6px;">
          <span>${it.name} (x${it.qty})</span>
          <strong>₹ ${(it.price * it.qty).toFixed(2)}</strong>
        </div>
      `).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
      <span>${t('subtotal')}:</span><span>₹ ${subtotal.toFixed(2)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;">
      <span>${t('tax')} (${acc.gstRate}%):</span><span>₹ ${gst.toFixed(2)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin-bottom:16px;">
      <span>${t('grandTotal')}:</span><span>₹ ${grandTotal.toFixed(2)}</span>
    </div>
    <button class="btn-primary" onclick="submitOrderToKitchen()">${t('sendToKitchen')}</button>
  `;
  openSheet(t('orderConfirmation'), body);
}

/* SUBMIT ORDER WITH ADD-ON SUPPORT (BUG 4 FIXED) */
function submitOrderToKitchen() {
  const acc = currentAccount();
  const existingOrder = acc.orders.find(o => o.tableId === cartState.tableId && o.status !== 'completed');

  if (existingOrder) {
    cartState.items.forEach(newItem => {
      const match = existingOrder.items.find(i => i.dishId === newItem.dishId);
      if (match) match.qty += newItem.qty;
      else existingOrder.items.push({ ...newItem });
    });
    existingOrder.subtotal = existingOrder.items.reduce((s, i) => s + (i.price * i.qty), 0);
    existingOrder.gst = existingOrder.subtotal * (acc.gstRate / 100);
    existingOrder.total = existingOrder.subtotal + existingOrder.gst;
    existingOrder.status = 'preparing';
  } else {
    const subtotal = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);
    const gst = subtotal * (acc.gstRate / 100);
    const orderNum = 100 + acc.orders.length + 1;

    acc.orders.push({
      id: 'ord_' + Date.now(),
      kotNo: orderNum,
      billNo: orderNum,
      tableId: cartState.tableId,
      items: [...cartState.items],
      subtotal: subtotal,
      gst: gst,
      total: subtotal + gst,
      status: 'preparing',
      date: todayStr(),
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });
  }

  const tbl = acc.tables.find(tData => tData.id === cartState.tableId);
  if (tbl) tbl.status = 'occupied';
  persistSystemData();

  cartState = { tableId: '', items: [] };
  closeSheet();
  navigate('kitchen');
}

/* KITCHEN READY TO SERVE (BUG 2 FIXED: PRESERVES OCCUPIED STATUS) */
function completeKOT(orderId) {
  const acc = currentAccount();
  const o = acc.orders.find(ord => ord.id === orderId);
  if (o) {
    o.status = 'ready_to_serve';
    persistSystemData();
    renderCurrentView();
  }
}

/* SETTLE BILL & FREE TABLE */
function settleBillAndReleaseTable(orderId) {
  const acc = currentAccount();
  const o = acc.orders.find(ord => ord.id === orderId);
  if (!o) return;

  if (!confirm(`Confirm full payment settlement of ₹ ${o.total.toFixed(2)} for Bill #${o.billNo}? Table will now be marked AVAILABLE.`)) return;

  o.status = 'completed';
  const tbl = acc.tables.find(tData => tData.id === o.tableId);
  if (tbl) tbl.status = 'available';

  persistSystemData();
  renderCurrentView();
}

      `).join('')}
      <hr>
      <div style="display:flex;justify-content:space-between;">
        <span>${t('subtotal')}:</span>
        <span>₹ ${o.subtotal.toFixed(2)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;">
        <span>${t('tax')} (${acc.gstRate}%):</span>
        <span>₹ ${o.gst.toFixed(2)}</span>
      </div>
      <hr>
      <div style="display:flex;justify-content:space-between;font-weight:bold;font-size:13px;">
        <span>${t('grandTotal')}:</span>
        <span>₹ ${o.total.toFixed(2)}</span>
      </div>
      <hr>
      ${upiQrImg ? `
        <div class="c" style="margin:8px 0;">
          <div style="font-size:10px;margin-bottom:4px;font-weight:bold;">${t('scanToPay')}</div>
          <img src="${upiQrImg}" class="qr-img">
        </div>
      ` : ''}
      ${reviewQrImg ? `
        <div class="c" style="margin-top:6px;">
          <div style="font-size:9px;">${t('reviewPrompt')}</div>
          <img src="${reviewQrImg}" style="width:70px;height:70px;margin-top:2px;">
        </div>
      ` : ''}
      <div class="c" style="font-size:10px;margin-top:8px;">${t('thankYou')}</div>
      <div class="receipt-dev">Software Developer: Debapriya Sarkar</div>
    </div>
    <button class="btn-primary" style="margin-top:14px;" onclick="triggerPrint()">${t('printThermalReceipt')}</button>
  `;
  openSheet(t('billsAndPrint'), receiptHtml);
}

function triggerPrint() {
  document.getElementById('print-area').innerHTML = document.getElementById('paper-element').innerHTML;
  window.print();
}

/* --- EXPORT CSV --- */
function exportReportsCSV() {
  const acc = currentAccount();
  let csv = "TableMaster Pro - Sales & Profit Report\n";
  csv += "Developer,Debapriya Sarkar\n";
  csv += "Type,Date,Description,Amount\n";
  acc.orders.filter(o => o.status === 'completed').forEach(o => {
    csv += `Sales,${o.date || todayStr()},Bill #${o.billNo},${o.total.toFixed(2)}\n`;
  });
  acc.expenses.forEach(e => {
    csv += `Expense,${e.date || todayStr()},"${e.desc}",${e.amount.toFixed(2)}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `report_${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* --- ENTITY MODALS --- */
function openAddDishSheet() {
  const form = `
    <label>${t('dishName')}</label>
    <input type="text" id="add-dish-name" placeholder="e.g. Chicken Sandwich">
    <label>${t('category')}</label>
    <input type="text" id="add-dish-cat" placeholder="e.g. Snacks / Drinks / Main">
    <label>${t('price')}</label>
    <input type="number" id="add-dish-price" placeholder="100">
    <button class="btn-primary" onclick="saveNewDish()">${t('save')}</button>
  `;
  openSheet(t('addNewDish'), form);
}
function saveNewDish() {
  const acc = currentAccount();
  const name = document.getElementById('add-dish-name').value.trim();
  const cat = document.getElementById('add-dish-cat').value.trim() || 'General';
  const price = parseFloat(document.getElementById('add-dish-price').value);
  if (!name || !price) { alert('Please enter valid details'); return; }
  acc.menu.push({ id: 'm_' + Date.now(), name, category: cat, price });
  persistSystemData();
  closeSheet();
  renderCurrentView();
}
function deleteDish(id) {
  const acc = currentAccount();
  if (!confirm(t('confirmDelete'))) return;
  acc.menu = acc.menu.filter(m => m.id !== id);
  persistSystemData();
  renderCurrentView();
}

function openAddTableSheet() {
  const form = `
    <label>${t('table')} (Name / Number)</label>
    <input type="text" id="tbl-in-name" placeholder="e.g. T-07">
    <label>${t('seater')} Capacity</label>
    <input type="number" id="tbl-in-seats" value="4">
    <button class="btn-primary" onclick="saveNewTable()">${t('save')}</button>
  `;
  openSheet(t('addTable'), form);
}
function saveNewTable() {
  const acc = currentAccount();
  const name = document.getElementById('tbl-in-name').value.trim();
  const seats = parseInt(document.getElementById('tbl-in-seats').value) || 4;
  if (!name) return;
  acc.tables.push({ id: 't_' + Date.now(), name, seats, status: 'available' });
  persistSystemData();
  closeSheet();
  renderCurrentView();
}

function openExpenseSheet() {
  const form = `
    <label>Expense Category</label>
    <select id="exp-cat">
      <option value="Raw Materials">Raw Materials (Kitchen Supplies)</option>
      <option value="Utilities">Utilities (Electric/Gas/Water)</option>
      <option value="Salaries">Salaries (Staff Pay)</option>
      <option value="Rent">Rent (Premises)</option>
      <option value="Marketing">Marketing</option>
      <option value="Other">Other</option>
    </select>
    <label>${t('expenseDesc')}</label>
    <input type="text" id="exp-desc" placeholder="e.g. 5kg Milk & Coffee beans">
    <label>${t('amount')}</label>
    <input type="number" id="exp-amount" placeholder="0.00">
    <button class="btn-primary" onclick="saveExpense()">${t('save')}</button>
  `;
  openSheet(t('expenseTitle'), form);
}
function saveExpense() {
  const acc = currentAccount();
  const cat = document.getElementById('exp-cat').value;
  const desc = document.getElementById('exp-desc').value.trim();
  const amt = parseFloat(document.getElementById('exp-amount').value);
  if (!amt || !desc) { alert('Please enter valid expense details'); return; }
  acc.expenses.unshift({ id: 'exp_' + Date.now(), category: cat, desc, amount: amt, date: todayStr() });
  persistSystemData();
  closeSheet();
  renderCurrentView();
}
function deleteExpense(id) {
  const acc = currentAccount();
  if (!confirm('Delete this expense entry?')) return;
  acc.expenses = acc.expenses.filter(e => e.id !== id);
  persistSystemData();
  renderCurrentView();
}

function openStaffModal() {
  const acc = currentAccount();
  const pin = prompt(t('masterPinPrompt'));
  if (pin !== acc.masterPin) {
    alert('Incorrect Master PIN!');
    return;
  }

  const staffListHtml = (acc.staff || []).map(s => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;">
      <div>
        <strong>${s.name}</strong> (@${s.username})
        <div style="font-size:11px;color:var(--text-muted);">${s.role.toUpperCase()}</div>
      </div>
      <button class="btn-danger" style="padding:4px 8px;font-size:11px;" onclick="deleteStaff('${s.id}')">✕</button>
    </div>
  `).join('');

  const body = `
    <h4 style="font-size:14px;margin-bottom:12px;">Existing Staff</h4>
    <div style="margin-bottom:16px;">${staffListHtml || '<div style="color:var(--text-muted);font-size:12px;">No staff accounts yet.</div>'}</div>
    <hr style="border:none;border-top:1px solid #e2e8f0;margin:12px 0;">
    <h4 style="font-size:14px;margin-bottom:12px;">Add New Staff Member</h4>
    <label>Staff Full Name</label>
    <input type="text" id="stf-name" placeholder="Rohan Kumar">
    <label>Username</label>
    <input type="text" id="stf-user" placeholder="rohan">
    <label>Password</label>
    <input type="text" id="stf-pass" placeholder="pass123">
    <label>${t('role')}</label>
    <select id="stf-role">
      <option value="waiter">Waiter (POS & Orders Only)</option>
      <option value="kitchen">Kitchen Staff (KOT Live Only)</option>
      <option value="cashier">Cashier (Orders, Bills & Dashboard)</option>
    </select>
    <button class="btn-primary" onclick="saveStaffMember()">${t('save')}</button>
  `;
  openSheet(t('staffMgmt'), body);
}

function saveStaffMember() {
  const acc = currentAccount();
  const name = document.getElementById('stf-name').value.trim();
  const user = document.getElementById('stf-user').value.trim();
  const pass = document.getElementById('stf-pass').value.trim();
  const role = document.getElementById('stf-role').value;
  if (!name || !user || !pass) { alert('Please fill in all staff fields'); return; }

  if (!acc.staff) acc.staff = [];
  acc.staff.push({ id: 'stf_' + Date.now(), name, username: user, password: pass, role });
  persistSystemData();
  closeSheet();
  alert('Staff account created successfully!');
}

function deleteStaff(id) {
  const acc = currentAccount();
  if (!confirm('Remove this staff member?')) return;
  acc.staff = acc.staff.filter(s => s.id !== id);
  persistSystemData();
  closeSheet();
}

function openSettingsSheet() {
  const acc = currentAccount();
  const form = `
    <label>${t('restaurantName')}</label>
    <input type="text" id="cfg-name" value="${acc.name}">
    <label>${t('phone')}</label>
    <input type="text" id="cfg-phone" value="${acc.phone}">
    <label>${t('address')}</label>
    <input type="text" id="cfg-addr" value="${acc.address}">
    <label>${t('upiId')}</label>
    <input type="text" id="cfg-upi" value="${acc.upi}">
    <label>${t('googleReviewUrl')}</label>
    <input type="text" id="cfg-review" value="${acc.googleReview}">
    <label>${t('gstRate')}</label>
    <input type="number" id="cfg-gst" value="${acc.gstRate}">
    <label>Master PIN (4 Digits)</label>
    <input type="password" id="cfg-pin" pattern="[0-9]{4}" value="${acc.masterPin}">
    <button class="btn-primary" onclick="saveSettings()">${t('save')}</button>
  `;
  openSheet(t('restaurantSettings'), form);
}

function saveSettings() {
  const acc = currentAccount();
  acc.name = document.getElementById('cfg-name').value.trim();
  acc.phone = document.getElementById('cfg-phone').value.trim();
  acc.address = document.getElementById('cfg-addr').value.trim();
  acc.upi = document.getElementById('cfg-upi').value.trim();
  acc.googleReview = document.getElementById('cfg-review').value.trim();
  acc.gstRate = parseFloat(document.getElementById('cfg-gst').value) || 0;
  acc.masterPin = document.getElementById('cfg-pin').value.trim() || acc.masterPin;
  persistSystemData();
  closeSheet();
  renderCurrentView();
}

checkAuth();
