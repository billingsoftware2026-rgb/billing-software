<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>TableMaster Pro — Restaurant Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--border:#e6e8f0;--text:#0f172a;--muted:#64748b;
  --primary:#6366f1;--primary-2:#8b5cf6;--success:#10b981;--danger:#ef4444;
  --warning:#f59e0b;--info:#3b82f6;--gold:#d4a574;
  --sidebar-bg:linear-gradient(180deg,#0f172a 0%,#1a2332 100%);
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 4px 12px rgba(15,23,42,.06),0 2px 4px rgba(15,23,42,.04);
  --shadow-lg:0 20px 40px rgba(15,23,42,.12);--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

button{cursor:pointer;border:none;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:600;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
.btn{background:#eef2f7;color:#334155}
.btn:hover{background:#e2e8f0}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.35)}
.btn-primary:hover{box-shadow:0 6px 20px rgba(99,102,241,.45);transform:translateY(-1px)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.3)}
.btn-success:hover{box-shadow:0 6px 20px rgba(16,185,129,.4);transform:translateY(-1px)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px;min-height:34px}
.btn-block{width:100%}

input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:12px;background:#fff;color:var(--text);transition:.15s;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.field{margin-bottom:6px}

/* AUTH */
.auth-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top left,#1e293b 0%,#0f172a 60%),#0f172a;position:relative;overflow:hidden}
.auth-wrap::before{content:'';position:absolute;top:-50%;left:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.25),transparent 70%);pointer-events:none}
.auth-wrap::after{content:'';position:absolute;bottom:-30%;right:-5%;width:500px;height:500px;background:radial-gradient(circle,rgba(212,165,116,.15),transparent 70%);pointer-events:none}
.auth-card{background:#fff;padding:36px;border-radius:20px;width:100%;max-width:420px;box-shadow:0 30px 60px rgba(0,0,0,.35);position:relative;z-index:1;max-height:calc(100dvh - 40px);overflow-y:auto}
.auth-brand{text-align:center;margin-bottom:28px}
.auth-brand .icon{width:56px;height:56px;background:linear-gradient(135deg,var(--primary),var(--primary-2));border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 10px 24px rgba(99,102,241,.35)}
.auth-brand h1{font-family:'Playfair Display',serif;font-size:26px;color:#0f172a;margin-bottom:4px}
.auth-brand p{color:var(--muted);font-size:13px}
.auth-tabs{display:flex;gap:4px;margin-bottom:22px;background:#f1f5f9;padding:4px;border-radius:12px}
.auth-tab{flex:1;padding:10px;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;font-size:13px;min-height:auto}
.auth-tab.active{background:#fff;color:var(--primary);box-shadow:var(--shadow-sm)}

/* SHELL */
.app-shell{display:flex;min-height:100dvh}
.sidebar{width:250px;background:var(--sidebar-bg);color:#cbd5e1;display:flex;flex-direction:column;position:fixed;height:100dvh;z-index:101;box-shadow:4px 0 24px rgba(0,0,0,.06);transition:transform .3s ease,width .2s}
.sidebar-brand{padding:24px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand .logo{width:42px;height:42px;background:linear-gradient(135deg,var(--primary),var(--primary-2));border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(99,102,241,.4);flex-shrink:0}
.sidebar-brand .name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:#fff;line-height:1.2;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-brand .tag{font-size:10.5px;color:var(--gold);text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
.nav{flex:1;padding:16px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:#64748b;font-weight:700;padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;color:#cbd5e1;font-weight:500;font-size:13.5px;cursor:pointer;transition:all .15s;margin-bottom:2px;background:transparent;width:100%;text-align:left;border:none;min-height:auto;justify-content:flex-start}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(135deg,rgba(99,102,241,.9),rgba(139,92,246,.9));color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.4)}
.nav-item svg{flex-shrink:0}
.sidebar-user{padding:16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#b8935f);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.logout-btn{background:rgba(239,68,68,.15);color:#fca5a5;padding:9px;border-radius:8px;min-height:auto}
.logout-btn:hover{background:rgba(239,68,68,.25);color:#fff}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:100;opacity:0;transition:opacity .25s}
.sidebar-overlay.show{display:block;opacity:1}

.mobile-header{display:none;position:fixed;top:0;left:0;right:0;height:60px;background:#fff;border-bottom:1px solid var(--border);z-index:99;padding:0 16px;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(15,23,42,.04)}
.hamburger{background:#f1f5f9;color:#334155;width:42px;height:42px;border-radius:10px;padding:0;min-height:auto;font-size:20px}
.hamburger:active{background:#e2e8f0}
.mobile-title{flex:1;font-weight:700;font-size:15px;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main-content{flex:1;margin-left:250px;padding:28px;max-width:100%;min-height:100dvh;transition:margin-left .2s}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:26px;font-weight:800;color:#0f172a;letter-spacing:-.5px}
.page-title small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:4px;letter-spacing:0}

.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:1px solid rgba(230,232,240,.5)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{background:#fff;padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(230,232,240,.5);position:relative;overflow:hidden;transition:.2s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:50%;opacity:.08;transform:translate(30%,-30%)}
.stat.purple::before{background:var(--primary)}
.stat.green::before{background:var(--success)}
.stat.amber::before{background:var(--warning)}
.stat.rose::before{background:var(--danger)}
.stat.info::before{background:var(--info)}
.stat-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat.purple .stat-icon{background:rgba(99,102,241,.12);color:var(--primary)}
.stat.green .stat-icon{background:rgba(16,185,129,.12);color:var(--success)}
.stat.amber .stat-icon{background:rgba(245,158,11,.12);color:var(--warning)}
.stat.rose .stat-icon{background:rgba(239,68,68,.12);color:var(--danger)}
.stat.info .stat-icon{background:rgba(59,130,246,.12);color:var(--info)}
.stat-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-value{font-size:26px;font-weight:800;color:#0f172a;letter-spacing:-.5px}
.stat-sub{font-size:12px;color:var(--muted);margin-top:6px}

/* TABLES */
.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.table-card{background:#fff;padding:20px 16px;border-radius:var(--radius);text-align:center;cursor:pointer;border:2px solid transparent;box-shadow:var(--shadow);transition:.2s;position:relative;overflow:hidden}
.table-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.table-card.occupied{border-color:var(--warning);background:linear-gradient(180deg,#fffbeb 0%,#fff 100%)}
.table-card.occupied::before{content:'';position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--warning);border-radius:50%;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.table-icon{width:44px;height:44px;margin:0 auto 10px;background:linear-gradient(135deg,#eef2ff,#e0e7ff);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.table-card.occupied .table-icon{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#d97706}
.table-name{font-weight:700;font-size:15px;color:#0f172a;margin-bottom:2px}
.table-seats{font-size:12px;color:var(--muted)}

/* POS */
.pos-grid{display:grid;grid-template-columns:1fr 400px;gap:20px;align-items:start}
.pos-menu{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;max-height:calc(100dvh - 180px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1;padding-top:2px}
.cat-chip{padding:7px 14px;border-radius:99px;background:#f1f5f9;color:var(--muted);font-size:12.5px;font-weight:600;border:none;min-height:auto;white-space:nowrap}
.cat-chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 10px rgba(99,102,241,.3)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.menu-card{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:.15s}
.menu-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(99,102,241,.15);transform:translateY(-1px)}
.menu-card:active{transform:scale(.98)}
.menu-name{font-weight:600;font-size:13.5px;color:#0f172a;margin-bottom:4px;line-height:1.3}
.menu-price{font-weight:700;color:var(--primary);font-size:14px}
.pos-cart{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;position:sticky;top:28px;max-height:calc(100dvh - 56px);display:flex;flex-direction:column}
.cart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.cart-title{font-size:16px;font-weight:700}
.cart-items{flex:1;overflow-y:auto;margin:0 -18px;padding:0 18px;min-height:80px;max-height:40vh;-webkit-overflow-scrolling:touch}
.cart-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.cart-line:last-child{border-bottom:none}
.cart-line-name{flex:1;font-weight:500;color:#0f172a;min-width:0}
.cart-line-price{font-size:12px;color:var(--muted)}
.qty-controls{display:flex;align-items:center;gap:4px;background:#f1f5f9;border-radius:8px;padding:2px}
.qty-btn{width:28px;height:28px;border-radius:6px;background:#fff;color:var(--primary);font-weight:700;padding:0;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);min-height:auto}
.qty-btn:active{background:var(--primary);color:#fff}
.qty-val{min-width:24px;text-align:center;font-weight:700;font-size:13px}
.cart-total{background:#f8fafc;border-radius:10px;padding:14px;margin-top:14px}
.cart-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--muted)}
.cart-row.grand{font-size:16px;font-weight:800;color:#0f172a;border-top:1px dashed var(--border);padding-top:10px;margin-top:6px}
.cart-row.grand span:last-child{color:var(--primary)}

.pos-mobile-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -8px 24px rgba(15,23,42,.15);padding:12px 16px calc(12px + env(safe-area-inset-bottom));justify-content:space-between;align-items:center;z-index:98;border-top:2px solid var(--primary);border-radius:16px 16px 0 0;gap:12px}

/* KITCHEN */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.kanban-col{background:#f8fafc;border-radius:var(--radius);padding:12px;min-height:200px}
.col-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px}
.col-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.col-count{background:#fff;color:var(--muted);padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700}
.kanban-col.pending .col-title{color:#d97706}
.kanban-col.preparing .col-title{color:#2563eb}
.kanban-col.ready .col-title{color:#059669}
.order-card{background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);border-left:4px solid var(--warning)}
.order-card.preparing{border-left-color:var(--info)}
.order-card.ready{border-left-color:var(--success)}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.order-table{font-weight:700;font-size:15px;color:#0f172a}
.order-time{font-size:11px;color:var(--muted)}
.order-items{font-size:13px;color:#475569;margin-bottom:10px;line-height:1.6}
.order-actions{display:flex;gap:6px}
.order-actions button{flex:1;padding:8px;font-size:12px;min-height:36px}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.badge.pending{background:#fef3c7;color:#b45309}
.badge.preparing{background:#dbeafe;color:#1d4ed8}
.badge.ready{background:#d1fae5;color:#047857}
.badge.billed{background:#e0e7ff;color:#4338ca}
.badge.paid{background:#d1fae5;color:#047857}
.badge.available{background:#d1fae5;color:#047857}
.badge.occupied{background:#fef3c7;color:#b45309}
.badge.owner{background:#ede9fe;color:#6d28d9}
.badge.kitchen{background:#fee2e2;color:#b91c1c}
.badge.waiter{background:#fef3c7;color:#b45309}
.badge.cashier{background:#dbeafe;color:#1e40af}

/* DATA TABLES */
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;overflow-x:auto;-webkit-overflow-scrolling:touch}
.data{width:100%;border-collapse:collapse;min-width:640px}
.data th,.data td{padding:14px 16px;text-align:left;border-bottom:1px solid #f1f5f9}
.data th{background:#f8fafc;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;white-space:nowrap}
.data tr:last-child td{border-bottom:none}
.data tbody tr:hover{background:#f8fafc}
.data .actions{display:flex;gap:6px;flex-wrap:wrap}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-backdrop.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92dvh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:slideUp .25s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-size:18px;font-weight:700}
.modal-close{background:#f1f5f9;color:#64748b;width:34px;height:34px;border-radius:8px;padding:0;min-height:auto;flex-shrink:0}
.modal-close:active{background:#e2e8f0}
.modal-body{padding:24px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* TOAST */
.toast{position:fixed;top:24px;right:24px;left:auto;padding:14px 22px;border-radius:12px;background:#fff;box-shadow:var(--shadow-lg);transform:translateX(150%);transition:transform .3s ease;z-index:9999;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:10px;min-width:200px;max-width:calc(100vw - 48px)}
.toast.show{transform:translateX(0)}
.toast.success{border-left:4px solid var(--success)}
.toast.error{border-left:4px solid var(--danger)}
.toast.warning{border-left:4px solid var(--warning)}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{width:72px;height:72px;background:#f1f5f9;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#94a3b8}
.empty h3{font-size:16px;font-weight:600;color:#334155;margin-bottom:6px}
.empty p{font-size:13px}

/* BILL */
.bill{font-family:'JetBrains Mono','Courier New',monospace;font-size:11px;line-height:1.35;color:#000;background:#fff;padding:12px;width:290px;margin:0 auto}
.bill .logo{max-width:82%;max-height:72px;display:block;margin:0 auto 8px;filter:grayscale(100%) contrast(1.15)}
.bill .brand-name{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;text-align:center;letter-spacing:.4px;line-height:1.15;margin-bottom:2px;text-transform:uppercase}
.bill .tax-label{text-align:center;font-size:9px;font-weight:700;letter-spacing:2px;margin:3px 0 4px;text-transform:uppercase}
.bill .address,.bill .contact,.bill .gstin{text-align:center;font-size:10px;line-height:1.35;margin:0}
.bill .gstin{font-weight:700;margin-top:3px}
.bill .divider-double{border-top:1.5px solid #000;border-bottom:1.5px solid #000;height:3px;margin:8px 0}
.bill .divider-dashed{border-top:1px dashed #000;margin:7px 0}
.bill .meta{width:100%;border-collapse:collapse}
.bill .meta td{padding:1px 0;font-size:10px;vertical-align:top}
.bill .right{text-align:right}
.bill .center{text-align:center}
.bill .items{width:100%;border-collapse:collapse;margin:2px 0}
.bill .items th{font-size:9.5px;text-align:left;padding:3px 0;border-bottom:1px solid #000;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.bill .items td{padding:4px 0;font-size:10.5px;vertical-align:top;border-bottom:1px dotted #999}
.bill .items tr:last-child td{border-bottom:none}
.bill .item-rate{font-size:9px;color:#555;font-style:italic}
.bill .totals{width:100%;border-collapse:collapse}
.bill .totals td{padding:2px 0;font-size:10px}
.bill .grand-total{width:100%;border-collapse:collapse}
.bill .grand-total td{font-size:14px;font-weight:700;padding:4px 0;letter-spacing:.3px}
.bill .grand-total td:first-child{font-size:11.5px}
.bill .qr-section{text-align:center;margin:6px 0}
.bill .qr{width:90px;height:90px;display:inline-block;image-rendering:pixelated}
.bill .qr-label{font-size:9.5px;font-weight:700;margin-top:2px;letter-spacing:.3px}
.bill .qr-sublabel{font-size:8.5px;color:#333;margin-top:1px}
.bill .footer-messages{text-align:center;font-size:10px;line-height:1.5;margin-top:4px;font-style:italic}

.bill .powered{text-align:center;font-size:8px;color:#555;letter-spacing:.5px;margin-top:2px;text-transform:uppercase}
.bill-preview-wrap{background:#f8fafc;padding:20px;border-radius:10px;max-height:65vh;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* REPORTS — Filters & Bars */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.filter-btn{padding:8px 16px;border-radius:99px;background:#f1f5f9;color:#64748b;font-size:13px;font-weight:600;border:none;min-height:auto;white-space:nowrap;transition:.15s}
.filter-btn:hover{background:#e2e8f0;color:#334155}
.filter-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 10px rgba(99,102,241,.3)}
.filter-btn.active:hover{color:#fff}

.bar-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.bar-row:last-child{border-bottom:none}
.bar-rank{width:28px;height:28px;border-radius:50%;background:#f1f5f9;color:#64748b;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.bar-rank.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.bar-rank.silver{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.bar-rank.bronze{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}
.bar-label{flex:0 0 38%;font-size:13px;font-weight:600;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:10px;background:#f1f5f9;border-radius:5px;overflow:hidden;position:relative;min-width:60px}
.bar-fill{height:100%;border-radius:5px;transition:width .5s ease;background:linear-gradient(90deg,var(--primary),var(--primary-2))}
.bar-fill.green{background:linear-gradient(90deg,#10b981,#059669)}
.bar-fill.amber{background:linear-gradient(90deg,#f59e0b,#d97706)}
.bar-fill.rose{background:linear-gradient(90deg,#ef4444,#dc2626)}
.bar-fill.info{background:linear-gradient(90deg,#3b82f6,#2563eb)}
.bar-value{flex:0 0 auto;font-size:12.5px;font-weight:700;color:#0f172a;text-align:right;min-width:90px;white-space:nowrap}
.bar-sub{font-size:11px;color:#94a3b8;font-weight:500;display:block;text-align:right}

.profit-banner{padding:20px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:20px}
.profit-banner.profit{background:linear-gradient(135deg,#d1fae5 0%,#a7f3d0 100%);border-left:4px solid #059669}
.profit-banner.loss{background:linear-gradient(135deg,#fee2e2 0%,#fecaca 100%);border-left:4px solid #dc2626}
.profit-banner .label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.profit-banner.profit .label{color:#047857}
.profit-banner.loss .label{color:#b91c1c}
.profit-banner .value{font-size:32px;font-weight:800;letter-spacing:-1px}
.profit-banner.profit .value{color:#065f46}
.profit-banner.loss .value{color:#991b1b}
.profit-banner .breakdown{display:flex;gap:20px;flex-wrap:wrap;font-size:12px}
.profit-banner .breakdown div{display:flex;flex-direction:column}
.profit-banner .breakdown span:first-child{color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.4px;font-size:10.5px}
.profit-banner .breakdown span:last-child{font-size:15px;font-weight:800;margin-top:2px}

.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.report-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:1px solid rgba(230,232,240,.5)}
.report-card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.report-card h3 small{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}

/* PRINT */
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  body{background:#fff;margin:0;padding:0}

  .bill .qr{width:28mm;height:28mm}

  .bill .footer-messages{font-size:8pt;margin-top:1.5mm}

<body>

<!-- AUTH -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="icon"><svg width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 3v18M3 8h4a4 4 0 010 8H3M17 3v18M17 8c0-2 3-2 3 0v6c0 2 3 2 3 0V3"/></svg></div>
      <h1>TableMaster Pro</h1>
      <p>Premium Restaurant Management</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Login</button>
      <button class="auth-tab" data-tab="register">Register</button>
    </div>
    <form id="login-form">
      <div class="field"><label>Username</label><input id="login-user" required autocomplete="username" placeholder="Enter username"></div>
      <div class="field"><label>Password</label><input id="login-pass" type="password" required autocomplete="current-password" placeholder="Enter password"></div>
      <button type="submit" class="btn-primary btn-block" style="padding:14px;margin-top:6px">Sign In</button>
    </form>
    <form id="register-form" style="display:none">
      <div class="field"><label>Restaurant Name</label><input id="reg-name" required placeholder="e.g. Spice Garden"></div>
      <div class="field"><label>Owner Name</label><input id="reg-owner" required placeholder="Your full name"></div>
      <div class="field"><label>Phone</label><input id="reg-phone" required placeholder="+91 XXXXX XXXXX" inputmode="tel"></div>
      <div class="field"><label>Full Address</label><input id="reg-address" required placeholder="Street, City, State, PIN"></div>
      <div class="field"><label>Admin Username</label><input id="reg-user" required placeholder="Choose username"></div>
      <div class="field"><label>Admin Password</label><input id="reg-pass" type="password" required placeholder="Min 4 characters"></div>
      <div class="field"><label>Master PIN (4-6 digits)</label><input id="reg-pin" type="password" required inputmode="numeric" pattern="[0-9]{4,6}" placeholder="Required to manage staff"></div>
      <button type="submit" class="btn-primary btn-block" style="padding:14px;margin-top:6px">Create Restaurant</button>
    </form>

</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="mobile-header">

<script>
/* ============================================================
   STORAGE
   ============================================================ */
const STORE_KEY='tmpro_v3';
const DB={
  data:{tenants:[],session:null},
  load(){
    try{const raw=localStorage.getItem(STORE_KEY);if(raw)this.data=JSON.parse(raw)}catch(e){console.error(e)}
    if(!Array.isArray(this.data.tenants))this.data.tenants=[];
    if(!('session' in this.data))this.data.session=null;
  },
  save(){localStorage.setItem(STORE_KEY,JSON.stringify(this.data))},
  tenant(){const s=this.data.session;if(!s)return null;return this.data.tenants.find(t=>t.id===s.tenantId)||null},
  get(key,def){const t=this.tenant();if(!t)return def;if(!t.data)t.data={};return t.data[key]!==undefined?t.data[key]:def},
  set(key,val){const t=this.tenant();if(!t)return;if(!t.data)t.data={};t.data[key]=val;this.save()}
};

const ROLE_PERMS={
  owner:['dashboard','tables','menu','pos','kitchen','bills','expenses','reports','staff','settings'],
  kitchen:['kitchen'],
  waiter:['tables','pos'],
  cashier:['tables','pos','bills']
};
function hasPerm(view){const s=DB.data.session;if(!s)return false;return (ROLE_PERMS[s.role]||[]).includes(view)}

/* ============================================================
   UTILS
   ============================================================ */
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toFixed(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initials(n){return (n||'A').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function fmtDateLocal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

const ICONS={
  dashboard:'<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>',
  tables:'<path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>',
  menu:'<path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>',
  pos:'<path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>',
  kitchen:'<path d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/><path d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z"/>',
  bills:'<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>',
  expenses:'<path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>',
  reports:'<path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>',
  staff:'<path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>',
  settings:'<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>'
};
function icon(name,size=18){return `<svg width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${ICONS[name]||''}</svg>`}

function toast(msg,type='success'){
  const t=document.createElement('div');t.className='toast '+type;
  const ic=type==='success'?'✓':type==='error'?'✕':'!';
  t.innerHTML=`<span style="color:${type==='success'?'#10b981':type==='error'?'#ef4444':'#f59e0b'};font-size:18px;font-weight:700">${ic}</span> ${esc(msg)}`;
  document.body.appendChild(t);setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},2800);
}

function generateQR(text){
  if(!text)return '';
  try{
    const d=document.createElement('div');
    new QRCode(d,{text,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});
    const c=d.querySelector('canvas');
    if(c)return c.toDataURL();
    const img=d.querySelector('img');
    if(img)return img.src;
  }catch(e){console.error('QR',e)}
  return '';
}

/* ============================================================

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');

}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

/* ============================================================
   AUTH
   ============================================================ */
function initAuth(){
  document.querySelectorAll('.auth-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const tgt=tab.dataset.tab;
      $('login-form').style.display=tgt==='login'?'block':'none';
      $('register-form').style.display=tgt==='register'?'block':'none';
    });
  });

  $('login-form').addEventListener('submit',e=>{
    e.preventDefault();
    const u=$('login-user').value.trim(),p=$('login-pass').value;
    const owner=DB.data.tenants.find(t=>t.username===u&&t.password===p);
    if(owner){DB.data.session={tenantId:owner.id,role:'owner',staffId:null,name:owner.owner};DB.save();showApp();return}
    for(const t of DB.data.tenants){
      const staff=(t.data?.staff||[]).find(s=>s.username===u&&s.password===p);
      if(staff){DB.data.session={tenantId:t.id,role:staff.role,staffId:staff.id,name:staff.name};DB.save();showApp();return}
    }
    toast('Invalid credentials','error');
  });

  $('register-form').addEventListener('submit',e=>{
    e.preventDefault();
    const u=$('reg-user').value.trim(),pin=$('reg-pin').value.trim();
    if(!/^[0-9]{4,6}$/.test(pin))return toast('Master PIN must be 4-6 digits','error');
    if(DB.data.tenants.find(t=>t.username===u))return toast('Username already exists','error');
    if(DB.data.tenants.find(t=>t.masterPin===pin))return toast('Master PIN already in use','error');
    const t={
      id:'t_'+uid(),name:$('reg-name').value.trim(),owner:$('reg-owner').value.trim(),
      phone:$('reg-phone').value.trim(),address:$('reg-address').value.trim(),
      username:u,password:$('reg-pass').value,masterPin:pin,createdAt:new Date().toISOString(),
      data:{
        tables:[],menu:[],orders:[],expenses:[],staff:[],
        settings:{
          currency:'₹',paperSize:'58',logo:'',paymentInfo:'',billCounter:1000,
          email:'',gstNumber:'',cgstRate:0,sgstRate:0,serviceRate:0,
          googleReviewUrl:'',
          footerMessages:'Thank you for dining with us!\nWe hope to see you again soon.'
        }
      }
    };
    DB.data.tenants.push(t);
    DB.data.session={tenantId:t.id,role:'owner',staffId:null,name:t.owner};
    DB.save();toast('Restaurant registered successfully!');showApp();
  });
}

function logout(){if(!confirm('Logout from current session?'))return;DB.data.session=null;DB.save();location.reload()}

/* ============================================================
   SHELL
   ============================================================ */
function showApp(){
  $('auth-screen').style.display='none';$('app').style.display='block';
  const t=DB.tenant(),s=DB.data.session;
  $('brand-name').textContent=t.name;
  $('mobile-title').textContent=t.name;
  $('user-name').textContent=s.name||t.owner;
  $('user-role').textContent=s.role;
  $('user-avatar').textContent=initials(s.name||t.owner);
  $('mobile-avatar').textContent=initials(s.name||t.owner);
  applyPrintSize();
  const perms=ROLE_PERMS[s.role]||[];
  if(!perms.includes(state.view))state.view=perms[0];
  renderNav();render();
}

function applyPrintSize(){
  const s=DB.get('settings',{});
  const size=s.paperSize==='80'?'80mm':'58mm';
  let st=document.getElementById('print-size-style');
  if(!st){st=document.createElement('style');st.id='print-size-style';document.head.appendChild(st)}
  st.textContent=`@media print{@page{size:${size} auto;margin:2mm}.bill{width:${s.paperSize==='80'?'76mm':'54mm'}}}`;
}

function renderNav(){
  const s=DB.data.session;
  const items=[
    {id:'dashboard',label:'Dashboard'},{id:'tables',label:'Tables'},{id:'menu',label:'Menu'},
    {id:'pos',label:'New Order'},{id:'kitchen',label:'Kitchen'},{id:'bills',label:'Bills'},
    {id:'expenses',label:'Expenses'},{id:'reports',label:'Reports'},{id:'staff',label:'Staff'},
    {id:'settings',label:'Settings'}
  ];
  const perms=ROLE_PERMS[s.role]||[];
  const visible=items.filter(i=>perms.includes(i.id));
  $('nav').innerHTML='<div class="nav-label">Main</div>'+
    visible.map(it=>`<button class="nav-item ${state.view===it.id?'active':''}" onclick="go('${it.id}')">${icon(it.id)}<span>${it.label}</span></button>`).join('');
}

function go(view){
  if(!hasPerm(view))return toast('Access denied','error');
  state.view=view;renderNav();render();closeSidebar();
}

function render(){
  const t=DB.tenant();if(!t)return;
  const map={dashboard:viewDashboard,tables:viewTables,menu:viewMenu,pos:viewPOS,kitchen:viewKitchen,bills:viewBills,expenses:viewExpenses,reports:viewReports,staff:viewStaff,settings:viewSettings};
  $('content').innerHTML=(map[state.view]||viewDashboard)();
}

function openModal(title,bodyHtml,buttons,maxWidth){
  $('modal-title').textContent=title;
  $('modal-body').innerHTML=bodyHtml;
  $('modal-footer').innerHTML='';
  (buttons||[]).forEach(b=>{
    const btn=document.createElement('button');
    btn.className=b.className||'btn';btn.innerHTML=b.text;btn.onclick=b.onClick;
    $('modal-footer').appendChild(btn);
  });
  const m=$('modal').querySelector('.modal');
  m.style.maxWidth=maxWidth||'560px';
  $('modal').classList.add('show');
}
function closeModal(){$('modal').classList.remove('show')}

/* ============================================================

function viewDashboard(){

  const todaySales=todayOrders.filter(o=>o.status==='paid').reduce((a,o)=>a+o.total,0);
  const todayExp=expenses.filter(e=>e.date===d).reduce((a,e)=>a+Number(e.amount),0);
  const active=orders.filter(o=>['pending','preparing','ready'].includes(o.status)).length;
  const avail=tables.filter(t=>t.status==='available').length;
  const occ=tables.filter(t=>t.status==='occupied').length;

      <div class="stat green"><div class="stat-icon">${icon('reports',22)}</div><div class="stat-label">Today's Sales</div><div class="stat-value">${cur}${fmt(todaySales)}</div><div class="stat-sub">${todayOrders.length} orders</div></div>
      <div class="stat rose"><div class="stat-icon">${icon('expenses',22)}</div><div class="stat-label">Today's Expense</div><div class="stat-value">${cur}${fmt(todayExp)}</div><div class="stat-sub">Net: ${cur}${fmt(todaySales-todayExp)}</div></div>
    </div>
    <div class="card">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:14px">Quick Actions</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-primary" onclick="go('pos')">${icon('pos')} Take Order</button>
        <button class="btn" onclick="go('kitchen')">${icon('kitchen')} Kitchen</button>

        <button class="btn" onclick="go('reports')">${icon('reports')} Reports</button>

function deleteMenuItem(id){if(!confirm('Delete this item?'))return;DB.set('menu',DB.get('menu',[]).filter(x=>x.id!==id));render();toast('Item deleted')}

/* ============================================================
   POS
   ============================================================ */
function viewPOS(){
  const menu=DB.get('menu',[]),tables=DB.get('tables',[]),s=DB.get('settings',{});
  const cur=s.currency||'₹';
  const cats=['All',...new Set(menu.map(m=>m.category))];
  const filtered=state.selectedCategory==='All'?menu:menu.filter(m=>m.category===state.selectedCategory);
  const catHtml=cats.map(c=>`<button class="cat-chip ${state.selectedCategory===c?'active':''}" onclick="state.selectedCategory='${esc(c)}';render()">${esc(c)}</button>`).join('');
  const menuHtml=filtered.map(m=>`<div class="menu-card" onclick="addToCart('${m.id}')"><div class="menu-name">${esc(m.name)}</div><div class="menu-price">${cur}${fmt(m.price)}</div></div>`).join('')||`<div class="empty" style="grid-column:1/-1;padding:30px"><p>No items</p></div>`;
  const cartHtml=posCart.items.length?posCart.items.map((it,i)=>`
    <div class="cart-line">
      <div class="cart-line-name"><div>${esc(it.name)}</div><div class="cart-line-price">${cur}${fmt(it.price)} ea</div></div>
      <div class="qty-controls"><button class="qty-btn" onclick="changeQty(${i},-1)">−</button><span class="qty-val">${it.qty}</span><button class="qty-btn" onclick="changeQty(${i},1)">+</button></div>
      <div style="font-weight:700;min-width:56px;text-align:right;font-size:13px">${cur}${fmt(it.price*it.qty)}</div>
    </div>`).join(''):`<div class="empty" style="padding:30px 10px"><div class="empty-icon" style="width:52px;height:52px">${icon('pos',26)}</div><p>No items added</p></div>`;
  const subtotal=posCart.items.reduce((a,i)=>a+i.price*i.qty,0);
  const cgstRate=Number(s.cgstRate)||0,sgstRate=Number(s.sgstRate)||0,serviceRate=Number(s.serviceRate)||0;
  const cgst=subtotal*cgstRate/100,sgst=subtotal*sgstRate/100,service=subtotal*serviceRate/100;
  const total=subtotal+cgst+sgst+service;
  const tableOptions=tables.map(t=>`<option value="${t.id}" ${posCart.tableId===t.id?'selected':''}>${esc(t.name)} (${t.seats})</option>`).join('');
  const mobileBar=posCart.items.length?`
    <div class="pos-mobile-bar">
      <div>
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:700;letter-spacing:.5px">${posCart.items.length} items</div>
        <div style="font-size:19px;font-weight:800;color:#0f172a;letter-spacing:-.3px">${cur}${fmt(total)}</div>
      </div>
      <button class="btn-success" style="padding:12px 22px" onclick="document.querySelector('.pos-cart').scrollIntoView({behavior:'smooth',block:'start'})">View Cart ↓</button>
    </div>`:'';
  return `
    <div class="page-header"><div class="page-title">New Order<small>Select table and items</small></div></div>
    <div style="margin-bottom:16px;max-width:400px">
      <label>Select Table</label>
      <select onchange="posCart.tableId=this.value;render()"><option value="">— Choose —</option>${tableOptions}</select>
    </div>
    <div class="pos-grid">
      <div class="pos-menu"><div class="cat-chips">${catHtml}</div><div class="menu-grid">${menuHtml}</div></div>
      <div class="pos-cart">
        <div class="cart-header"><div class="cart-title">Current Order</div>${posCart.items.length?`<button class="btn btn-sm btn-danger" onclick="posCart.items=[];render()">Clear</button>`:''}</div>
        <div class="cart-items">${cartHtml}</div>
        <div class="cart-total">
          <div class="cart-row"><span>Subtotal</span><span>${cur}${fmt(subtotal)}</span></div>
          ${cgstRate>0?`<div class="cart-row"><span>CGST (${cgstRate}%)</span><span>${cur}${fmt(cgst)}</span></div>`:''}
          ${sgstRate>0?`<div class="cart-row"><span>SGST (${sgstRate}%)</span><span>${cur}${fmt(sgst)}</span></div>`:''}
          ${serviceRate>0?`<div class="cart-row"><span>Service (${serviceRate}%)</span><span>${cur}${fmt(service)}</span></div>`:''}
          <div class="cart-row grand"><span>Total</span><span>${cur}${fmt(total)}</span></div>
        </div>
        <button class="btn-success btn-block" style="margin-top:14px;padding:14px" onclick="placeOrder()">Confirm Order · ${cur}${fmt(total)}</button>
      </div>
    </div>
    ${mobileBar}`;
}

function addToCart(menuId){
  const m=DB.get('menu',[]).find(x=>x.id===menuId);if(!m)return;
  const ex=posCart.items.find(i=>i.menuId===menuId);
  if(ex)ex.qty++;else posCart.items.push({menuId,name:m.name,price:m.price,qty:1});
  render();
}
function changeQty(i,d){posCart.items[i].qty+=d;if(posCart.items[i].qty<=0)posCart.items.splice(i,1);render()}

function placeOrder(){
  if(!posCart.tableId)return toast('Select a table first','error');
  if(!posCart.items.length)return toast('Add at least one item','error');
  const s=DB.get('settings',{});
  const subtotal=posCart.items.reduce((a,i)=>a+i.price*i.qty,0);
  const cgstRate=Number(s.cgstRate)||0,sgstRate=Number(s.sgstRate)||0,serviceRate=Number(s.serviceRate)||0;
  const cgst=+(subtotal*cgstRate/100).toFixed(2),sgst=+(subtotal*sgstRate/100).toFixed(2),service=+(subtotal*serviceRate/100).toFixed(2);
  const total=+(subtotal+cgst+sgst+service).toFixed(2);
  const orders=DB.get('orders',[]);
  orders.push({
    id:uid(),tableId:posCart.tableId,items:posCart.items.map(i=>({...i})),
    subtotal,cgst,cgstRate,sgst,sgstRate,service,serviceRate,total,
    status:'pending',billNumber:null,createdAt:new Date().toISOString()
  });
  DB.set('orders',orders);
  const tables=DB.get('tables',[]);
  const t=tables.find(x=>x.id===posCart.tableId);if(t)t.status='occupied';
  DB.set('tables',tables);
  posCart={tableId:null,items:[]};toast('Order sent to kitchen!');go('kitchen');
}

/* ============================================================
   KITCHEN
   ============================================================ */
function viewKitchen(){
  const orders=DB.get('orders',[]),tables=DB.get('tables',[]);
  const cols=['pending','preparing','ready'];
  const titles={pending:'Pending',preparing:'Preparing',ready:'Ready'};
  const html=cols.map(status=>{
    const list=orders.filter(o=>o.status===status).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
    const cards=list.map(o=>{
      const t=tables.find(x=>x.id===o.tableId);
      return `<div class="order-card ${status}">
        <div class="order-head"><div class="order-table">${esc(t?t.name:'?')}</div><div class="order-time">${new Date(o.createdAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div></div>
        <div class="order-items">${o.items.map(i=>`<div>${i.qty}× ${esc(i.name)}</div>`).join('')}</div>
        <div class="order-actions">
          ${status==='pending'?`<button class="btn-primary btn-sm" onclick="setOrderStatus('${o.id}','preparing')">Start</button>`:''}
          ${status==='preparing'?`<button class="btn-success btn-sm" onclick="setOrderStatus('${o.id}','ready')">Ready</button>`:''}
          ${status==='ready'?`<button class="btn btn-sm" onclick="go('bills')">View Bills</button>`:''}
        </div>
      </div>`;
    }).join('')||`<div class="empty" style="padding:20px;text-align:center;font-size:12px;color:#94a3b8">No orders</div>`;
    return `<div class="kanban-col ${status}"><div class="col-header"><span class="col-title">${titles[status]}</span><span class="col-count">${list.length}</span></div>${cards}</div>`;
  }).join('');
  return `<div class="page-header"><div class="page-title">Kitchen Display<small>Live order tracking</small></div></div><div class="kanban">${html}</div>`;
}
function setOrderStatus(id,status){
  const orders=DB.get('orders',[]);
  const o=orders.find(x=>x.id===id);if(!o)return;
  o.status=status;DB.set('orders',orders);render();toast('Order updated: '+status);
}

/* ============================================================
   BILLS
   ============================================================ */
function viewBills(){
  const orders=DB.get('orders',[]),tables=DB.get('tables',[]),s=DB.get('settings',{}),cur=s.currency||'₹';
  const list=orders.filter(o=>['ready','billed','paid'].includes(o.status)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const rows=list.map(o=>{
    const t=tables.find(x=>x.id===o.tableId);
    const label=o.status==='ready'?'Pending Bill':o.status==='billed'?'Billed':'Paid';
    return `<tr>
      <td><strong>${o.billNumber?'#'+o.billNumber:'—'}</strong></td>
      <td>${esc(t?t.name:'?')}</td>
      <td>${o.items.length} items</td>
      <td><strong>${cur}${fmt(o.total)}</strong></td>
      <td><span class="badge ${o.status}">${label}</span></td>
      <td style="color:#64748b;font-size:12px;white-space:nowrap">${new Date(o.createdAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
      <td><div class="actions">
        ${o.status==='ready'?`<button class="btn-primary btn-sm" onclick="generateBill('${o.id}')">Generate</button>`:''}
        ${o.status==='billed'?`<button class="btn-primary btn-sm" onclick="previewBill('${o.id}')">Print</button><button class="btn-success btn-sm" onclick="markPaid('${o.id}')">✓ Paid</button>`:''}
        ${o.status==='paid'?`<button class="btn btn-sm" onclick="previewBill('${o.id}')">Reprint</button>`:''}
      </div></td>
    </tr>`;
  }).join('');
  return `
    <div class="page-header"><div class="page-title">Bills<small>Manage customer bills</small></div></div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Bill #</th><th>Table</th><th>Items</th><th>Total</th><th>Status</th><th>Time</th><th>Action</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8">No bills yet</td></tr>'}</tbody>
    </table></div>`;
}

function generateBill(orderId){
  const orders=DB.get('orders',[]),o=orders.find(x=>x.id===orderId),s=DB.get('settings',{});
  s.billCounter=(s.billCounter||1000)+1;DB.set('settings',s);
  o.billNumber=s.billCounter;o.status='billed';o.billedAt=new Date().toISOString();
  DB.set('orders',orders);
  const tables=DB.get('tables',[]),t=tables.find(x=>x.id===o.tableId);
  if(t)t.status='available';DB.set('tables',tables);
  render();
  previewBill(orderId);
  toast('Bill #'+o.billNumber+' generated');
}

function markPaid(orderId){
  const orders=DB.get('orders',[]);
  const o=orders.find(x=>x.id===orderId);
  if(!o)return;
  o.status='paid';o.paidAt=new Date().toISOString();
  DB.set('orders',orders);
  render();
  toast('Payment recorded ✓');
}

/* ============================================================
   REPORT HELPERS
   ============================================================ */
function getDateRange(type){
  const now=new Date();
  const todayStr=fmtDateLocal(now);
  const year=now.getFullYear();
  const month=now.getMonth();
  if(type==='today') return {start:todayStr,end:todayStr};
  if(type==='week'){
    const dayOfWeek=now.getDay();
    const start=new Date(now);
    start.setDate(now.getDate()-dayOfWeek);
    return {start:fmtDateLocal(start),end:todayStr};
  }
  if(type==='month'){
    return {start:fmtDateLocal(new Date(year,month,1)),end:todayStr};
  }
  if(type==='lastmonth'){
    return {start:fmtDateLocal(new Date(year,month-1,1)),end:fmtDateLocal(new Date(year,month,0))};
  }
  return {
    start:reportFilter.startDate||todayStr,
    end:reportFilter.endDate||todayStr
  };
}

function setReportFilter(type){
  reportFilter.type=type;
  if(type!=='custom'){
    const r=getDateRange(type);
    reportFilter.startDate=r.start;
    reportFilter.endDate=r.end;
  }else if(!reportFilter.startDate){
    const t=today();
    reportFilter.startDate=t;
    reportFilter.endDate=t;
  }
  render();
}

/* ============================================================
   REPORTS — Full analytics
   ============================================================ */
function viewReports(){
  const s=DB.get('settings',{});
  const cur=s.currency||'₹';
  const range=getDateRange(reportFilter.type);
  const allOrders=DB.get('orders',[]);
  const allExpenses=DB.get('expenses',[]);
  const menu=DB.get('menu',[]);
  const orders=allOrders.filter(o=>{
    const d=o.createdAt.slice(0,10);
    return d>=range.start && d<=range.end;
  });
  const expenses=allExpenses.filter(e=>e.date>=range.start && e.date<=range.end);
  const paid=orders.filter(o=>o.status==='paid');
  const billed=orders.filter(o=>o.status==='billed');
  const sales=paid.reduce((a,o)=>a+o.total,0);
  const pending=billed.reduce((a,o)=>a+o.total,0);
  const expTotal=expenses.reduce((a,e)=>a+Number(e.amount),0);
  const net=sales-expTotal;

  // TOP SELLING ITEMS
  const itemMap={};
  paid.forEach(o=>{
    (o.items||[]).forEach(i=>{
      const key=i.menuId||i.name;
      if(!itemMap[key]) itemMap[key]={name:i.name,qty:0,revenue:0};
      itemMap[key].qty+=i.qty;
      itemMap[key].revenue+=i.price*i.qty;
    });
  });
  const topItems=Object.values(itemMap).sort((a,b)=>b.revenue-a.revenue).slice(0,10);
  const maxItemRev=topItems[0]?.revenue||1;

  // SALES BY CATEGORY
  const itemCat={};menu.forEach(m=>itemCat[m.id]=m.category);
  const catMap={};
  paid.forEach(o=>{
    (o.items||[]).forEach(i=>{
      const cat=itemCat[i.menuId]||'Other';
      if(!catMap[cat]) catMap[cat]={qty:0,revenue:0};
      catMap[cat].qty+=i.qty;
      catMap[cat].revenue+=i.price*i.qty;
    });
  });
  const catSales=Object.entries(catMap).sort((a,b)=>b[1].revenue-a[1].revenue);
  const maxCatRev=catSales[0]?.[1].revenue||1;

  // EXPENSE BY CATEGORY
  const expCatMap={};
  expenses.forEach(e=>{
    if(!expCatMap[e.category]) expCatMap[e.category]=0;
    expCatMap[e.category]+=Number(e.amount);
  });
  const expCats=Object.entries(expCatMap).sort((a,b)=>b[1]-a[1]);
  const maxExpCat=expCats[0]?.[1]||1;

  // DAILY BREAKDOWN
  const dailyMap={};
  paid.forEach(o=>{
    const d=o.createdAt.slice(0,10);
    if(!dailyMap[d]) dailyMap[d]={orders:0,sales:0,exp:0};
    dailyMap[d].orders++;
    dailyMap[d].sales+=o.total;
  });
  expenses.forEach(e=>{
    if(!dailyMap[e.date]) dailyMap[e.date]={orders:0,sales:0,exp:0};
    dailyMap[e.date].exp+=Number(e.amount);
  });
  const daily=Object.entries(dailyMap).sort((a,b)=>b[0].localeCompare(a[0]));

  const filterLabels={today:'Today',week:'This Week',month:'This Month',lastmonth:'Last Month',custom:'Custom Range'};

  return `
    <div class="page-header">
      <div class="page-title">Reports & Analytics<small>${range.start} → ${range.end}</small></div>
      <button class="btn" onclick="exportReportCSV()" style="display:inline-flex">📥 Export CSV</button>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="filter-bar">
        ${['today','week','month','lastmonth','custom'].map(t=>`
          <button class="filter-btn ${reportFilter.type===t?'active':''}" onclick="setReportFilter('${t}')">${filterLabels[t]}</button>
        `).join('')}
      </div>
      ${reportFilter.type==='custom'?`
        <div style="display:flex;gap:12px;margin-top:14px;flex-wrap:wrap">
          <div class="field" style="flex:1;min-width:140px;margin-bottom:0">
            <label>From</label>
            <input type="date" id="filter-start" value="${reportFilter.startDate}" onchange="reportFilter.startDate=this.value;render()">
          </div>
          <div class="field" style="flex:1;min-width:140px;margin-bottom:0">
            <label>To</label>
            <input type="date" id="filter-end" value="${reportFilter.endDate}" onchange="reportFilter.endDate=this.value;render()">
          </div>
        </div>
      `:''}
    </div>

    <div class="profit-banner ${net>=0?'profit':'loss'}">
      <div>
        <div class="label">${net>=0?'Net Profit':'Net Loss'}</div>
        <div class="value">${cur}${fmt(Math.abs(net))}</div>
      </div>
      <div class="breakdown">
        <div><span>Sales</span><span style="color:#059669">${cur}${fmt(sales)}</span></div>
        <div><span>Expenses</span><span style="color:#dc2626">${cur}${fmt(expTotal)}</span></div>
        <div><span>Pending</span><span style="color:#d97706">${cur}${fmt(pending)}</span></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat purple"><div class="stat-icon">${icon('reports',22)}</div><div class="stat-label">Total Orders</div><div class="stat-value">${orders.length}</div><div class="stat-sub">${paid.length} paid · ${billed.length} pending</div></div>
      <div class="stat green"><div class="stat-icon">${icon('bills',22)}</div><div class="stat-label">Sales (Paid)</div><div class="stat-value">${cur}${fmt(sales)}</div></div>
      <div class="stat amber"><div class="stat-icon">${icon('bills',22)}</div><div class="stat-label">Pending Bills</div><div class="stat-value">${cur}${fmt(pending)}</div></div>
      <div class="stat rose"><div class="stat-icon">${icon('expenses',22)}</div><div class="stat-label">Expenses</div><div class="stat-value">${cur}${fmt(expTotal)}</div></div>
    </div>

    <div class="report-grid">
      <div class="report-card">
        <h3>🏆 Top Selling Items <small>by revenue</small></h3>
        ${topItems.length?topItems.map((it,idx)=>{
          const pct=(it.revenue/maxItemRev)*100;
          const rankClass=idx===0?'gold':idx===1?'silver':idx===2?'bronze':'';
          return `<div class="bar-row">
            <div class="bar-rank ${rankClass}">${idx+1}</div>
            <div class="bar-label">${esc(it.name)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="bar-value">${cur}${fmt(it.revenue)}<span class="bar-sub">${it.qty} sold</span></div>
          </div>`;
        }).join(''):'<p style="color:#94a3b8;text-align:center;padding:20px">No paid orders in this period</p>'}
      </div>

      <div class="report-card">
        <h3>🍽️ Sales by Category</h3>
        ${catSales.length?catSales.map(([cat,data])=>{
          const pct=(data.revenue/maxCatRev)*100;
          return `<div class="bar-row">
            <div class="bar-label" style="flex:0 0 30%">${esc(cat)}</div>
            <div class="bar-track"><div class="bar-fill green" style="width:${pct}%"></div></div>
            <div class="bar-value">${cur}${fmt(data.revenue)}<span class="bar-sub">${data.qty} items</span></div>
          </div>`;
        }).join(''):'<p style="color:#94a3b8;text-align:center;padding:20px">No data</p>'}
      </div>

      <div class="report-card">
        <h3>💸 Expense Breakdown</h3>
        ${expCats.length?expCats.map(([cat,amt])=>{
          const pct=(amt/maxExpCat)*100;
          return `<div class="bar-row">
            <div class="bar-label" style="flex:0 0 34%">${esc(cat)}</div>
            <div class="bar-track"><div class="bar-fill rose" style="width:${pct}%"></div></div>
            <div class="bar-value">${cur}${fmt(amt)}</div>
          </div>`;
        }).join(''):'<p style="color:#94a3b8;text-align:center;padding:20px">No expenses</p>'}
      </div>

      <div class="report-card">
        <h3>📊 Quick Summary</h3>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9">
            <span style="color:#64748b;font-size:13px">Total Orders</span>
            <strong style="color:#0f172a">${orders.length}</strong>
          </div>
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9">
            <span style="color:#64748b;font-size:13px">Paid Orders</span>
            <strong style="color:#059669">${paid.length}</strong>
          </div>
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9">
            <span style="color:#64748b;font-size:13px">Avg Order Value</span>
            <strong style="color:#0f172a">${cur}${fmt(paid.length?sales/paid.length:0)}</strong>
          </div>
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9">
            <span style="color:#64748b;font-size:13px">Items Sold</span>
            <strong style="color:#6366f1">${Object.values(itemMap).reduce((a,i)=>a+i.qty,0)}</strong>
          </div>
          <div style="display:flex;justify-content:space-between;padding:10px 0">
            <span style="color:#64748b;font-size:13px">Profit Margin</span>
            <strong style="color:${net>=0?'#059669':'#dc2626'}">${sales?((net/sales)*100).toFixed(1):'0.0'}%</strong>
          </div>
        </div>
      </div>
    </div>

    <div class="report-card" style="margin-top:16px">
      <h3>📅 Daily Breakdown</h3>
      <div class="table-wrap" style="box-shadow:none;border:1px solid #f1f5f9">
        <table class="data" style="min-width:480px">
          <thead><tr><th>Date</th><th>Orders</th><th>Sales</th><th>Expenses</th><th>Profit</th></tr></thead>
          <tbody>
            ${daily.length?daily.map(([date,d])=>{
              const profit=d.sales-d.exp;
              return `<tr>
                <td><strong>${date}</strong></td>
                <td>${d.orders}</td>
                <td>${cur}${fmt(d.sales)}</td>
                <td style="color:#dc2626">${cur}${fmt(d.exp)}</td>
                <td style="color:${profit>=0?'#059669':'#dc2626'};font-weight:700">${cur}${fmt(profit)}</td>
              </tr>`;

          </tbody>

function exportReportCSV(){
  const range=getDateRange(reportFilter.type);
  const orders=DB.get('orders',[]).filter(o=>{
    const d=o.createdAt.slice(0,10);
    return d>=range.start && d<=range.end && o.status==='paid';
  });
  const expenses=DB.get('expenses',[]).filter(e=>e.date>=range.start && e.date<=range.end);
  const s=DB.get('settings',{}),cur=s.currency||'₹';

  let csv='TableMaster Pro - Report\n';
  csv+=`Period,${range.start} to ${range.end}\n\n`;

  csv+='SALES\n';
  csv+=`Bill No,Date,Table,Total\n`;
  orders.forEach(o=>{
    const t=DB.get('tables',[]).find(x=>x.id===o.tableId);
    csv+=`${o.billNumber||''},${o.createdAt.slice(0,10)},${t?t.name:''},${fmt(o.total)}\n`;
  });
  const totalSales=orders.reduce((a,o)=>a+o.total,0);
  csv+=`Total Sales,,,,${fmt(totalSales)}\n\n`;

  csv+='EXPENSES\n';
  csv+=`Date,Category,Description,Amount\n`;
  expenses.forEach(e=>{
    csv+=`${e.date},${e.category},${e.description||''},${fmt(e.amount)}\n`;
  });
  const totalExp=expenses.reduce((a,e)=>a+Number(e.amount),0);
  csv+=`Total Expenses,,,,${fmt(totalExp)}\n\n`;
  csv+=`NET PROFIT,,,,${fmt(totalSales-totalExp)}\n`;

  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`report_${range.start}_to_${range.end}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Report exported');
}

   STAFF
   ============================================================ */
function viewStaff(){
  if(DB.data.session.role!=='owner')return '<div class="empty">Access denied</div>';
  const staff=DB.get('staff',[]);
  const rows=staff.map(s=>`<tr>
    <td><div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0">${initials(s.name)}</div>
      <div><div style="font-weight:600">${esc(s.name)}</div><div style="font-size:12px;color:#64748b">@${esc(s.username)}</div></div>
    </div></td>
    <td><span class="badge ${s.role}">${s.role}</span></td>
    <td style="color:#64748b;font-size:12px">${new Date(s.createdAt).toLocaleDateString('en-GB')}</td>
    <td><div class="actions">
      <button class="btn btn-sm" onclick="editStaffModal('${s.id}')">Edit</button>
      <button class="btn btn-sm btn-danger" onclick="deleteStaff('${s.id}')">Delete</button>
    </div></td>
  </tr>`).join('');
  return `
    <div class="page-header"><div class="page-title">Staff<small>Manage team access</small></div><button class="btn-primary" onclick="addStaffModal()">+ Add Staff</button></div>
    <div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,#fef3c7 0%,#fff 100%);border-left:4px solid #f59e0b">
      <div style="font-size:13px;color:#92400e"><strong>🔒 Master PIN required</strong> to add or modify staff accounts.</div>
    </div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Staff</th><th>Role</th><th>Added</th><th>Actions</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="4" style="text-align:center;padding:40px;color:#94a3b8">No staff yet</td></tr>'}</tbody>
    </table></div>`;
}

function requirePin(cb){
  openModal('Master PIN Required',`
    <p style="color:#64748b;margin-bottom:16px">Enter your master PIN to continue.</p>
    <div class="field"><label>Master PIN</label><input id="pin-check" type="password" inputmode="numeric" autofocus></div>
  `,[
    {text:'Cancel',onClick:closeModal},
    {text:'Verify',className:'btn-primary',onClick:()=>{
      const pin=$('pin-check').value.trim(),t=DB.tenant();
      if(pin===t.masterPin){closeModal();setTimeout(cb,150)}else toast('Incorrect PIN','error');
    }}
  ]);
}

function addStaffModal(editId){
  requirePin(()=>{
    const staff=DB.get('staff',[]);
    const s=editId?staff.find(x=>x.id===editId):{name:'',username:'',password:'',role:'waiter'};
    openModal(editId?'Edit Staff':'Add Staff Member',`
      <div class="field"><label>Full Name</label><input id="st-name" value="${esc(s.name)}" placeholder="Ramesh Kumar"></div>
      <div class="field"><label>Username</label><input id="st-user" value="${esc(s.username)}" placeholder="ramesh" autocomplete="off"></div>
      <div class="field"><label>Password</label><input id="st-pass" type="text" value="${esc(s.password)}" placeholder="password" autocomplete="off"></div>
      <div class="field"><label>Role</label>
        <select id="st-role">
          <option value="kitchen" ${s.role==='kitchen'?'selected':''}>Kitchen (Kitchen only)</option>
          <option value="waiter" ${s.role==='waiter'?'selected':''}>Waiter (Tables + Order)</option>
          <option value="cashier" ${s.role==='cashier'?'selected':''}>Cashier (Tables + Order + Bills)</option>
        </select>
      </div>
    `,[
      {text:'Cancel',onClick:closeModal},
      {text:'Save',className:'btn-primary',onClick:()=>{
        const name=$('st-name').value.trim(),username=$('st-user').value.trim(),password=$('st-pass').value.trim(),role=$('st-role').value;
        if(!name||!username||!password)return toast('Fill all fields','error');
        const exists=DB.data.tenants.some(t=>t.username===username||(t.data?.staff||[]).some(x=>x.username===username&&x.id!==editId));
        if(exists)return toast('Username already in use','error');
        if(editId){s.name=name;s.username=username;s.password=password;s.role=role}
        else staff.push({id:uid(),name,username,password,role,createdAt:new Date().toISOString()});
        DB.set('staff',staff);closeModal();render();toast('Staff saved');
      }}
    ]);
  });
}
function editStaffModal(id){addStaffModal(id)}
function deleteStaff(id){requirePin(()=>{if(!confirm('Delete this staff?'))return;DB.set('staff',DB.get('staff',[]).filter(x=>x.id!==id));render();toast('Staff removed')})}

   ============================================================ */

  const t=DB.tenant(),s=DB.get('settings',{});
  return `
    <div class="page-header"><div class="page-title">Settings<small>Configure your restaurant</small></div></div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">🍽️ Restaurant Information</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
        <div class="field"><label>Restaurant Name</label><input id="set-name" value="${esc(t.name)}"></div>
        <div class="field"><label>Phone</label><input id="set-phone" value="${esc(t.phone||'')}" inputmode="tel"></div>
        <div class="field" style="grid-column:1/-1"><label>Full Address</label><input id="set-address" value="${esc(t.address||'')}"></div>
        <div class="field"><label>Email</label><input id="set-email" value="${esc(s.email||'')}" inputmode="email"></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">🧾 Tax & GST</h3>
      <div style="background:#f8fafc;padding:12px;border-radius:8px;margin-bottom:14px;font-size:12.5px;color:#64748b">
        Leave rates at <b>0</b> to hide tax lines from bills. Fill rates to show CGST/SGST/Service on invoices.
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">
        <div class="field" style="grid-column:1/-1"><label>GST Number (GSTIN)</label><input id="set-gst" placeholder="e.g. 22AAAAA0000A1Z5" value="${esc(s.gstNumber||'')}"></div>
        <div class="field"><label>CGST Rate (%)</label><input id="set-cgst" type="number" min="0" step="0.01" value="${s.cgstRate||0}" inputmode="decimal"></div>
        <div class="field"><label>SGST Rate (%)</label><input id="set-sgst" type="number" min="0" step="0.01" value="${s.sgstRate||0}" inputmode="decimal"></div>
        <div class="field"><label>Service Charge (%)</label><input id="set-service" type="number" min="0" step="0.01" value="${s.serviceRate||0}" inputmode="decimal"></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">💳 Billing</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
        <div class="field"><label>Currency</label><input id="set-currency" value="${esc(s.currency||'₹')}"></div>
        <div class="field"><label>Paper Size</label>
          <select id="set-paper">
            <option value="58" ${s.paperSize==='58'?'selected':''}>58mm (2")</option>
            <option value="80" ${s.paperSize==='80'?'selected':''}>80mm (3")</option>
          </select>
        </div>
        <div class="field" style="grid-column:1/-1"><label>Payment Link (UPI / QR)</label><input id="set-pay" placeholder="upi://pay?pa=yourname@upi&pn=Restaurant" value="${esc(s.paymentInfo||'')}"></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">⭐ Reviews & Messages</h3>
      <div class="field"><label>Google Review URL</label>
        <input id="set-review" placeholder="https://g.page/r/XXXXX/review" value="${esc(s.googleReviewUrl||'')}">
        <div style="font-size:11.5px;color:#64748b;margin-top:4px">Customers scan QR on bill to leave a Google review.</div>
      </div>
      <div class="field"><label>Footer Messages (one per line)</label>
        <textarea id="set-footer" rows="4" placeholder="Thank you for dining with us!">${esc(s.footerMessages||'')}</textarea>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">🖼️ Restaurant Logo</h3>
      ${s.logo?`<div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap"><img src="${s.logo}" style="max-width:140px;max-height:80px;border:1px solid #e6e8f0;border-radius:8px;padding:6px;background:#fff"><button class="btn btn-danger btn-sm" onclick="removeLogo()">Remove</button></div>`:'<p style="color:#64748b;margin-bottom:12px;font-size:13px">No logo uploaded. Logo will print at the top of every bill.</p>'}
      <input type="file" id="set-logo" accept="image/*">
    </div>
    <button class="btn-primary" style="padding:14px 28px;width:100%;max-width:300px" onclick="saveSettings()">💾 Save Settings</button>`;
}

function saveSettings(){
  const t=DB.tenant();
  t.name=$('set-name').value.trim()||t.name;
  t.phone=$('set-phone').value.trim();
  t.address=$('set-address').value.trim();
  const s=DB.get('settings',{});
  s.email=$('set-email').value.trim();
  s.gstNumber=$('set-gst').value.trim();
  s.cgstRate=parseFloat($('set-cgst').value)||0;
  s.sgstRate=parseFloat($('set-sgst').value)||0;
  s.serviceRate=parseFloat($('set-service').value)||0;
  s.currency=$('set-currency').value.trim()||'₹';
  s.paperSize=$('set-paper').value;
  s.paymentInfo=$('set-pay').value.trim();
  s.googleReviewUrl=$('set-review').value.trim();
  s.footerMessages=$('set-footer').value;
  DB.set('settings',s);DB.save();
  $('brand-name').textContent=t.name;
  $('mobile-title').textContent=t.name;
  applyPrintSize();toast('Settings saved');render();
}

document.addEventListener('change',e=>{
  if(e.target.id==='set-logo'&&e.target.files[0]){
    const r=new FileReader();
    r.onload=()=>{const s=DB.get('settings',{});s.logo=r.result;DB.set('settings',s);render();toast('Logo uploaded')};
    r.readAsDataURL(e.target.files[0]);
  }
});
function removeLogo(){const s=DB.get('settings',{});s.logo='';DB.set('settings',s);render();toast('Logo removed')}

document.addEventListener('click',e=>{
  if(e.target.closest('.sidebar'))return;
  if(document.getElementById('sidebar').classList.contains('open')&&!e.target.closest('.hamburger')){
    closeSidebar();
  }
});

if(DB.data.session&&DB.tenant()){showApp()}
else{$('auth-screen').style.display='flex';$('app').style.display='none'}
