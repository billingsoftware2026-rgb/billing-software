<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folder Compatibility Finder - SmartFixPro</title>
  <style>
    :root {
      --bg-dark: #0b0d17;
      --card-bg: rgba(22, 27, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-accent: #6366f1;
      --primary-glow: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --tag-bg: rgba(99, 102, 241, 0.15);
      --tag-border: rgba(99, 102, 241, 0.3);
      --tag-text: #a5b4fc;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px 14px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px 20px;
      backdrop-filter: blur(18px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .icon-box svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .title-area h2 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .title-area p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .search-box {
      position: relative;
      margin-bottom: 16px;
    }

    .search-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 14px 16px 14px 44px;
      border-radius: 14px;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      display: flex;
    }

    .results-count {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 4px;
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 580px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .results-container::-webkit-scrollbar {
      width: 5px;
    }
    .results-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
    }

    .group-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      transition: transform 0.2s ease;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 8px;
    }

    .model-code {
      font-size: 0.85rem;
      font-weight: 700;
      color: #818cf8;
      letter-spacing: 0.3px;
    }

    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .compatible-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--tag-text);
      font-size: 0.74rem;
      padding: 5px 9px;
      border-radius: 8px;
      line-height: 1.3;
    }

    .tag.highlight {
      background: #4f46e5;
      color: #fff;
      border-color: #6366f1;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
    }

    .empty-state {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>

    const searchInput = document.getElementById('searchInput');
    const resultsList = document.getElementById('resultsList');
    const resultsCount = document.getElementById('resultsCount');

    function renderResults(filter = '') {
      const query = filter.trim().toLowerCase();
      resultsList.innerHTML = '';

      const matchedGroups = compatibilityDB.filter(group => {
        if (!query) return true;
        const inCode = group.code.toLowerCase().includes(query);
        const inModels = group.models.some(m => m.toLowerCase().includes(query));
        return inCode || inModels;
      });

      if (matchedGroups.length === 0) {
        resultsCount.textContent = 'No matching models found';
        resultsList.innerHTML = `
          <div class="empty-state">
            <p>🔍 No compatible folder found for "${filter}".</p>
          </div>
        `;
        return;
      }

      resultsCount.textContent = `Showing ${matchedGroups.length} compatible group(s)`;

      matchedGroups.forEach(group => {
        const card = document.createElement('div');
        card.className = 'group-card';

        const tagElements = group.models.map(model => {
          const isMatch = query && model.toLowerCase().includes(query);
          return `<span class="tag ${isMatch ? 'highlight' : ''}">${model}</span>`;
        }).join('');

        card.innerHTML = `
          <div class="group-header">
            <span class="model-code">${group.code}</span>
            <span class="badge">${group.models.length} Models Compatible</span>
          </div>
          <div class="compatible-tags">
            ${tagElements}
          </div>
        `;
        resultsList.appendChild(card);
      });
    }

    renderResults();

    searchInput.addEventListener('input', (e) => {
      renderResults(e.target.value);
    });
