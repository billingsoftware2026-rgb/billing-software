<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartFix ERP · Developer Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
body{background:#0f172a;font-family:Inter,system-ui,sans-serif}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 4px 20px rgba(15,23,42,.08)}.inp{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;outline:0}.inp:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.12)}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#0284c7;color:#fff}.danger{background:#fee2e2;color:#991b1b}.muted{color:#64748b}.pill{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal>div{max-width:620px;width:100%;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md p-7">
    <div class="text-center mb-6"><div class="text-4xl">🛠️</div><h1 class="text-2xl font-black mt-2">SmartFix Developer Console</h1><p class="text-xs muted mt-1">Firebase-secured administration</p></div>
    <input id="email" type="email" class="inp mb-3" placeholder="Developer email">
    <input id="password" type="password" class="inp mb-4" placeholder="Password">
    <button class="btn primary w-full" onclick="login()">Sign in</button>
    <div id="loginError" class="text-xs text-red-600 mt-3"></div>
  </div>
</div>

<div id="app" class="hidden min-h-screen">
<header class="bg-slate-950 text-white sticky top-0 z-30 border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
    <div><div class="font-black text-lg">SmartFix ERP · Developer</div><div id="devEmail" class="text-[10px] text-slate-400"></div></div>
    <button class="btn bg-slate-800 text-white" onclick="logout()">Logout</button>
  </div>
</header>
<main class="max-w-7xl mx-auto p-4 lg:p-6 space-y-5">
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    <div class="card p-4"><div class="text-[10px] uppercase font-bold muted">Total Shops</div><div id="totalShops" class="text-2xl font-black mt-1">0</div></div>
    <div class="card p-4"><div class="text-[10px] uppercase font-bold muted">Active</div><div id="activeShops" class="text-2xl font-black text-emerald-700 mt-1">0</div></div>
    <div class="card p-4"><div class="text-[10px] uppercase font-bold muted">Suspended</div><div id="suspendedShops" class="text-2xl font-black text-rose-700 mt-1">0</div></div>
    <div class="card p-4"><div class="text-[10px] uppercase font-bold muted">Last Refresh</div><div id="lastRefresh" class="text-xs font-bold mt-2">—</div></div>
  </div>

  <div class="card p-4">
    <div class="flex flex-wrap gap-3 items-center justify-between">
      <div><h2 class="font-black">Shopkeepers</h2><p class="text-xs muted">Search, inspect, edit and control tenant status.</p></div>
      <div class="flex gap-2"><input id="search" oninput="renderShops()" class="inp w-64" placeholder="Shop / owner / mobile / email"><button class="btn primary" onclick="openCreateShop()">+ New Shopkeeper</button></div>
    </div>
  </div>

  <div class="card overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-100 text-slate-600 text-[10px] uppercase"><tr><th class="p-3 text-left">Shop</th><th class="p-3 text-left">Owner</th><th class="p-3 text-left">Contact</th><th class="p-3">Status</th><th class="p-3">Data</th><th class="p-3 text-right">Actions</th></tr></thead><tbody id="shopRows"></tbody></table></div>
  </div>
</main>
</div>

<script>
const CONFIG={apiKey:"AIzaSyDbAlfyb040xKffRx20SGBvwuitsA1zTSE",authDomain:"smartfix-a6733.firebaseapp.com",projectId:"smartfix-a6733",storageBucket:"smartfix-a6733.firebasestorage.app",messagingSenderId:"346183509613",appId:"1:346183509613:web:d710eb153e1aef89cb8164",measurementId:"G-WT1FKF5ZQT"};
const app=firebase.initializeApp(CONFIG);const auth=firebase.auth(app);const db=firebase.firestore(app);
let shops=[],isDeveloper=false;
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hashPass=str=>{let h=0;for(let i=0;i<str.length;i++)h=((h<<5)-h+str.charCodeAt(i))|0;return 'h'+Math.abs(h).toString(36)};

auth.onAuthStateChanged(async u=>{if(!u)return;try{const d=await db.collection('developers').doc(u.uid).get();if(!d.exists||d.data().active!==true){await auth.signOut();throw new Error('This Firebase account is not authorized as a developer. Create developers/{UID} with active:true.');}isDeveloper=true;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('devEmail').innerText=u.email||u.uid;await loadShops();}catch(e){document.getElementById('loginError').innerText=e.message;}});

async function login(){document.getElementById('loginError').innerText='';try{await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('password').value);}catch(e){document.getElementById('loginError').innerText=e.message;}}
async function logout(){await auth.signOut();}
async function loadShops(){const snap=await db.collection('shops').orderBy('createdAt','desc').get();shops=snap.docs.map(d=>({id:d.id,...d.data()}));document.getElementById('lastRefresh').innerText=new Date().toLocaleString('en-IN');renderShops();}
function renderShops(){const q=(document.getElementById('search').value||'').toLowerCase();const list=shops.filter(s=>[s.name,s.ownerName,s.phone,s.email,s.gstin].some(x=>(x||'').toString().toLowerCase().includes(q)));document.getElementById('totalShops').innerText=shops.length;document.getElementById('activeShops').innerText=shops.filter(s=>s.status!=='suspended').length;document.getElementById('suspendedShops').innerText=shops.filter(s=>s.status==='suspended').length;document.getElementById('shopRows').innerHTML=list.length?list.map(s=>`<tr class="border-t"><td class="p-3"><div class="font-bold">${esc(s.name||'—')}</div><div class="text-[10px] muted font-mono">${esc(s.id)}</div></td><td class="p-3">${esc(s.ownerName||'—')}</td><td class="p-3 text-xs">${esc(s.phone||'—')}<br>${esc(s.email||'—')}</td><td class="p-3 text-center"><span class="pill ${s.status==='suspended'?'bg-rose-100 text-rose-700':'bg-emerald-100 text-emerald-700'}">${esc(s.status||'active')}</span></td><td id="count_${esc(s.id)}" class="p-3 text-center text-[10px] muted">Loading…</td><td class="p-3"><div class="flex justify-end gap-1"><button class="btn bg-slate-100 text-slate-700" onclick="inspectShop('${s.id}')">View</button><button class="btn bg-sky-50 text-sky-700" onclick="editShop('${s.id}')">Edit</button><button class="btn ${s.status==='suspended'?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700'}" onclick="toggleShop('${s.id}')">${s.status==='suspended'?'Activate':'Suspend'}</button><button class="btn danger" onclick="archiveShop('${s.id}')">Archive</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="p-8 text-center muted">No shops found</td></tr>';list.forEach(s=>loadCount(s.id));}
async function loadCount(id){try{const snap=await db.collection('shops').doc(id).collection('data').get();const count=snap.docs.reduce((n,d)=>{const v=d.data().value;return n+(Array.isArray(v)?v.length:(v&&typeof v==='object'?Object.keys(v).length:0));},0);const el=document.getElementById('count_'+id);if(el)el.innerText=count+' records';}catch(e){}}
function modal(html){document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="card p-5">${html}</div></div>`);}
function closeModal(){document.getElementById('modal')?.remove();}
function openCreateShop(){modal(`<h2 class="text-xl font-black mb-4">Create Shopkeeper</h2><div class="grid grid-cols-2 gap-3"><input id="csName" class="inp" placeholder="Shop name"><input id="csOwner" class="inp" placeholder="Owner name"><input id="csPhone" class="inp" placeholder="Mobile"><input id="csEmail" class="inp" placeholder="Email"><input id="csPass" type="password" class="inp" placeholder="Password min 6"><input id="csGST" class="inp" placeholder="GSTIN"></div><div class="flex gap-2 mt-4"><button class="btn bg-slate-100" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createShop()">Create</button></div>`);}
async function createShop(){const name=csName.value.trim(),ownerName=csOwner.value.trim(),phone=csPhone.value.trim(),email=csEmail.value.trim(),pass=csPass.value,gstin=csGST.value.trim();if(!name||!ownerName||!email||pass.length<6){alert('Fill required fields');return;}let secondary;try{secondary=firebase.initializeApp(CONFIG,'developerCreate_'+Date.now());const au=firebase.auth(secondary);const cred=await au.createUserWithEmailAndPassword(email,pass);const shopId='shop_'+cred.user.uid;const user={id:'u_'+Date.now(),firebaseUid:cred.user.uid,userId:phone,name:ownerName,phone,email,role:'owner',designation:'Shop Owner',passwordHash:hashPass(pass),status:'active',createdAt:new Date().toISOString(),lastLogin:null};await db.collection('shops').doc(shopId).set({shopId,ownerUid:cred.user.uid,name,ownerName,phone,email,gstin,status:'active',createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('shops').doc(shopId).collection('data').doc('users').set({value:[user],updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('shops').doc(shopId).collection('data').doc('shopProfile').set({value:{name,phone,email,gstin,firebaseShopId:shopId,ownerUid:cred.user.uid,masterPin:'1234'},updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await au.signOut();await secondary.delete();closeModal();await loadShops();alert('Shopkeeper created.');}catch(e){alert(e.message);try{await secondary?.delete()}catch(_){} }}
async function editShop(id){const s=shops.find(x=>x.id===id);if(!s)return;modal(`<h2 class="text-xl font-black mb-4">Edit Shop</h2><div class="space-y-3"><input id="esName" class="inp" value="${esc(s.name||'')}"><input id="esOwner" class="inp" value="${esc(s.ownerName||'')}"><input id="esPhone" class="inp" value="${esc(s.phone||'')}"><input id="esGST" class="inp" value="${esc(s.gstin||'')}"></div><div class="flex gap-2 mt-4"><button class="btn bg-slate-100" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveShop('${id}')">Save</button></div>`);}
async function saveShop(id){await db.collection('shops').doc(id).set({name:esName.value.trim(),ownerName:esOwner.value.trim(),phone:esPhone.value.trim(),gstin:esGST.value.trim(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});closeModal();await loadShops();}
async function toggleShop(id){const s=shops.find(x=>x.id===id);if(!s)return;if(!confirm(`${s.status==='suspended'?'Activate':'Suspend'} ${s.name}?`))return;await db.collection('shops').doc(id).update({status:s.status==='suspended'?'active':'suspended',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await loadShops();}
async function inspectShop(id){const s=shops.find(x=>x.id===id);const snap=await db.collection('shops').doc(id).collection('data').get();const rows=snap.docs.map(d=>{const v=d.data().value;return `<tr class="border-t"><td class="p-2 font-mono text-xs">${esc(d.id)}</td><td class="p-2 text-right">${Array.isArray(v)?v.length:(v&&typeof v==='object'?Object.keys(v).length:1)}</td><td class="p-2 text-right">${d.data().updatedAt?.toDate?d.data().updatedAt.toDate().toLocaleString('en-IN'):'—'}</td></tr>`}).join('');modal(`<div class="flex justify-between"><div><h2 class="text-xl font-black">${esc(s.name)}</h2><p class="text-xs muted">${esc(s.ownerName)} · ${esc(s.email||'')}</p></div><button class="btn bg-slate-100" onclick="closeModal()">Close</button></div><div class="mt-4 overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-100"><tr><th class="p-2 text-left">Collection</th><th class="p-2 text-right">Records</th><th class="p-2 text-right">Updated</th></tr></thead><tbody>${rows}</tbody></table></div>`);}
async function archiveShop(id){const s=shops.find(x=>x.id===id);if(!s||!confirm(`Archive ${s.name}? This removes the Firestore shop data. Firebase Authentication account is NOT deleted by browser-only code.`))return;const ref=db.collection('shops').doc(id);const sub=await ref.collection('data').get();const batch=db.batch();sub.docs.forEach(d=>batch.delete(d.ref));batch.delete(ref);await batch.commit();await loadShops();alert('Shop data archived/deleted. Auth user requires Firebase Admin SDK/Cloud Function for permanent account deletion.');}
</script>
</body>
</html>
