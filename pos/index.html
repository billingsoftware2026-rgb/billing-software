function renderServiceListJobs(filter){let jobs=APP.serviceJobs.slice();if(filter==='active')jobs=jobs.filter(j=>!['Delivered','Cancelled'].includes(j.status));else if(filter==='ready')jobs=jobs.filter(j=>j.status==='Ready');else if(filter==='delivered')jobs=jobs.filter(j=>j.status==='Delivered');if(!jobs.length)return '<div class="card text-center py-12"><div class="text-5xl mb-3">🔧</div><div class="font-bold text-slate-700">No service jobs</div></div>';return jobs.map(j=>`<div class="card"><div class="flex items-start justify-between gap-3"><div class="flex-1 min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="font-mono font-bold text-violet-700 text-xs">${j.jobNo}</span><span class="badge badge-${j.status.toLowerCase()}">${j.status}</span></div><div class="font-bold text-slate-900 mt-1">${esc(j.model)}</div><div class="text-xs text-slate-600 mt-0.5">${esc(j.customerName)} · ${j.customerPhone}</div>${j.imei?`<div class="text-[10px] font-mono text-slate-500 mt-1">IMEI: ${esc(j.imei)}</div>`:''}<div class="text-[11px] text-slate-500 mt-1 italic">"${esc((j.problem||'').substring(0,80))}"</div></div></div><div class="flex flex-wrap gap-1.5 mt-3 pt-3 border-t"><button onclick="openJobDetails('${j.id}')" class="btn-icon">👁 Details</button>${!['Delivered','Cancelled'].includes(j.status)?`<select onchange="if(this.value){updateServiceStatus('${j.id}',this.value);this.value=''}" class="text-[11px] border rounded px-2 py-1 font-semibold bg-white"><option value="">Change Status...</option>${SERVICE_STATUSES.filter(s=>s!==j.status).map(s=>`<option value="${s}">${s}</option>`).join('')}</select><button onclick="addSparePart('${j.id}')" class="btn-icon">+ Part</button>`:''}<button onclick="printServiceJobCard('${j.id}')" class="btn-icon">🖨</button>${j.status==='Ready'?`<button onclick="deliverJob('${j.id}')" class="btn-icon" style="background:#d1fae5;color:#065f46">✓ Deliver</button>`:''}<button onclick="deleteServiceJob('${j.id}')" class="btn-icon" style="background:#fee2e2;color:#991b1b">🗑</button></div></div>`).join('');}
function openNewServiceModal(){const html=`<div class="modal-overlay" id="serviceModal" onclick="if(event.target===this)closeModal('serviceModal')"><div class="modal-box" onclick="event.stopPropagation()"><div class="bg-gradient-to-r from-violet-500 to-purple-700 p-4 flex justify-between items-center"><div><div class="text-white font-bold">New Service Job</div><div class="text-violet-100 text-xs font-mono mt-0.5">${nextJobNo()}</div></div><button onclick="closeModal('serviceModal')" class="text-white text-xl">✕</button></div><div class="modal-body space-y-3"><div class="grid grid-cols-2 gap-3"><div><label class="inp-lbl">Customer *</label><input type="text" id="sjCustName" class="inp"></div><div><label class="inp-lbl">Phone *</label><input type="tel" id="sjCustPhone" class="inp font-mono" maxlength="10"></div></div><div class="grid grid-cols-2 gap-3"><div><label class="inp-lbl">Device Model *</label><input type="text" id="sjModel" class="inp"></div><div><label class="inp-lbl">IMEI</label><input type="text" id="sjIMEI" class="inp font-mono"></div></div><div><label class="inp-lbl">Problem *</label><textarea id="sjProblem" class="inp" rows="2"></textarea></div><div class="grid grid-cols-2 gap-3"><div><label class="inp-lbl">Est. Cost ₹</label><input type="number" id="sjEstCost" class="inp font-mono" value="0"></div><div><label class="inp-lbl">Advance ₹</label><input type="number" id="sjAdvance" class="inp font-mono" value="0"></div></div><div class="grid grid-cols-2 gap-3"><div><label class="inp-lbl">Technician</label><select id="sjTechnician" class="inp"><option value="">-- Unassigned --</option>${APP.users.filter(u=>['technician','manager','owner'].includes(u.role)).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div><label class="inp-lbl">Expected</label><input type="date" id="sjExpectedDate" class="inp"></div></div><div><label class="inp-lbl">Photo</label><input type="file" id="sjPhoto" accept="image/*" capture="environment" class="inp text-xs"></div><div class="flex gap-2 pt-2"><button onclick="closeModal('serviceModal')" class="btn-secondary flex-1">Cancel</button><button onclick="saveServiceJob()" class="btn-primary flex-1">Create</button></div></div></div></div>`;document.body.insertAdjacentHTML('beforeend',html);}
function saveServiceJob(){const name=document.getElementById('sjCustName').value.trim();const phone=document.getElementById('sjCustPhone').value.trim();const model=document.getElementById('sjModel').value.trim();const imei=document.getElementById('sjIMEI').value.trim();const problem=document.getElementById('sjProblem').value.trim();const estCost=parseFloat(document.getElementById('sjEstCost').value)||0;const advance=parseFloat(document.getElementById('sjAdvance').value)||0;const techId=document.getElementById('sjTechnician').value;const expDate=document.getElementById('sjExpectedDate').value;if(!name||!phone||!model||!problem){toast('Fill required','error');return;}const file=document.getElementById('sjPhoto').files[0];const finish=(photoData)=>{const job={id:uid('job'),jobNo:nextJobNo(),customerName:name,customerPhone:phone,model,imei,problem,estimatedCost:estCost,advance,technicianId:techId||null,technicianName:techId?(APP.users.find(u=>u.id===techId)||{}).name:null,expectedDate:expDate||null,status:'Received',photo:photoData||'',spareParts:[],finalCost:0,deliveredAt:null,createdAt:new Date().toISOString(),statusHistory:[{status:'Received',ts:new Date().toISOString(),user:APP.user.name}]};APP.serviceJobs.unshift(job);lsSet('service_jobs',APP.serviceJobs);logAudit('SERVICE_CREATE',`${job.jobNo} | ${name}`);closeModal('serviceModal');toast(`Job ${job.jobNo} created`,'success');if(APP.currentView==='service')renderView('service');setTimeout(()=>{if(confirm(`Print job card?`))printServiceJobCard(job.id);},400);};if(file){const r=new FileReader();r.onload=(e)=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');let w=img.width,h=img.height;const max=600;if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>max){w=Math.round(w*max/h);h=max;}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);finish(cv.toDataURL('image/jpeg',0.75));};img.onerror=()=>finish('');img.src=e.target.result;};r.readAsDataURL(file);}else finish('');}
function updateServiceStatus(jobId,status){const job=APP.serviceJobs.find(j=>j.id===jobId);if(!job)return;job.status=status;job.statusHistory=job.statusHistory||[];job.statusHistory.push({status,ts:new Date().toISOString(),user:APP.user.name});if(status==='Delivered')job.deliveredAt=new Date().toISOString();lsSet('service_jobs',APP.serviceJobs);toast(`Status: ${status}`,'success');if(APP.currentView==='service')renderView('service');}
function addSparePart(jobId){const job=APP.serviceJobs.find(j=>j.id===jobId);if(!job)return;const avail=APP.inventory.filter(i=>i.status!=='Sold'&&i.status!=='Used in Service');if(!avail.length){toast('No stock','warn');return;}const listText=avail.slice(0,30).map((it,i)=>`${i+1}. ${it.model} - ₹${it.cost}`).join('\n');const choice=prompt(`Stock:\n${listText}\n\nNumber:`);if(!choice)return;const idx=parseInt(choice,10)-1;if(idx<0||idx>=avail.length){toast('Invalid','error');return;}const item=avail[idx];const priceStr=prompt('Charge ₹:',item.cost);if(priceStr===null)return;const price=parseFloat(priceStr)||item.cost;job.spareParts=job.spareParts||[];job.spareParts.push({stockId:item.id,model:item.model,imei:item.imei||'',purchaseCost:item.purchaseCost||0,cost:price});item.status='Used in Service';item.usedInJob=job.jobNo;lsSet('stock',APP.inventory);job.finalCost=(job.finalCost||0)+price;lsSet('service_jobs',APP.serviceJobs);toast('Part added','success');if(APP.currentView==='service')renderView('service');}
function openJobDetails(jobId){const job=APP.serviceJobs.find(j=>j.id===jobId);if(!job)return;const partsRows=(job.spareParts||[]).map((p,i)=>`<tr class="border-b"><td class="py-1.5">${i+1}</td><td class="py-1.5">${esc(p.model)}</td><td class="py-1.5 text-right font-mono">${money(p.cost)}</td></tr>`).join('')||'<tr><td colspan="3" class="py-2 text-center text-slate-400 text-xs">No parts</td></tr>';const histRows=(job.statusHistory||[]).map(h=>`<div class="flex justify-between text-xs py-1 border-b"><div><strong>${h.status}</strong> <span class="text-slate-400">by ${esc(h.user)}</span></div><div class="text-slate-500">${fmtDateTime(h.ts)}</div></div>`).join('');const html=`<div class="modal-overlay" id="jobDetailModal" onclick="if(event.target===this)closeModal('jobDetailModal')"><div class="modal-box" onclick="event.stopPropagation()"><div class="bg-gradient-to-r from-violet-500 to-purple-700 p-4 flex justify-between items-center"><div><div class="text-white font-bold">${job.jobNo}</div><div class="text-violet-100 text-xs">${job.status}</div></div><button onclick="closeModal('jobDetailModal')" class="text-white text-xl">✕</button></div><div class="modal-body space-y-3">${job.photo?`<img src="${job.photo}" class="w-full rounded-lg max-h-48 object-contain bg-slate-100">`:''}<div class="bg-slate-50 rounded-lg p-3 space-y-1.5 text-sm"><div><strong>Customer:</strong> ${esc(job.customerName)} (${job.customerPhone})</div><div><strong>Device:</strong> ${esc(job.model)}</div>${job.imei?`<div><strong>IMEI:</strong> <span class="font-mono">${esc(job.imei)}</span></div>`:''}<div><strong>Problem:</strong> ${esc(job.problem)}</div><div><strong>Est:</strong> ${money(job.estimatedCost||0)} · <strong>Adv:</strong> ${money(job.advance||0)}</div></div><div><div class="font-bold text-slate-700 text-xs uppercase mb-2">Parts</div><table class="w-full text-xs"><thead class="bg-slate-100"><tr><th class="text-left py-1 px-2">#</th><th class="text-left py-1 px-2">Model</th><th class="text-right py-1 px-2">Cost</th></tr></thead><tbody>${partsRows}</tbody></table><div class="text-right font-bold text-sm mt-2">Total: ${money(job.finalCost||0)}</div></div><div class="bg-slate-50 rounded-lg p-2">${histRows}</div><div class="flex gap-2"><button onclick="printServiceJobCard('${job.id}')" class="btn-secondary flex-1">🖨 Card</button>${job.status==='Ready'?`<button onclick="deliverJob('${job.id}')" class="btn-success flex-1">✓ Deliver</button>`:''}</div></div></div></div>`;document.body.insertAdjacentHTML('beforeend',html);}
function deliverJob(jobId){const job=APP.serviceJobs.find(j=>j.id===jobId);if(!job)return;const due=(job.finalCost||0)-(job.advance||0);if(!confirm(`Deliver?\nDue: ${money(due)}`))return;job.status='Delivered';job.deliveredAt=new Date().toISOString();job.statusHistory.push({status:'Delivered',ts:new Date().toISOString(),user:APP.user.name});lsSet('service_jobs',APP.serviceJobs);closeModal('jobDetailModal');toast(`Delivered! Due: ${money(due)}`,'success');if(APP.currentView==='service')renderView('service');setTimeout(()=>{if(confirm('Print bill?'))printServiceFinalBill(jobId);},400);}
function deleteServiceJob(jobId){const pin=prompt('Master PIN:');if(pin!==(APP.shopProfile.masterPin||'1234')){toast('Wrong PIN','error');return;}const job=APP.serviceJobs.find(j=>j.id===jobId);if(!job)return;if(!confirm(`Delete ${job.jobNo}?`))return;(job.spareParts||[]).forEach(p=>{const it=APP.inventory.find(i=>i.id===p.stockId);if(it&&it.status==='Used in Service'){it.status='Available';delete it.usedInJob;}});lsSet('stock',APP.inventory);APP.serviceJobs=APP.serviceJobs.filter(j=>j.id!==jobId);lsSet('service_jobs',APP.serviceJobs);toast('Deleted','success');renderView('service');}

/* WARRANTY */
function autoRegisterWarranty(inv){if(inv.saleType&&inv.saleType!=='regular')return;(inv.items||[]).forEach(it=>{if(!it.imei)return;const norm=normalizeIMEI(it.imei);if(APP.warranties.some(w=>normalizeIMEI(w.imei)===norm))return;const now=new Date(inv.date);const bm=APP.settings.defaultBrandWarranty||12;const sm=APP.settings.defaultShopWarranty||6;APP.warranties.push({id:uid('warr'),imei:norm,model:it.desc,customerName:inv.customerName,customerPhone:inv.customerPhone,invoiceNo:inv.invoiceNo,purchaseDate:inv.date,brandWarrantyMonths:bm,shopWarrantyMonths:sm,brandWarrantyEnd:addMonths(now,bm),shopWarrantyEnd:addMonths(now,sm),status:'active',claims:[]});});lsSet('warranties',APP.warranties);}
VIEW_RENDERERS.warranty=()=>{const active=APP.warranties.filter(w=>getWarrantyStatus(w)!=='expired');const expired=APP.warranties.filter(w=>getWarrantyStatus(w)==='expired');const list=APP.activeWarrantyTab==='expired'?expired:active;const cards=list.map(w=>{const st=getWarrantyStatus(w);const stClass=st==='active'?'bg-emerald-100 text-emerald-800':st==='shop-only'?'bg-amber-100 text-amber-800':'bg-slate-200 text-slate-600';return `<div class="card"><div class="font-bold">${esc(w.model)}</div><div class="text-xs font-mono text-slate-600 mt-1">IMEI: ${esc(w.imei)}</div><div class="text-xs text-slate-600 mt-0.5">${esc(w.customerName)} · ${esc(w.customerPhone)}</div><span class="text-[10px] font-bold px-2 py-0.5 rounded ${stClass} mt-2 inline-block">${st}</span><div class="flex gap-2 mt-2 text-[10px]"><span class="bg-slate-100 px-2 py-0.5 rounded">B: ${new Date(w.brandWarrantyEnd).toLocaleDateString()}</span><span class="bg-slate-100 px-2 py-0.5 rounded">S: ${new Date(w.shopWarrantyEnd).toLocaleDateString()}</span></div><div class="flex gap-2 mt-3 pt-3 border-t"><button onclick="addWarrantyClaim('${w.id}')" class="btn-icon">+ Claim</button><button onclick="searchWarrantyByIMEI('${w.imei}')" class="btn-icon">🔍</button></div></div>`;}).join('');return `<div class="p-4 lg:p-6 space-y-4"><div class="flex flex-wrap items-center justify-between gap-3"><div class="flex flex-wrap gap-2"><div class="tab-pill ${APP.activeWarrantyTab==='active'?'active':''}" onclick="APP.activeWarrantyTab='active';renderView('warranty')">Active (${active.length})</div><div class="tab-pill ${APP.activeWarrantyTab==='expired'?'active':''}" onclick="APP.activeWarrantyTab='expired';renderView('warranty')">Expired (${expired.length})</div></div><input type="text" oninput="filterWarrantyList(this.value)" placeholder="🔍 Search" class="inp max-w-xs"></div><div id="warrantyListContainer" class="space-y-3">${cards||'<div class="card text-center py-12"><div class="text-5xl mb-3">🛡️</div><div>No warranties</div></div>'}</div></div>`;};
function filterWarrantyList(q){q=(q||'').toLowerCase().trim();const c=document.getElementById('warrantyListContainer');if(!c)return;let list=APP.warranties;if(APP.activeWarrantyTab==='expired')list=list.filter(w=>getWarrantyStatus(w)==='expired');else list=list.filter(w=>getWarrantyStatus(w)!=='expired');if(q)list=list.filter(w=>(w.imei+' '+w.customerPhone+' '+w.model+' '+w.customerName).toLowerCase().includes(q));if(!list.length){c.innerHTML='<div class="card text-center py-8 text-slate-400 text-sm">No matches</div>';return;}c.innerHTML=list.map(w=>{const st=getWarrantyStatus(w);const stClass=st==='active'?'bg-emerald-100 text-emerald-800':st==='shop-only'?'bg-amber-100 text-amber-800':'bg-slate-200 text-slate-600';return `<div class="card"><div class="font-bold">${esc(w.model)}</div><div class="text-xs font-mono">${esc(w.imei)}</div><div class="text-xs">${esc(w.customerName)}</div><span class="text-[10px] font-bold px-2 py-0.5 rounded ${stClass} mt-2 inline-block">${st}</span></div>`;}).join('');}
function addWarrantyClaim(wId){const w=APP.warranties.find(x=>x.id===wId);if(!w)return;const issue=prompt('Issue:');if(!issue)return;const resolution=prompt('Resolution:','Sent to service center');if(resolution===null)return;w.claims=w.claims||[];w.claims.push({date:fmtDate(new Date()),issue,resolution,ts:new Date().toISOString()});lsSet('warranties',APP.warranties);toast('Claim recorded','success');renderView('warranty');}
function searchWarrantyByIMEI(imei){const w=APP.warranties.find(x=>normalizeIMEI(x.imei)===normalizeIMEI(imei));if(!w){toast('Not found','warn');return;}alert(`Warranty\n\nModel: ${w.model}\nIMEI: ${w.imei}\nCustomer: ${w.customerName}\nPurchase: ${w.purchaseDate}\nBrand till: ${new Date(w.brandWarrantyEnd).toLocaleDateString()}\nShop till: ${new Date(w.shopWarrantyEnd).toLocaleDateString()}\nStatus: ${getWarrantyStatus(w)}`);}

/* STOCK */
VIEW_RENDERERS.stock=()=>{const available=APP.inventory.filter(i=>i.status==='Available');const sold=APP.inventory.filter(i=>i.status==='Sold');const inService=APP.inventory.filter(i=>i.status==='Used in Service');const value=available.reduce((s,i)=>s+(i.cost||0),0);return `<div class="p-4 lg:p-6 space-y-4"><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="card"><div class="text-[10px] font-bold text-emerald-700 uppercase">Available</div><div class="text-xl font-black text-emerald-800 mt-1">${available.length}</div></div><div class="card"><div class="text-[10px] font-bold text-sky-700 uppercase">Stock Value</div><div class="text-xl font-black text-sky-800 mt-1">${moneyInt(value)}</div></div><div class="card"><div class="text-[10px] font-bold text-rose-700 uppercase">Sold</div><div class="text-xl font-black text-rose-800 mt-1">${sold.length}</div></div><div class="card"><div class="text-[10px] font-bold text-violet-700 uppercase">In Service</div><div class="text-xl font-black text-violet-800 mt-1">${inService.length}</div></div></div><div class="card"><div class="flex flex-wrap items-center justify-between gap-3 mb-3"><h3 class="font-bold">📦 Inventory</h3><div class="flex flex-wrap gap-2"><input type="text" id="stockSearch" oninput="renderStockTable()" placeholder="🔍 Search" class="inp max-w-xs"><select id="stockFilter" onchange="renderStockTable()" class="inp max-w-xs"><option value="all">All</option><option value="Available" selected>Available</option><option value="Sold">Sold</option><option value="Used in Service">In Service</option></select><button onclick="openAddStockModal()" class="btn-primary">+ Add</button></div></div><div class="overflow-x-auto"><table class="data-table"><thead><tr><th>Category</th><th>Model</th><th>IMEI</th><th class="text-right">Purchase</th><th class="text-right">Selling</th><th class="text-center">Status</th><th class="text-center">Actions</th></tr></thead><tbody id="stockBody"></tbody></table></div></div></div>`;};
VIEW_AFTER.stock=()=>{renderStockTable();};
function renderStockTable(){const tbody=document.getElementById('stockBody');if(!tbody)return;const q=(document.getElementById('stockSearch')?.value||'').toLowerCase().trim();const filt=document.getElementById('stockFilter')?.value||'Available';let list=APP.inventory;if(filt!=='all')list=list.filter(i=>i.status===filt);if(q)list=list.filter(i=>(i.model+' '+(i.imei||'')+' '+(i.category||'')).toLowerCase().includes(q));if(!list.length){tbody.innerHTML='<tr><td colspan="7" class="text-center text-slate-400 text-xs py-6">None</td></tr>';return;}tbody.innerHTML=list.slice(0,200).map(s=>{const stClass=s.status==='Sold'?'bg-red-100 text-red-700':s.status==='Used in Service'?'bg-violet-100 text-violet-700':'bg-emerald-100 text-emerald-800';return `<tr><td><span class="bg-violet-100 text-violet-800 text-[10px] font-bold px-2 py-0.5 rounded">${esc(s.category||'Other')}</span></td><td class="font-semibold">${esc(s.model)}</td><td class="font-mono text-xs">${esc(s.imei||'-')}</td><td class="text-right font-mono text-slate-500">${s.purchaseCost?moneyInt(s.purchaseCost):'-'}</td><td class="text-right font-mono font-semibold">${moneyInt(s.cost)}</td><td class="text-center"><span class="${stClass} text-[10px] font-bold px-2 py-0.5 rounded">${s.status}</span></td><td class="text-center space-x-1 whitespace-nowrap">${s.status==='Available'?`<button onclick="sellFromStock('${s.id}')" class="btn-icon">Sell ⚡</button>`:''}<button onclick="editStockPrice('${s.id}')" class="btn-icon">✏</button><button onclick="deleteStockItem('${s.id}')" class="btn-icon" style="background:#fee2e2;color:#991b1b">🗑</button></td></tr>`;}).join('');}
function openAddStockModal(){const html=`<div class="modal-overlay" id="addStockModal" onclick="if(event.target===this)closeModal('addStockModal')"><div class="modal-box" onclick="event.stopPropagation()"><div class="bg-gradient-to-r from-sky-500 to-blue-700 p-4 flex justify-between items-center"><div class="text-white font-bold">Add Stock</div><button onclick="closeModal('addStockModal')" class="text-white text-xl">✕</button></div><div class="modal-body space-y-3"><div class="grid grid-cols-2 gap-3"><div><label class="inp-lbl">Category *</label><select id="asCategory" class="inp">${APP.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div><label class="inp-lbl">Type</label><select id="asType" class="inp"><option value="new">New</option><option value="old">Old</option></select></div></div><div><label class="inp-lbl">Model *</label><input type="text" id="asModel" class="inp"></div><div><label class="inp-lbl">IMEI</label><input type="text" id="asIMEI" class="inp font-mono"></div><div class="grid grid-cols-2 gap-3"><div><label class="inp-lbl">Purchase ₹</label><input type="number" id="asCost" class="inp font-mono" value="0"></div><div><label class="inp-lbl">Selling ₹ *</label><input type="number" id="asSell" class="inp font-mono"></div></div><div class="flex gap-2 pt-2"><button onclick="closeModal('addStockModal')" class="btn-secondary flex-1">Cancel</button><button onclick="saveStockItem()" class="btn-primary flex-1">Add</button></div></div></div></div>`;document.body.insertAdjacentHTML('beforeend',html);}
function saveStockItem(){const category=document.getElementById('asCategory').value;const type=document.getElementById('asType').value;const model=document.getElementById('asModel').value.trim();const imei=document.getElementById('asIMEI').value.trim();const cost=parseFloat(document.getElementById('asCost').value)||0;const sell=parseFloat(document.getElementById('asSell').value)||0;if(!model||sell<=0){toast('Enter model & price','error');return;}if(imei&&APP.inventory.some(i=>normalizeIMEI(i.imei)===normalizeIMEI(imei)&&i.status!=='Sold')){toast('IMEI exists','error');return;}APP.inventory.push({id:uid('stk'),model,imei,category,purchaseCost:cost,cost:sell,gstRate:18,status:'Available',isOldStock:type==='old',addedDate:fmtDate(new Date()),hsn:'8517'});lsSet('stock',APP.inventory);closeModal('addStockModal');toast('Added','success');renderView('stock');}
function sellFromStock(id){const s=APP.inventory.find(i=>i.id===id);if(!s||s.status!=='Available')return;APP.cart=[{id:uid('li'),desc:s.model,imei:s.imei||'',hsn:s.hsn||'8517',gstRate:s.gstRate||18,qty:1,price:s.cost,purchaseCost:s.purchaseCost||0,stockId:s.id}];navigateTo('sales');}
function editStockPrice(id){const pin=prompt('PIN:');if(pin!==(APP.shopProfile.masterPin||'1234')){toast('Wrong','error');return;}const s=APP.inventory.find(i=>i.id===id);if(!s)return;const nc=prompt('New price:',s.cost);if(nc&&!isNaN(nc)){s.cost=parseFloat(nc);lsSet('stock',APP.inventory);toast('Updated','success');renderView('stock');}}
function deleteStockItem(id){const pin=prompt('PIN:');if(pin!==(APP.shopProfile.masterPin||'1234')){toast('Wrong','error');return;}if(!confirm('Delete?'))return;APP.inventory=APP.inventory.filter(i=>i.id!==id);lsSet('stock',APP.inventory);toast('Deleted','success');renderView('stock');}

/* PARTIES */
VIEW_RENDERERS.parties=()=>`<div class="p-4 lg:p-6 space-y-4"><div class="grid grid-cols-1 lg:grid-cols-2 gap-4"><div class="card"><h3 class="font-bold text-sm mb-3">👤 Customers (${APP.customers.length})</h3><div class="space-y-2 max-h-96 overflow-y-auto">${APP.customers.length?APP.customers.map(c=>{const due=APP.invoices.filter(i=>i.customerName===c.name&&i.ledger==='Credit / Sundry Debtors').reduce((s,i)=>s+i.totalGross,0);return `<div class="flex justify-between items-center p-2 border-b last:border-0"><div><div class="font-semibold text-slate-800 text-xs">${esc(c.name)} ${c.gstin?'<span class="badge badge-b2b ml-1">B2B</span>':''}</div><div class="text-[10px] text-slate-500 font-mono">${esc(c.phone||'-')}</div></div><div class="text-right"><div class="font-mono font-bold text-xs ${due>0?'text-rose-700':'text-emerald-700'}">${money(due)}</div><button onclick="deleteParty('customer','${c.id}')" class="text-[10px] text-red-500">Delete</button></div></div>`;}).join(''):'<div class="text-xs text-slate-400 text-center py-3">None</div>'}</div></div><div class="card"><h3 class="font-bold text-sm mb-3">🏢 Suppliers (${APP.suppliers.length})</h3><div class="space-y-2 max-h-96 overflow-y-auto">${APP.suppliers.length?APP.suppliers.map(s=>{const st=getSupplierStats(s.id);return `<div class="flex justify-between items-center p-2 border-b last:border-0"><div><div class="font-semibold text-slate-800 text-xs">${esc(s.name)} ${s.gstin?'<span class="badge badge-b2b ml-1">GST</span>':''}</div><div class="text-[10px] text-slate-500 font-mono">${esc(s.gstin||s.phone||'-')}</div></div><div class="text-right"><div class="font-mono font-bold text-xs ${st.due>0?'text-rose-700':'text-emerald-700'}">${money(st.due)}</div><button onclick="deleteParty('supplier','${s.id}')" class="text-[10px] text-red-500">Delete</button></div></div>`;}).join(''):'<div class="text-xs text-slate-400 text-center py-3">None</div>'}</div></div></div></div>`;
function deleteParty(type,id){const pin=prompt('PIN:');if(pin!==(APP.shopProfile.masterPin||'1234')){toast('Wrong','error');return;}if(type==='customer'){if(!confirm('Delete?'))return;APP.customers=APP.customers.filter(c=>c.id!==id);lsSet('customers',APP.customers);}else{const st=getSupplierStats(id);if(st.paid>0){toast('Has payments','error');return;}if(!confirm('Delete?'))return;APP.suppliers=APP.suppliers.filter(s=>s.id!==id);lsSet('suppliers',APP.suppliers);}toast('Deleted','success');renderView('parties');}

/* REPORTS */
VIEW_RENDERERS.reports=()=>{const tabs=[{id:'pl',label:'📊 P&L'},{id:'outgst',label:'📤 Output GST'},{id:'ingst',label:'📥 Input GST'},{id:'netgst',label:'💰 Net Payable'},{id:'gstr1',label:'📋 GSTR-1'},{id:'gstr3b',label:'📋 GSTR-3B'},{id:'hsn',label:'🏷️ HSN'}];const active=APP.activeReportTab||'pl';return `<div class="p-4 lg:p-6 space-y-4"><div class="flex flex-wrap gap-2 border-b pb-3">${tabs.map(t=>`<button onclick="switchReportTab('${t.id}')" class="tab-pill ${active===t.id?'active':''}">${t.label}</button>`).join('')}</div><div id="reportContent">${renderReportContent(active)}</div></div>`;};
function renderReportContent(tab){if(tab==='pl')return renderPL();if(tab==='outgst')return renderOutputGST();if(tab==='ingst')return renderInputGST();if(tab==='netgst')return renderNetPayable();if(tab==='gstr1')return renderGSTR1();if(tab==='gstr3b')return renderGSTR3B();if(tab==='hsn')return renderHSNSummary();return '';}
function switchReportTab(tab){APP.activeReportTab=tab;renderView('reports');}
function renderMonthSelector(){const months=getMonthList();const cur=getCurrentMonth();return `<div class="card"><div class="grid grid-cols-1 md:grid-cols-4 gap-3"><div><label class="inp-lbl">Month</label><select onchange="APP.activeGstMonth=this.value;renderView('reports')" class="inp">${months.map(m=>`<option value="${m}" ${m===cur?'selected':''}>${monthLabel(m)}</option>`).join('')}</select></div><div class="flex items-end"><button onclick="downloadFullGSTPackage()" class="btn-success w-full text-xs">📊 Export Excel</button></div><div class="flex items-end"><button onclick="window.print()" class="btn-secondary w-full text-xs no-print">🖨 Print</button></div></div></div>`;}
function renderPL(){const fy=getFY();const fromDate=document.getElementById('repFrom')?.value||fmtDate(fy.start);const toDate=document.getElementById('repTo')?.value||fmtDate(fy.end);const fInv=APP.invoices.filter(i=>i.date>=fromDate&&i.date<=toDate);const fPur=APP.purchases.filter(p=>p.date>=fromDate&&p.date<=toDate);const fVch=APP.vouchers.filter(v=>v.date>=fromDate&&v.date<=toDate);const fCRN=APP.creditNotes.filter(c=>c.date>=fromDate&&c.date<=toDate);const grossSales=fInv.reduce((s,i)=>s+i.totalGross,0);const totalReturns=fCRN.reduce((s,c)=>s+c.refundTotal,0);const netSales=grossSales-totalReturns;const totalCost=fInv.reduce((s,i)=>s+(i.totalPurchaseCost||0),0);const totalExp=fVch.filter(v=>v.type==='EXPENSE').reduce((s,v)=>s+v.amount,0);const grossProfit=netSales-totalCost;const netProfit=grossProfit-totalExp;return `<div class="space-y-4"><div class="card"><div class="grid grid-cols-1 md:grid-cols-4 gap-3"><div><label class="inp-lbl">From</label><input type="date" id="repFrom" class="inp" value="${fromDate}"></div><div><label class="inp-lbl">To</label><input type="date" id="repTo" class="inp" value="${toDate}"></div><div class="flex items-end"><button onclick="renderView('reports')" class="btn-primary w-full">Apply</button></div><div class="flex items-end gap-2"><button onclick="setRepRange('today')" class="btn-secondary flex-1 text-xs">Today</button><button onclick="setRepRange('month')" class="btn-secondary flex-1 text-xs">Month</button><button onclick="setRepRange('fy')" class="btn-secondary flex-1 text-xs">FY</button></div></div></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="stat-card bg-gradient-to-br from-indigo-500 to-blue-700"><div class="text-[10px] uppercase font-bold">Net Sales</div><div class="text-xl font-black mt-1">${moneyInt(netSales)}</div></div><div class="stat-card bg-gradient-to-br from-rose-500 to-red-700"><div class="text-[10px] uppercase font-bold">Expenses</div><div class="text-xl font-black mt-1">${moneyInt(totalExp)}</div></div><div class="stat-card bg-gradient-to-br from-emerald-500 to-green-700"><div class="text-[10px] uppercase font-bold">Net Profit</div><div class="text-xl font-black mt-1">${moneyInt(netProfit)}</div></div><div class="stat-card bg-gradient-to-br from-sky-500 to-cyan-700"><div class="text-[10px] uppercase font-bold">Gross Profit</div><div class="text-xl font-black mt-1">${moneyInt(grossProfit)}</div></div></div></div>`;}
function renderOutputGST(){const month=getCurrentMonth();const inv=APP.invoices.filter(i=>i.date.startsWith(month));const gstInv=inv.filter(i=>i.saleType==='regular');const totals={taxable:gstInv.reduce((s,i)=>s+(i.totalTaxable||0),0),cgst:gstInv.reduce((s,i)=>s+(i.totalCGST||0),0),sgst:gstInv.reduce((s,i)=>s+(i.totalSGST||0),0),igst:gstInv.reduce((s,i)=>s+(i.totalIGST||0),0)};return `${renderMonthSelector()}<div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="card"><div class="text-[10px] font-bold text-slate-500 uppercase">Taxable</div><div class="text-xl font-black mt-1">${money(totals.taxable)}</div></div><div class="card"><div class="text-[10px] font-bold text-slate-500 uppercase">CGST</div><div class="text-xl font-black mt-1 text-blue-700">${money(totals.cgst)}</div></div><div class="card"><div class="text-[10px] font-bold text-slate-500 uppercase">SGST</div><div class="text-xl font-black mt-1 text-blue-700">${money(totals.sgst)}</div></div><div class="card"><div class="text-[10px] font-bold text-slate-500 uppercase">IGST</div><div class="text-xl font-black mt-1 text-indigo-700">${money(totals.igst)}</div></div></div><div class="card"><h3 class="font-bold text-sm mb-3">Output GST · ${monthLabel(month)}</h3><div class="overflow-x-auto max-h-96"><table class="data-table"><thead><tr><th>Date</th><th>Invoice</th><th>Customer</th><th>GSTIN</th><th>Type</th><th class="text-right">Taxable</th><th class="text-right">CGST</th><th class="text-right">SGST</th><th class="text-right">IGST</th><th class="text-right">Total</th></tr></thead><tbody>${gstInv.map(i=>`<tr><td class="font-mono text-xs">${i.date}</td><td class="font-mono text-xs">${esc(i.invoiceNo)}</td><td class="font-semibold">${esc(i.customerName)}</td><td class="font-mono text-[10px]">${esc(i.customerGSTIN||'-')}</td><td><span class="badge ${i.b2b?'badge-b2b':'badge-b2c'}">${i.b2b?'B2B':'B2C'}</span></td><td class="text-right font-mono">${money(i.totalTaxable||0)}</td><td class="text-right font-mono">${money(i.totalCGST||0)}</td><td class="text-right font-mono">${money(i.totalSGST||0)}</td><td class="text-right font-mono">${money(i.totalIGST||0)}</td><td class="text-right font-mono font-bold">${money(i.totalGross)}</td></tr>`).join('')||'<tr><td colspan="10" class="text-center py-6 text-xs text-slate-400">None</td></tr>'}</tbody></table></div></div>`;}

etIgst>0?'text-rose-700':'text-emerald-700'}">${money(Math.abs(netIgst))}</td></tr></tbody><tfoot class="bg-slate-900 text-white"><tr><td class="p-4 font-black">NET TOTAL</td><td class="p-4 text-right font-mono">${money(outCgst+outSgst+outIgst)}</td><td class="p-4 text-right font-mono">-${money(inCgst+inSgst+inIgst)}</td><td class="p-4 text-right font-mono font-black text-lg">${money(Math.abs(netTotal))}</td></tr></tfoot></table></div><div class="mt-4 p-4 rounded-lg ${netTotal>0?'bg-rose-50 border-rose-200':'bg-emerald-50 border-emerald-200'} border"><div class="text-sm font-bold ${netTotal>0?'text-rose-900':'text-emerald-900'}">${netTotal>0?`Payable: ${money(netTotal)}`:netTotal<0?`Refundable: ${money(Math.abs(netTotal))}`:'Nil'}</div></div></div>`;}

function renderHSNSummary(){const month=getCurrentMonth();const inv=APP.invoices.filter(i=>i.date.startsWith(month)&&i.saleType==='regular');const hsnMap={};inv.forEach(i=>{(i.items||[]).forEach(it=>{const hsn=it.hsn||'8517';if(!hsnMap[hsn])hsnMap[hsn]={desc:it.desc,qty:0,taxable:0,cgst:0,sgst:0,igst:0,total:0};const line=it.price*it.qty||it.grossAmount*it.qty;const rate=it.gstRate||18;const taxable=line/(1+rate/100);const tax=line-taxable;hsnMap[hsn].qty+=it.qty;hsnMap[hsn].taxable+=taxable;hsnMap[hsn].total+=line;if(i.gstNature==='INTRA'){hsnMap[hsn].cgst+=tax/2;hsnMap[hsn].sgst+=tax/2;}else hsnMap[hsn].igst+=tax;});});const hsnList=Object.keys(hsnMap).map(k=>({hsn:k,...hsnMap[k]}));return `${renderMonthSelector()}<div class="card"><h3 class="font-bold mb-3">🏷️ HSN Summary · ${monthLabel(month)}</h3><div class="overflow-x-auto"><table class="data-table"><thead><tr><th>HSN</th><th>Desc</th><th class="text-right">Qty</th><th class="text-right">Taxable</th><th class="text-right">CGST</th><th class="text-right">SGST</th><th class="text-right">IGST</th><th class="text-right">Total</th></tr></thead><tbody>${hsnList.map(h=>`<tr><td class="font-mono">${h.hsn}</td><td>${esc(h.desc)}</td><td class="text-right">${h.qty}</td><td class="text-right font-mono">${money(h.taxable)}</td><td class="text-right font-mono">${money(h.cgst)}</td><td class="text-right font-mono">${money(h.sgst)}</td><td class="text-right font-mono">${money(h.igst)}</td><td class="text-right font-mono font-bold">${money(h.total)}</td></tr>`).join('')||'<tr><td colspan="8" class="text-center py-6 text-xs text-slate-400">None</td></tr>'}</tbody></table></div></div>`;}
function setRepRange(r){const today=new Date();let from=today,to=today;if(r==='today'){from=today;to=today;}else if(r==='month'){from=new Date(today.getFullYear(),today.getMonth(),1);to=today;}else if(r==='fy'){const fy=getFY(today);from=fy.start;to=fy.end;}const f=document.getElementById('repFrom');const t=document.getElementById('repTo');if(f)f.value=fmtDate(from);if(t)t.value=fmtDate(to);renderView('reports');}

tory (${APP.salaryPayments.length})</h3><div class="overflow-x-auto max-h-96"><table class="data-table"><thead><tr><th>Pay Date</th><th>Staff</th><th>Month</th><th class="text-right">Salary</th><th class="text-right">Bonus</th><th class="text-right">Total</th><th class="text-center">Slip</th></tr></thead><tbody>${APP.salaryPayments.length?APP.salaryPayments.slice(0,50).map(p=>`<tr><td class="font-mono text-xs">${p.payDate}</td><td class="font-semibold">${esc(p.staffName)}</td><td>${p.monthLabel}</td><td class="text-right font-mono">${money(p.salary)}</td><td class="text-right font-mono text-emerald-600">${money(p.bonus||0)}</td><td class="text-right font-mono font-bold">${money(p.total)}</td><td class="text-center"><button onclick="printSalarySlip('${p.id}')" class="btn-icon">🖨</button></td></tr>`).join(''):'<tr><td colspan="7" class="text-center text-slate-400 text-xs py-6">None</td></tr>'}</tbody></table></div></div></div>`;};
function saveStaffMember(){const name=document.getElementById('stName').value.trim();const phone=document.getElementById('stPhone').value.trim();const designation=document.getElementById('stDesignation').value.trim();const salary=parseFloat(document.getElementById('stSalary').value)||0;const joining=document.getElementById('stJoining').value;if(!name||salary<=0){toast('Name & salary','error');return;}APP.staff.push({id:uid('stf'),name,phone,designation,salary,joining});lsSet('staff',APP.staff);toast('Added','success');renderView('staff');}
function deleteStaffMember(id){const pin=prompt('PIN:');if(pin!==(APP.shopProfile.masterPin||'1234')){toast('Wrong','error');return;}if(!confirm('Delete?'))return;APP.staff=APP.staff.filter(s=>s.id!==id);lsSet('staff',APP.staff);renderView('staff');}
function payStaffSalary(staffId){const s=APP.staff.find(x=>x.id===staffId);if(!s)return;const months=['January','February','March','April','May','June','July','August','September','October','November','December'];const today=new Date();const amtStr=prompt(`${s.name}'s Salary ₹:`,s.salary);if(!amtStr)return;const amount=parseFloat(amtStr);if(!amount)return;const bonusStr=prompt('Bonus:','0')||'0';const bonus=parseFloat(bonusStr)||0;const modeStr=prompt('Cash/Bank:','Cash')||'Cash';const mode=modeStr.toLowerCase().includes('bank')?'Bank / UPI':'Cash-in-Hand';const monthLabel=months[today.getMonth()]+' '+today.getFullYear();const rec={id:uid('sal'),staffId,staffName:s.name,designation:s.designation,payDate:fmtDate(today),month:today.getMonth()+1,year:today.getFullYear(),monthLabel,salary:amount,bonus,total:amount+bonus,payMode:mode,note:''};APP.salaryPayments.unshift(rec);lsSet('salary_payments',APP.salaryPayments);APP.vouchers.unshift({id:uid('vch'),type:'EXPENSE',date:fmtDate(today),amount:amount+bonus,category:'Salary - '+s.name,account:mode,narration:'Salary '+monthLabel});lsSet('vouchers',APP.vouchers);toast(`Paid ${money(amount+bonus)}`,'success');renderView('staff');setTimeout(()=>{if(confirm('Print slip?'))printSalarySlip(rec.id);},400);}

/* USERS */
VIEW_RENDERERS.users=()=>{const rows=APP.users.map(u=>`<tr><td class="font-semibold">${esc(u.name)}</td><td class="font-mono text-xs">${esc(u.userId||u.phone||'-')}</td><td><span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded ${u.role==='owner'?'bg-violet-100 text-violet-800':u.role==='manager'?'bg-sky-100 text-sky-800':u.role==='cashier'?'bg-emerald-100 text-emerald-800':u.role==='ca'?'bg-violet-100 text-violet-800':'bg-amber-100 text-amber-800'}">${u.role}</span></td><td class="text-xs">${u.status==='active'?'<span class="text-emerald-600 font-semibold">● Active</span>':'<span class="text-rose-600 font-semibold">● Disabled</span>'}</td><td class="text-xs font-mono text-slate-500">${u.lastLogin?new Date(u.lastLogin).toLocaleDateString():'Never'}</td><td class="text-center">${u.role!=='owner'?`<button onclick="deleteUser('${u.id}')" class="btn-icon" style="background:#fee2e2;color:#991b1b">Delete</button>`:'<span class="text-xs text-slate-400">—</span>'}</td></tr>`).join('');const caCount=APP.users.filter(u=>u.role==='ca').length;return `<div class="p-4 lg:p-6 space-y-4"><div class="card"><div class="flex items-center justify-between mb-4 flex-wrap gap-3"><div><h3 class="font-bold text-slate-900">User Management</h3><p class="text-xs text-slate-500 mt-0.5">Role-based access for staff and CA</p></div><button onclick="openAddUserModal()" class="btn-primary">+ Add User</button></div><div class="overflow-x-auto"><table class="data-table"><thead><tr><th>Name</th><th>User ID</th><th>Role</th><th>Status</th><th>Last Login</th><th class="text-center">Action</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="card bg-violet-50 border-violet-200"><div class="flex items-start justify-between flex-wrap gap-3"><div><div class="text-sm font-bold text-violet-900 flex items-center gap-2"><span>💼</span> CA Role — Chartered Accountant Access</div><div class="text-xs text-violet-800 mt-1">Give your CA their own login. They can access GST reports, download Excel, work month-wise — without editing shop data.</div><div class="text-xs text-violet-700 mt-2">${caCount>0?`✓ ${caCount} CA user${caCount>1?'s':''} active`:'No CA user added yet'}</div></div><button onclick="openAddUserModal('ca')" class="btn-ca">💼 Add CA</button></div></div><div class="card bg-sky-50 border-sky-200"><div class="text-xs text-sky-900 font-bold mb-2">🔐 Role Permissions</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs"><div><strong class="text-violet-700">Owner:</strong> Full access</div><div><strong class="text-sky-700">Manager:</strong> Sales, Purchase, Stock, Reports</div><div><strong class="text-emerald-700">Cashier:</strong> Sales, Stock view</div><div><strong class="text-amber-700">Technician:</strong> Service, Warranty</div><div><strong class="text-violet-700">CA:</strong> GST Reports, Downloads (read-only)</div></div></div></div>`;};
function openAddUserModal(preRole){const html=`<div class="modal-overlay" id="addUserModal" onclick="if(event.target===this)closeModal('addUserModal')"><div class="modal-box" onclick="event.stopPropagation()"><div class="bg-gradient-to-r from-sky-500 to-blue-700 p-4 flex justify-between items-center"><div class="text-white font-bold">Add New User</div><button onclick="closeModal('addUserModal')" class="text-white text-xl">✕</button></div><div class="modal-body space-y-3"><div><label class="inp-lbl">Full Name</label><input type="text" id="nuName" class="inp"></div><div><label class="inp-lbl">User ID (Mobile or Custom)</label><input type="text" id="nuPhone" class="inp font-mono"></div><div><label class="inp-lbl">Role</label><select id="nuRole" class="inp" onchange="onNuRoleChange(this.value)"><option value="manager">Manager</option><option value="cashier">Cashier</option><option value="technician">Technician</option><option value="ca" ${preRole==='ca'?'selected':''}>💼 Chartered Accountant (CA)</option></select></div><div id="caFieldsHint" style="display:${preRole==='ca'?'block':'none'};background:#ede9fe;padding:10px;border-radius:8px;font-size:11px;color:#5b21b6">💼 CA will get read-only access to GST reports, sales register, purchase register, ITC, and download functionality. No editing of shop data.</div><div><label class="inp-lbl">Password</label><input type="text" id="nuPass" class="inp font-mono" placeholder="min 4 chars"></div><div class="flex gap-2 pt-2"><button onclick="closeModal('addUserModal')" class="btn-secondary flex-1">Cancel</button><button onclick="saveNewUser()" class="btn-primary flex-1">Create</button></div></div></div></div>`;document.body.insertAdjacentHTML('beforeend',html);}
function onNuRoleChange(role){const el=document.getElementById('caFieldsHint');if(el)el.style.display=role==='ca'?'block':'none';}
function saveNewUser(){const name=document.getElementById('nuName').value.trim();const phone=document.getElementById('nuPhone').value.trim();const role=document.getElementById('nuRole').value;const pass=document.getElementById('nuPass').value;if(!name||!phone||!pass||pass.length<4){toast('Fill all (pass ≥ 4)','error');return;}if(APP.users.some(u=>(u.userId||'').toLowerCase()===phone.toLowerCase()||(u.phone||'')===phone)){toast('User ID exists','error');return;}APP.users.push({id:uid('u'),userId:phone,name,phone,role,passwordHash:hashPass(pass),status:'active',createdAt:new Date().toISOString(),lastLogin:null});lsSet('users',APP.users);closeModal('addUserModal');if(role==='ca')toast(`CA user created: ${name}`,'success',4000);else toast(`User created: ${name}`,'success');renderView('users');}
function deleteUser(id){if(!confirm('Delete?'))return;APP.users=APP.users.filter(u=>u.id!==id);lsSet('users',APP.users);toast('Deleted','success');renderView('users');}
function closeModal(id){const m=document.getElementById(id);if(m)m.remove();}

/* SETTINGS */
VIEW_RENDERERS.settings=()=>{const gc=APP.gstConfig||{};const scheme=gc.scheme||'regular';return `<div class="p-4 lg:p-6 space-y-4 max-w-3xl mx-auto">
<div class="card"><h3 class="font-bold mb-4">🏛️ GST Configuration</h3><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><label class="cursor-pointer"><input type="radio" name="gstScheme" value="regular" ${scheme==='regular'?'checked':''} onchange="setGSTScheme('regular')" class="sr-only peer"><div class="border-2 rounded-xl p-3 text-center peer-checked:border-sky-500 peer-checked:bg-sky-50"><div class="text-2xl">🧾</div><div class="text-xs font-bold mt-1">Regular GST</div></div></label><label class="cursor-pointer"><input type="radio" name="gstScheme" value="composition" ${scheme==='composition'?'checked':''} onchange="setGSTScheme('composition')" class="sr-only peer"><div class="border-2 rounded-xl p-3 text-center peer-checked:border-violet-500 peer-checked:bg-violet-50"><div class="text-2xl">📋</div><div class="text-xs font-bold mt-1">Composition 1%</div></div></label><label class="cursor-pointer"><input type="radio" name="gstScheme" value="nongst" ${scheme==='nongst'?'checked':''} onchange="setGSTScheme('nongst')" class="sr-only peer"><div class="border-2 rounded-xl p-3 text-center peer-checked:border-amber-500 peer-checked:bg-amber-50"><div class="text-2xl">💵</div><div class="text-xs font-bold mt-1">Non-GST</div></div></label></div><div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3"><div><label class="inp-lbl">GSTIN</label><input type="text" id="cfgGSTIN" class="inp font-mono" maxlength="15" value="${esc(gc.gstin||'')}"></div><div><label class="inp-lbl">State Code</label><input type="text" id="cfgStateCode" class="inp font-mono" maxlength="2" value="${esc(gc.stateCode||'19')}"></div></div><div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3"><div><label class="inp-lbl">State Name</label><input type="text" id="cfgStateName" class="inp" value="${esc(gc.stateName||'West Bengal')}"></div><div><label class="inp-lbl">Composition Rate %</label><input type="number" id="cfgCompRate" class="inp font-mono" step="0.1" value="${gc.compositionRate||1}"></div></div><button onclick="saveGSTConfig()" class="btn-primary w-full mt-4">Save GST</button></div>
<div class="card"><h3 class="font-bold mb-4">🖨️ Print Settings</h3><div class="grid grid-cols-2 gap-3"><label class="cursor-pointer"><input type="radio" name="printSize" value="a4" ${APP.settings.printSize==='a4'?'checked':''} onchange="setPrintSize('a4')" class="sr-only peer"><div class="border-2 rounded-xl p-3 text-center peer-checked:border-sky-500 peer-checked:bg-sky-50"><div class="text-2xl">📄</div><div class="text-xs font-bold mt-1">A4 Paper</div></div></label><label class="cursor-pointer"><input type="radio" name="printSize" value="thermal" ${APP.settings.printSize==='thermal'?'checked':''} onchange="setPrintSize('thermal')" class="sr-only peer"><div class="border-2 rounded-xl p-3 text-center peer-checked:border-sky-500 peer-checked:bg-sky-50"><div class="text-2xl">🧾</div><div class="text-xs font-bold mt-1">Thermal 80mm</div></div></label></div></div>
<div class="card"><h3 class="font-bold mb-4">🛡️ Warranty Defaults</h3><div class="grid grid-cols-2 gap-3"><div><label class="inp-lbl">Brand (Months)</label><input type="number" class="inp" value="${APP.settings.defaultBrandWarranty}" onchange="toggleSetting('defaultBrandWarranty',parseInt(this.value)||12)"></div><div><label class="inp-lbl">Shop (Months)</label><input type="number" class="inp" value="${APP.settings.defaultShopWarranty}" onchange="toggleSetting('defaultShopWarranty',parseInt(this.value)||6)"></div></div></div>
<div class="card"><h3 class="font-bold mb-4">📡 Data & Sync</h3><div class="space-y-3"><div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg"><div class="text-sm font-bold">Auto Backup</div><input type="checkbox" ${APP.settings.autoBackup?'checked':''} onchange="toggleSetting('autoBackup',this.checked)" class="w-5 h-5"></div><div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg"><div class="text-sm font-bold">WiFi Sync</div><input type="checkbox" ${APP.settings.wifiSyncEnabled?'checked':''} onchange="toggleSetting('wifiSyncEnabled',this.checked)" class="w-5 h-5"></div><div class="grid grid-cols-2 gap-3 mt-3"><button onclick="quickBackup()" class="btn-success">💾 Backup</button><button onclick="openRestoreDialog()" class="btn-secondary">📥 Restore</button></div></div></div>
<div class="card"><h3 class="font-bold mb-4">🏪 Store Info</h3><div class="space-y-3"><div><label class="inp-lbl">Shop Name</label><input type="text" id="setShopName" class="inp" value="${esc(APP.shopProfile.name||'')}"></div><div class="grid grid-cols-2 gap-3"><div><label class="inp-lbl">Phone</label><input type="tel" id="setShopPhone" class="inp" value="${esc(APP.shopProfile.phone||'')}"></div><div><label class="inp-lbl">Address</label><input type="text" id="setShopAddress" class="inp" value="${esc(APP.shopProfile.address||'')}"></div></div><div class="grid grid-cols-2 gap-3"><div><label class="inp-lbl">Bank</label><input type="text" id="setBankName" class="inp" value="${esc(APP.shopProfile.bankName||'')}"></div><div><label class="inp-lbl">Account</label><input type="text" id="setBankAcc" class="inp font-mono" value="${esc(APP.shopProfile.bankAcc||'')}"></div></div><div class="grid grid-cols-2 gap-3"><div><label class="inp-lbl">IFSC</label><input type="text" id="setBankIFSC" class="inp font-mono" value="${esc(APP.shopProfile.bankIFSC||'')}"></div><div><label class="inp-lbl">UPI ID</label><input type="text" id="setUpiId" class="inp font-mono" value="${esc(APP.shopProfile.upiId||'')}"></div></div><div><label class="inp-lbl">Terms</label><textarea id="setTerms" class="inp" rows="3">${esc(APP.shopProfile.terms||'')}</textarea></div><div><label class="inp-lbl">Master PIN</label><input type="text" id="setMasterPin" class="inp font-mono" value="${esc(APP.shopProfile.masterPin||'1234')}" maxlength="6"></div><button onclick="saveShopInfo()" class="btn-primary w-full">Save</button></div></div>
<div class="card border-rose-200 bg-rose-50"><h3 class="font-bold text-rose-900 mb-3">⚠️ Danger Zone</h3><button onclick="wipeAllData()" class="btn-danger w-full">🗑 Wipe All Data</button></div>
</div>`;};
function setGSTScheme(scheme){APP.gstConfig.scheme=scheme;lsSet('gst_config',APP.gstConfig);toast(`Scheme: ${scheme}`,'success');renderView('settings');}
function saveGSTConfig(){APP.gstConfig.gstin=document.getElementById('cfgGSTIN').value.trim();APP.gstConfig.stateCode=document.getElementById('cfgStateCode').value.trim()||'19';APP.gstConfig.stateName=document.getElementById('cfgStateName').value.trim();APP.gstConfig.compositionRate=parseFloat(document.getElementById('cfgCompRate').value)||1;lsSet('gst_config',APP.gstConfig);APP.shopProfile.gstin=APP.gstConfig.gstin;lsSet('shop_profile',APP.shopProfile);toast('Saved','success');}
function setPrintSize(size){APP.settings.printSize=size;lsSet('settings',APP.settings);toast(`Print: ${size==='a4'?'A4':'Thermal'}`,'success');}
function toggleSetting(k,v){APP.settings[k]=v;lsSet('settings',APP.settings);toast(`${k}: ${v?'ON':'OFF'}`,'info');}
function saveShopInfo(){APP.shopProfile.name=document.getElementById('setShopName').value.trim();APP.shopProfile.phone=document.getElementById('setShopPhone').value.trim();APP.shopProfile.address=document.getElementById('setShopAddress').value.trim();APP.shopProfile.bankName=document.getElementById('setBankName').value.trim();APP.shopProfile.bankAcc=document.getElementById('setBankAcc').value.trim();APP.shopProfile.bankIFSC=document.getElementById('setBankIFSC').value.trim();APP.shopProfile.upiId=document.getElementById('setUpiId').value.trim();APP.shopProfile.terms=document.getElementById('setTerms').value;APP.shopProfile.masterPin=document.getElementById('setMasterPin').value.trim()||'1234';lsSet('shop_profile',APP.shopProfile);document.getElementById('sidebarShopName').innerText=APP.shopProfile.name;toast('Saved','success');}
function wipeAllData(){const pin=prompt('PIN:');if(pin!==(APP.shopProfile.masterPin||'1234')){toast('Wrong','error');return;}const c=prompt('Type "DELETE ALL":');if(c!=='DELETE ALL'){toast('Cancelled','info');return;}Object.keys(localStorage).filter(k=>k.startsWith(LSP)).forEach(k=>localStorage.removeItem(k));toast('Wiped','success');setTimeout(()=>location.reload(),800);}

/* PRINT ENGINE */
function printInvoice(inv){if(!inv)return;const fmt=APP.settings.printSize==='thermal'?'thermal':'a4';const html=fmt==='thermal'?buildThermalInvoice(inv):buildA4Invoice(inv);const root=document.getElementById('printRoot');root.innerHTML=html;document.title='Invoice_'+inv.invoiceNo;setTimeout(()=>{window.print();setTimeout(()=>{document.title='SmartFix ERP';root.innerHTML='';},500);},100);}
function buildA4Invoice(inv){const sp=APP.shopProfile;const isNongst=inv.saleType==='nongst';const isComp=inv.saleType==='composition';const title=isNongst?'INVOICE':(isComp?'COMPOSITION INVOICE':'TAX INVOICE');const rows=(inv.items||[]).map((it,idx)=>{const lt=it.price*it.qty||it.grossAmount*it.qty;const rate=inv.saleType==='nongst'?0:(inv.saleType==='composition'?(APP.gstConfig.compositionRate||1):(it.gstRate||18));const taxable=rate>0?lt/(1+rate/100):lt;return `<tr style="border-bottom:1px solid #e2e8f0"><td style="padding:6px;text-align:center">${idx+1}</td><td style="padding:6px"><strong>${esc(it.desc)}</strong>${it.imei?`<br><small style="color:#64748b;font-family:monospace">IMEI: ${esc(it.imei)}</small>`:''}</td><td style="padding:6px;text-align:center;font-family:monospace">${esc(it.hsn||'8517')}</td><td style="padding:6px;text-align:center">${it.qty}</td><td style="padding:6px;text-align:right;font-family:monospace">${taxable.toFixed(2)}</td><td style="padding:6px;text-align:center">${isNongst?'-':rate+'%'}</td><td style="padding:6px;text-align:right;font-family:monospace;font-weight:bold">${lt.toFixed(2)}</td></tr>`;}).join('');return `<div style="font-family:Arial,sans-serif;font-size:11px;color:#0f172a;max-width:200mm;margin:0 auto;padding:10px"><div style="display:flex;justify-content:space-between;border-bottom:3px solid ${isNongst?'#92400e':'#0369a1'};padding-bottom:8px;margin-bottom:10px"><div><div style="font-size:22px;font-weight:900;color:${isNongst?'#92400e':'#075985'}">${esc(sp.name||'MY SHOP')}</div><div style="font-size:10px;color:#64748b;margin-top:3px">${esc(sp.address||'')}</div><div style="font-size:10px;color:#334155;margin-top:3px">Phone: <strong>${esc(sp.phone||'-')}</strong>${sp.gstin?' | GSTIN: <strong>'+esc(sp.gstin)+'</strong>':''}</div></div><div style="text-align:right"><div style="background:${isNongst?'#92400e':'#0369a1'};color:white;font-weight:900;font-size:10px;padding:4px 10px;border-radius:4px">${title}</div><div style="font-family:monospace;font-weight:900;margin-top:6px">${esc(inv.invoiceNo)}</div><div style="font-size:10px;color:#475569">Date: ${inv.date}</div>${inv.b2b?'<div style="background:#dbeafe;color:#1e40af;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-top:4px">B2B</div>':''}</div></div><div style="background:#f0f9ff;padding:8px;border:1px solid #bae6fd;border-radius:6px;margin-bottom:10px;display:flex;justify-content:space-between;font-size:10px"><div><div style="color:#64748b;font-size:9px;text-transform:uppercase;font-weight:700">Bill To</div><div style="font-weight:700;font-size:12px">${esc(inv.customerName||'Cash Customer')}</div><div>Phone: ${esc(inv.customerPhone||'-')}</div>${inv.customerGSTIN?`<div style="font-family:monospace">GSTIN: ${esc(inv.customerGSTIN)}</div>`:''}${inv.placeOfSupply?`<div>Place of Supply: ${esc(inv.placeOfSupply)}</div>`:''}</div><div style="text-align:right"><div style="color:#64748b;font-size:9px;text-transform:uppercase;font-weight:700">Payment</div><div style="font-weight:700;color:#065f46">${esc(inv.ledger||'Cash')}</div></div></div><table style="width:100%;border-collapse:collapse;font-size:10px"><thead style="background:${isNongst?'#92400e':'#0369a1'};color:white"><tr><th style="padding:6px;width:30px">#</th><th style="padding:6px;text-align:left">Description</th><th style="padding:6px;width:60px">HSN</th><th style="padding:6px;width:40px">Qty</th><th style="padding:6px;width:80px;text-align:right">Taxable</th><th style="padding:6px;width:50px">GST%</th><th style="padding:6px;width:90px;text-align:right">Total</th></tr></thead><tbody>${rows}</tbody></table><div style="margin-top:10px;display:flex;justify-content:space-between;font-size:11px"><div style="flex:1;padding-right:10px"><div style="font-weight:700;text-transform:uppercase;font-size:9px;color:#475569">Amount in Words</div><div style="font-weight:700">${numberToWords(inv.totalGross)}</div><div style="margin-top:12px;font-size:9px;color:#475569"><div style="font-weight:700;text-transform:uppercase">Bank</div><div>${esc(sp.bankName||'')} ${sp.bankAcc?'· A/c: '+esc(sp.bankAcc):''}</div>${sp.bankIFSC?`<div>IFSC: ${esc(sp.bankIFSC)}</div>`:''}${sp.upiId?`<div>UPI: <strong>${esc(sp.upiId)}</strong></div>`:''}</div><div style="margin-top:12px;font-size:9px;color:#64748b;white-space:pre-line">${esc(sp.terms||'')}</div></div><div style="width:260px"><div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>Taxable:</span><span style="font-family:monospace">${money(inv.totalTaxable)}</span></div>${inv.discount?`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0;color:#be123c"><span>Discount:</span><span style="font-family:monospace">-${money(inv.discount)}</span></div>`:''}${!isNongst?`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>CGST:</span><span style="font-family:monospace">${money(inv.totalCGST||0)}</span></div><div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>SGST:</span><span style="font-family:monospace">${money(inv.totalSGST||0)}</span></div>${inv.totalIGST?`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>IGST:</span><span style="font-family:monospace">${money(inv.totalIGST)}</span></div>`:''}`:''}<div style="display:flex;justify-content:space-between;padding:8px;background:${isNongst?'#92400e':'#0369a1'};color:white;font-weight:900;font-size:13px;margin-top:6px;border-radius:4px"><span>TOTAL:</span><span style="font-family:monospace">${money(inv.totalGross)}</span></div></div></div><div style="margin-top:40px;display:flex;justify-content:space-between;font-size:10px"><div></div><div style="border-top:1px solid #94a3b8;padding-top:4px;width:200px;text-align:center;font-weight:700">Authorised Signatory</div></div><div style="margin-top:20px;text-align:center;color:#94a3b8;font-size:9px;font-family:monospace;border-top:1px solid #e2e8f0;padding-top:6px">SmartFix ERP © 2026 · ${isNongst?'Non-GST Invoice':isComp?'Composition Invoice':'GST Tax Invoice'}</div></div>`;}
function buildThermalInvoice(inv){const sp=APP.shopProfile;const isNongst=inv.saleType==='nongst';const rows=(inv.items||[]).map(it=>{const lt=it.price*it.qty||it.grossAmount*it.qty;const rate=inv.saleType==='nongst'?0:(inv.saleType==='composition'?(APP.gstConfig.compositionRate||1):(it.gstRate||18));return `<tr><td colspan="2" style="font-weight:700;padding-top:3px">${esc(it.desc)}</td></tr>${it.imei?`<tr><td colspan="2" style="font-size:9px;color:#333">IMEI: ${esc(it.imei)}</td></tr>`:''}<tr><td>${it.qty} × ${(lt/it.qty).toFixed(2)}${isNongst?'':` (${rate}%)`}</td><td style="text-align:right;font-weight:700">${lt.toFixed(2)}</td></tr>`;}).join('');return `<div class="thermal-receipt"><div class="center"><div class="big bold">${esc(sp.name||'MY SHOP')}</div><div style="font-size:10px">${esc(sp.address||'')}</div><div style="font-size:10px">Ph: ${esc(sp.phone||'-')}</div>${sp.gstin?`<div style="font-size:10px">GSTIN: ${esc(sp.gstin)}</div>`:''}</div><div class="hr"></div><div style="text-align:center;font-weight:700;font-size:10px">${isNongst?'INVOICE':(inv.saleType==='composition'?'COMPOSITION':'TAX INVOICE')}</div><div class="hr"></div><div style="display:flex;justify-content:space-between;font-size:10px"><div>${esc(inv.invoiceNo)}</div><div>${inv.date}</div></div><div style="font-size:10px">${esc(inv.customerName||'Cash')} · ${esc(inv.customerPhone||'')}</div>${inv.customerGSTIN?`<div style="font-size:9px">GSTIN: ${esc(inv.customerGSTIN)}</div>`:''}<div class="hr"></div><table>${rows}</table><div class="hr"></div><table style="font-size:10px"><tr><td>Subtotal</td><td class="right">${(inv.totalGross+(inv.discount||0)).toFixed(2)}</td></tr>${inv.discount?`<tr><td>Discount</td><td class="right">-${inv.discount.toFixed(2)}</td></tr>`:''}${!isNongst?`<tr><td>CGST</td><td class="right">${(inv.totalCGST||0).toFixed(2)}</td></tr><tr><td>SGST</td><td class="right">${(inv.totalSGST||0).toFixed(2)}</td></tr>${inv.totalIGST?`<tr><td>IGST</td><td class="right">${inv.totalIGST function quickBackup(){const blob=new Blob([JSON.stringify(buildSnapshot(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`SmartFixERP_Backup_${fmtDate(new Date())}.json`;a.click();URL.revokeObjectURL(url);lsSet('last_backup',new Date().toISOString());toast('Backup downloaded','success');}
function buildSnapshot(){return{version:APP.version,exportedAt:new Date().toISOString(),shopProfile:APP.shopProfile,gstConfig:APP.gstConfig,users:APP.users,invoices:APP.invoices,purchases:APP.purchases,supplierPayments:APP.supplierPayments,creditNotes:APP.creditNotes,vouchers:APP.vouchers,inventory:APP.inventory,serviceJobs:APP.serviceJobs,warranties:APP.warranties,emis:APP.emis,emiProviders:APP.emiProviders,staff:APP.staff,salaryPayments:APP.salaryPayments,customers:APP.customers,suppliers:APP.suppliers,categories:APP.categories,auditLog:APP.auditLog,settings:APP.settings};}
function openRestoreDialog(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=(e)=>{const file=e.target.files[0];if(!file)return;if(!confirm('Restore will REPLACE all data. Continue?'))return;const reader=new FileReader();reader.onload=(ev)=>{try{const data=JSON.parse(ev.target.result);if(!data.shopProfile&&!data.invoices){toast('Invalid backup','error');return;}const map={shopProfile:'shop_profile',gstConfig:'gst_config',users:'users',invoices:'invoices',purchases:'purchases',supplierPayments:'supplier_payments',creditNotes:'credit_notes',vouchers:'vouchers',inventory:'stock',serviceJobs:'service_jobs',warranties:'warranties',emis:'emis',emiProviders:'emi_providers',staff:'staff',salaryPayments:'salary_payments',customers:'customers',suppliers:'suppliers',categories:'categories',auditLog:'audit_log',settings:'settings'};Object.keys(data).forEach(k=>{if(data[k]!==undefined&&map[k])lsSet(map[k],data[k]);});toast('Restored! Reloading...','success');setTimeout(()=>location.reload(),900);}catch(e){toast('Error: '+e.message,'error',4000);}};reader.readAsText(file);};input.click();}
