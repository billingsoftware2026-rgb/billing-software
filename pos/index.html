<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SmartFix ERP</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%230ea5e9'/%3E%3Ctext x='256' y='340' font-size='260' text-anchor='middle' fill='white'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SmartFix ERP">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
*{-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{background:#0f172a;font-family:'Inter',system-ui,-apple-system,sans-serif}
.app-shell{display:flex;height:100dvh;overflow:hidden}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-up{animation:fadeSlideUp .5s cubic-bezier(.16,1,.3,1) both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.float-anim{animation:float 3s ease-in-out infinite}
.sidebar{width:240px;background:#0f172a;border-right:1px solid #1e293b;transition:transform .3s}
@media(max-width:1023px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 16px;margin:2px 8px;border-radius:10px;color:#94a3b8;font-weight:500;font-size:14px;cursor:pointer;transition:.15s;user-select:none}
.nav-item:hover{background:#1e293b;color:#f1f5f9}
.nav-item.active{background:linear-gradient(135deg,#0ea5e9,#0369a1);color:white;box-shadow:0 4px 16px rgba(14,165,233,.35)}
.nav-item .icon{font-size:18px;width:22px;text-align:center}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:1px solid #1e293b;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0));z-index:55}
@media(max-width:1023px){.bottom-nav{display:flex}}
.bottom-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 4px;color:#64748b;font-size:10px;font-weight:600;cursor:pointer;border-radius:8px;transition:.15s}
.bottom-item.active{color:#38bdf8}
.bottom-item .bi-icon{font-size:20px;margin-bottom:2px}
.main-content{flex:1;overflow-y:auto;background:#f8fafc;padding-bottom:80px}
@media(min-width:1024px){.main-content{padding-bottom:0}}
.topbar{background:#0f172a;border-bottom:1px solid #1e293b;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.card{background:#fff;border-radius:14px;padding:16px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.inp{width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:9px 12px;font-size:13px;background:#fff;color:#0f172a;transition:.15s;outline:none}
.inp:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.12)}
.inp-lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#64748b;margin-bottom:4px}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;border:none;cursor:pointer;font-size:13px;transition:.15s;box-shadow:0 4px 12px rgba(14,165,233,.3)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{background:#1e293b;color:#e2e8f0;font-weight:600;padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-size:13px}
.btn-secondary:hover{background:#334155}
.btn-success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;border:none;cursor:pointer;font-size:13px;box-shadow:0 4px 12px rgba(34,197,94,.3)}
.btn-ca{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;border:none;cursor:pointer;font-size:13px;box-shadow:0 4px 12px rgba(139,92,246,.3)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-weight:700;padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-size:13px}
.btn-icon{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}
.btn-icon:hover{background:#e2e8f0}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em}
.badge-received{background:#fef3c7;color:#92400e}
.badge-diagnosing{background:#dbeafe;color:#1e40af}
.badge-repairing{background:#e0e7ff;color:#3730a3}
.badge-ready{background:#d1fae5;color:#065f46}
.badge-delivered{background:#f1f5f9;color:#475569}
.badge-cancelled{background:#fee2e2;color:#991b1b}
.badge-b2b{background:#dbeafe;color:#1e40af}
.badge-b2c{background:#f3e8ff;color:#6b21a8}
.badge-nongst{background:#fef3c7;color:#92400e}
.badge-comp{background:#e0e7ff;color:#3730a3}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:.3s cubic-bezier(.16,1,.3,1);z-index:9999;pointer-events:none;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:linear-gradient(135deg,#22c55e,#16a34a)}
.toast.error{background:linear-gradient(135deg,#ef4444,#dc2626)}
.toast.warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,.5);display:flex;flex-direction:column}
.modal-body{overflow-y:auto;padding:20px}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stat-card{padding:14px;border-radius:12px;color:#fff}
.tab-pill{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;background:#f1f5f9;color:#64748b;display:inline-block;border:none}
.tab-pill.active{background:#0ea5e9;color:#fff}
#printRoot{display:none}
@media print{body>*:not(#printRoot){display:none!important}#printRoot{display:block!important}@page{margin:5mm}.no-print{display:none!important}}
.thermal-receipt{width:76mm;font-family:'Courier New',monospace;font-size:11px;line-height:1.35;color:#000;padding:2mm;margin:0 auto}
.thermal-receipt .center{text-align:center}
.thermal-receipt .right{text-align:right}
.thermal-receipt .bold{font-weight:700}
.thermal-receipt .big{font-size:14px}
.thermal-receipt .hr{border-top:1px dashed #000;margin:4px 0}
.thermal-receipt table{width:100%;border-collapse:collapse}
.thermal-receipt td{padding:1px 0;font-size:10px}
.qty-btn{width:26px;height:26px;border-radius:6px;background:#e2e8f0;border:none;font-weight:700;cursor:pointer;font-size:14px}
.qty-btn:hover{background:#cbd5e1}
.data-table{width:100%;font-size:12px;border-collapse:collapse}
.data-table thead{background:#f1f5f9;color:#64748b;font-size:10px;text-transform:uppercase;font-weight:700}
.data-table th{padding:9px 12px;text-align:left}
.data-table th.text-right{text-align:right}
.data-table th.text-center{text-align:center}
.data-table td{padding:9px 12px;border-top:1px solid #f1f5f9}
.data-table tbody tr:hover{background:#f8fafc}
.ca-hero{background:linear-gradient(135deg,#8b5cf6 0%,#6d28d9 100%);color:#fff;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(139,92,246,.35)}
</style>
</head>
<body>
<div id="printRoot"></div>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="min-h-screen w-full flex items-center justify-center p-4 relative overflow-hidden" style="background:radial-gradient(ellipse at top,#1e3a8a 0%,#0f172a 45%,#020617 100%);">
  <div class="absolute w-[400px] h-[400px] rounded-full blur-[100px] opacity-30" style="background:#0ea5e9;top:-100px;left:-100px"></div>
  <div class="absolute w-[300px] h-[300px] rounded-full blur-[100px] opacity-20" style="background:#8b5cf6;bottom:-80px;right:-80px"></div>
  <div class="relative w-full max-w-md animate-fade-up">
    <div class="text-center mb-8">
      <div class="inline-flex w-20 h-20 bg-gradient-to-br from-sky-400 to-blue-700 rounded-[22px] items-center justify-center text-white text-4xl shadow-2xl shadow-sky-500/40 float-anim mb-4">🔧</div>
      <h1 class="text-3xl font-black tracking-tight text-white">SmartFix <span class="text-sky-400">ERP</span></h1>
      <p class="text-slate-400 text-xs mt-1.5 font-medium">Tally-Grade Mobile Shop Management</p>
      <p class="text-[10px] text-slate-500 mt-1">v4.3 · GST · Non-GST · CA Role</p>
    </div>
    <div class="bg-white/[0.07] backdrop-blur-2xl border border-white/10 rounded-3xl p-6 shadow-2xl">
      <div class="flex bg-black/20 rounded-xl p-1 mb-5">
        <button type="button" onclick="switchLoginMode('shop')" id="loginTab-shop" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow">🏪 Shop</button>
        <button type="button" onclick="switchLoginMode('customer')" id="loginTab-customer" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-400">👤 Customer</button>
      </div>
      <form id="shopLoginForm" onsubmit="doShopLogin(event)" class="space-y-4">
        <div><label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">User ID / Mobile</label>
          <input type="text" id="loginUser" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-sky-400" placeholder="User ID" required></div>
        <div><label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
          <input type="password" id="loginPass" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-sky-400" placeholder="Password" required></div>
        <div class="flex justify-between items-center text-xs">
          <label class="flex items-center gap-2 text-slate-400 cursor-pointer"><input type="checkbox" id="rememberMe" class="rounded"><span>Remember me</span></label>
          <a href="javascript:void(0)" onclick="showForgotPassword()" class="text-sky-400 hover:text-sky-300 font-semibold">Forgot?</a>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-sky-500/30 active:scale-[.98]">Sign In →</button>
      </form>
      <form id="customerLoginForm" onsubmit="doCustomerLogin(event)" class="space-y-4" style="display:none">
        <div><label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Mobile Number</label>
          <input type="tel" id="custLoginPhone" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-400 font-mono" placeholder="10-digit" maxlength="10" required></div>
        <div><label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">IMEI Last 6 Digits</label>
          <input type="text" id="custLoginIMEI6" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-400 font-mono tracking-widest" placeholder="123456" maxlength="6"></div>
        <div><label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Or Invoice Number</label>
          <input type="text" id="custLoginInv" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-400 font-mono" placeholder="SFP-202627-0001"></div>
        <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-500/30 active:scale-[.98]">View My Devices →</button>
      </form>
      <div id="firstTimeSetupBox" class="mt-5 pt-5 border-t border-white/10 text-center" style="display:none">
        <p class="text-xs text-slate-400 mb-3">First time? Set up your shop now.</p>
        <button type="button" onclick="startShopSetup()" class="text-xs bg-white/10 hover:bg-white/20 text-white font-bold px-5 py-2.5 rounded-lg transition">✨ Setup New Shop</button>
      </div>
    </div>
    <div class="text-center mt-6 text-[10px] text-slate-500">
      <div>SmartFix ERP © 2026 · Dev: Debapriya Sarkar</div>
      <div class="flex items-center justify-center gap-2 mt-2"><span class="sync-dot bg-emerald-500"></span><span id="loginSyncStatus">Offline Ready</span></div>
    </div>
  </div>
</div>

<!-- APP SHELL -->
<div id="appShell" class="app-shell" style="display:none">
  <aside id="sidebar" class="sidebar flex flex-col">
    <div class="p-4 border-b border-slate-800 flex items-center gap-3">
      <div class="w-9 h-9 bg-gradient-to-br from-sky-400 to-blue-600 rounded-xl flex items-center justify-center text-white text-lg shadow-lg shadow-sky-500/30">🔧</div>
      <div class="min-w-0 flex-1"><div class="text-white font-black text-sm tracking-tight">SmartFix ERP</div><div class="text-[10px] text-slate-500 truncate" id="sidebarShopName">Shop</div></div>
    </div>
    <nav id="sidebarNav" class="flex-1 overflow-y-auto py-2"></nav>
    <div class="p-3 border-t border-slate-800">
      <div class="flex items-center gap-2 p-2 rounded-lg bg-slate-800/50">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-sky-500 to-blue-700 flex items-center justify-center text-white text-xs font-bold" id="userAvatar">U</div>
        <div class="flex-1 min-w-0"><div class="text-xs font-bold text-white truncate" id="userNameDisplay">User</div><div class="text-[10px] text-slate-500 capitalize" id="userRoleDisplay">Owner</div></div>
        <button type="button" onclick="doLogout()" class="text-slate-500 hover:text-red-400 p-1.5 rounded" title="Logout">⎋</button>
      </div>
    </div>
  </aside>
  <div id="sidebarOverlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/60 z-[58] hidden"></div>
  <div class="flex-1 flex flex-col min-w-0">
    <div class="topbar">
      <div class="flex items-center gap-3">
        <button type="button" onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1.5">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div><div class="text-white font-bold text-base" id="pageTitle">Dashboard</div><div class="text-[10px] text-slate-500" id="pageSubtitle">Welcome</div></div>
      </div>
      <div class="flex items-center gap-2">
        <div id="syncIndicator" class="hidden sm:flex items-center gap-1.5 text-[10px] bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full">
          <span class="sync-dot bg-emerald-500"></span><span class="text-emerald-400 font-semibold" id="syncStatusText">Synced</span>
        </div>
        <button type="button" onclick="quickBackup()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">💾</button>
        <button type="button" onclick="openNotifications()" class="relative bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm p-2 rounded-lg">
          🔔<span id="notifBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center" style="display:none">0</span>
        </button>
      </div>
    </div>
    <main id="mainContent" class="main-content flex-1"></main>
  </div>
  <nav id="bottomNav" class="bottom-nav"></nav>
</div>

<div id="toast" class="toast"></div>

<script>
/* STATE */
const APP={version:'4.3.0',user:null,shopProfile:{},gstConfig:{scheme:'regular',stateCode:'19',stateName:'West Bengal',compositionRate:1,gstin:'',tan:''},users:[],invoices:[],purchases:[],supplierPayments:[],creditNotes:[],vouchers:[],inventory:[],serviceJobs:[],warranties:[],emis:[],emiProviders:[],staff:[],salaryPayments:[],customers:[],suppliers:[],categories:[],auditLog:[],settings:{printSize:'a4',barcodeEnabled:false,autoBackup:true,wifiSyncEnabled:true,defaultBrandWarranty:12,defaultShopWarranty:6},currentView:null,activeServiceTab:'all',activeWarrantyTab:'active',activeEmiTab:'plans',activeReportTab:'pl',activeGstMonth:null,cart:[],purchaseLines:[],activeReturnInvoice:null};

/* STORAGE & SYNC */
const LSP='sfp_';
function lsGet(k,def){try{const v=localStorage.getItem(LSP+k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(LSP+k,JSON.stringify(v));broadcastSync(k);return true;}catch(e){toast('Storage full!','error',5000);return false;}}
function lsRemove(k){try{localStorage.removeItem(LSP+k);}catch(e){}}
let syncChannel=null;
try{if(typeof BroadcastChannel!=='undefined'){syncChannel=new BroadcastChannel('smartfix-sync');syncChannel.onmessage=(ev)=>{if(ev.data&&ev.data.type==='data-updated'){loadAllData();showSyncIndicator('Synced','emerald');if(APP.currentView&&VIEW_RENDERERS[APP.currentView])renderView(APP.currentView);}};}}catch(e){}
window.addEventListener('storage',(ev)=>{if(ev.key&&ev.key.startsWith(LSP)){loadAllData();showSyncIndicator('Synced','emerald');}});
function broadcastSync(key){if(syncChannel&&APP.settings.wifiSyncEnabled){try{syncChannel.postMessage({type:'data-updated',key,ts:Date.now()});}catch(e){}}}
function showSyncIndicator(text,color){const el=document.getElementById('syncStatusText');if(!el)return;el.innerText=text;el.className=color==='emerald'?'text-emerald-400 font-semibold':color==='amber'?'text-amber-400 font-semibold':'text-rose-400 font-semibold';const dot=document.querySelector('#syncIndicator .sync-dot');if(dot)dot.className='sync-dot '+(color==='emerald'?'bg-emerald-500':color==='amber'?'bg-amber-500':'bg-rose-500');}

/* UTILS */
function toast(msg,type='info',duration=2500){const el=document.getElementById('toast');if(!el)return;el.innerText=msg;el.className='toast show '+(type==='success'?'success':type==='error'?'error':type==='warn'?'warn':'');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),duration);}
function fmtDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;}
function fmtDateTime(d){const dt=new Date(d);return dt.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function money(n){return '₹'+(parseFloat(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function moneyInt(n){return '₹'+Math.round(parseFloat(n)||0).toLocaleString('en-IN');}
function getFY(dt){dt=dt||new Date();const y=dt.getFullYear(),m=dt.getMonth();if(m>=3)return{label:`FY ${y}-${(y+1).toString().slice(-2)}`,start:new Date(y,3,1),end:new Date(y+1,2,31,23,59,59)};return{label:`FY ${y-1}-${y.toString().slice(-2)}`,start:new Date(y-1,3,1),end:new Date(y,2,31,23,59,59)};}
function normalizeIMEI(s){return(s||'').toString().trim().toUpperCase().replace(/[\s\-_]/g,'');}
function hashPass(str){let h=0;for(let i=0;i<str.length;i++)h=((h<<5)-h+str.charCodeAt(i))|0;return 'h'+Math.abs(h).toString(36);}
function esc(s){return(s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(p='id'){return p+'_'+Date.now()+'_'+Math.floor(Math.random()*10000);}
function numberToWords(num){const a=['','ONE ','TWO ','THREE ','FOUR ','FIVE ','SIX ','SEVEN ','EIGHT ','NINE ','TEN ','ELEVEN ','TWELVE ','THIRTEEN ','FOURTEEN ','FIFTEEN ','SIXTEEN ','SEVENTEEN ','EIGHTEEN ','NINETEEN '];const b=['','','TWENTY ','THIRTY ','FORTY ','FIFTY ','SIXTY ','SEVENTY ','EIGHTY ','NINETY '];let n=('000000000'+Math.floor(num||0)).substr(-9);let m=n.match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);if(!m)return '';let str='';str+=(m[1]!=0)?(a[Number(m[1])]||b[m[1][0]]+a[m[1][1]])+'CRORE ':'';str+=(m[2]!=0)?(a[Number(m[2])]||b[m[2][0]]+a[m[2][1]])+'LAKH ':'';str+=(m[3]!=0)?(a[Number(m[3])]||b[m[3][0]]+a[m[3][1]])+'THOUSAND ':'';str+=(m[4]!=0)?(a[Number(m[4])]||b[m[4][0]]+a[m[4][1]])+'HUNDRED ':'';str+=(m[5]!=0)?((str!='')?'AND ':'')+(a[Number(m[5])]||b[m[5][0]]+a[m[5][1]])+'RUPEES ONLY':'RUPEES ONLY';return str.trim();}
function logAudit(action,details){APP.auditLog.unshift({id:uid('log'),ts:new Date().toISOString(),user:APP.user?APP.user.name:'system',action,details});if(APP.auditLog.length>1000)APP.auditLog.length=1000;lsSet('audit_log',APP.auditLog);}
function purchaseGST(pur){const total=pur.totalTax||0;const cgst=pur.gstType==='INTRA'?total/2:0;const sgst=pur.gstType==='INTRA'?total/2:0;const igst=pur.gstType==='INTER'?total:0;return{cgst,sgst,igst,total};}
function getMonthList(){const months=new Set();APP.invoices.forEach(i=>months.add(i.date.substring(0,7)));APP.purchases.forEach(p=>months.add(p.date.substring(0,7)));APP.serviceJobs.forEach(j=>{const d=j.createdAt||j.deliveredAt;if(d)months.add(d.substring(0,7));});const arr=[...months].sort().reverse();if(!arr.length)arr.push(fmtDate(new Date()).substring(0,7));return arr;}
function getCurrentMonth(){return APP.activeGstMonth||getMonthList()[0];}
function monthLabel(ym){const[y,m]=ym.split('-');const names=['January','February','March','April','May','June','July','August','September','October','November','December'];return names[parseInt(m,10)-1]+' '+y;}
function addMonths(d,m){const dt=new Date(d);dt.setMonth(dt.getMonth()+m);return dt.toISOString();}
function getWarrantyStatus(w){const now=new Date();if(now<=new Date(w.brandWarrantyEnd))return 'active';if(now<=new Date(w.shopWarrantyEnd))return 'shop-only';return 'expired';}
function nextInvoiceNo(dt){dt=dt||new Date();const fy=getFY(dt),prefix=`SFP-${fy.label.replace('FY ','').replace('-','')}-`;let mx=0;APP.invoices.forEach(i=>{if(i.invoiceNo&&i.invoiceNo.startsWith(prefix)){const n=parseInt(i.invoiceNo.slice(prefix.length),10)||0;if(n>mx)mx=n;}});return `${prefix}${(mx+1).toString().padStart(4,'0')}`;}
function nextCRNNo(dt){dt=dt||new Date();const fy=getFY(dt),prefix=`CRN-${fy.label.replace('FY ','').replace('-','')}-`;let mx=0;APP.creditNotes.forEach(c=>{if(c.crnNo&&c.crnNo.startsWith(prefix)){const n=parseInt(c.crnNo.slice(prefix.length),10)||0;if(n>mx)mx=n;}});return `${prefix}${(mx+1).toString().padStart(4,'0')}`;}
function nextPurchaseNo(dt){dt=dt||new Date();const fy=getFY(dt),prefix=`PUR-${fy.label.replace('FY ','').replace('-','')}-`;let mx=0;APP.purchases.forEach(p=>{if(p.purchaseNo&&p.purchaseNo.startsWith(prefix)){const n=parseInt(p.purchaseNo.slice(prefix.length),10)||0;if(n>mx)mx=n;}});return `${prefix}${(mx+1).toString().padStart(4,'0')}`;}
function nextJobNo(){const fy=getFY();const prefix=`JOB-${fy.label.replace('FY ','').replace('-','')}-`;let mx=0;APP.serviceJobs.forEach(j=>{if(j.jobNo&&j.jobNo.startsWith(prefix)){const n=parseInt(j.jobNo.slice(prefix.length),10)||0;if(n>mx)mx=n;}});return prefix+(mx+1).toString().padStart(4,'0');}
function nextEmiNo(){const fy=getFY();const prefix=`EMI-${fy.label.replace('FY ','').replace('-','')}-`;let mx=0;APP.emis.forEach(e=>{if(e.emiNo&&e.emiNo.startsWith(prefix)){const n=parseInt(e.emiNo.slice(prefix.length),10)||0;if(n>mx)mx=n;}});return prefix+(mx+1).toString().padStart(4,'0');}

function switchLoginMode(mode){const shopTab=document.getElementById('loginTab-shop');const custTab=document.getElementById('loginTab-customer');const shopForm=document.getElementById('shopLoginForm');const custForm=document.getElementById('customerLoginForm');const firstTime=document.getElementById('firstTimeSetupBox');if(mode==='shop'){shopTab.className='flex-1 py-2.5 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow';custTab.className='flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-400';shopForm.style.display='block';custForm.style.display='none';firstTime.style.display=APP.users.length===0?'block':'none';}else{custTab.className='flex-1 py-2.5 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow';shopTab.className='flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-400';shopForm.style.display='none';custForm.style.display='block';firstTime.style.display='none';}}
function doShopLogin(e){e.preventDefault();const uidVal=document.getElementById('loginUser').value.trim().toLowerCase();const pwd=document.getElementById('loginPass').value;const user=APP.users.find(u=>(u.userId||'').toLowerCase()===uidVal||(u.phone||'')===uidVal);if(!user){toast('User not found','error');return;}if(user.passwordHash!==hashPass(pwd)){toast('Incorrect password','error');return;}if(user.status==='disabled'){toast('Account disabled','error');return;}APP.user={...user,passwordHash:undefined};if(document.getElementById('rememberMe').checked)lsSet('remember_user',user.id);lsSet('current_user_id',user.id);user.lastLogin=new Date().toISOString();lsSet('users',APP.users);enterApp();}

function startShopSetup(){const name=prompt('Shop Name:');if(!name)return;const ownerName=prompt('Owner Name:');if(!ownerName)return;const phone=prompt('Owner Mobile (10 digits):');if(!phone||!/^\d{10}$/.test(phone)){toast('Invalid mobile','error');return;}const pwd=prompt('Set Password (min 4 chars):');if(!pwd||pwd.length<4){toast('Password too short','error');return;}const gstChoice=prompt('GST Scheme?\n1 = Regular GST\n2 = Composition (1%)\n3 = Non-GST\n\nEnter 1/2/3:','1')||'1';let scheme='regular';if(gstChoice==='2')scheme='composition';else if(gstChoice==='3')scheme='nongst';let gstin='';let stateCode='19';if(scheme!=='nongst'){gstin=prompt('GSTIN (optional):')||'';if(gstin&&gstin.length>=2)stateCode=gstin.substring(0,2);}APP.users=[{id:uid('u'),userId:phone,name:ownerName,phone,role:'owner',designation:'Shop Owner',passwordHash:hashPass(pwd),status:'active',createdAt:new Date().toISOString(),lastLogin:null}];lsSet('users',APP.users);APP.gstConfig={scheme,stateCode,stateName:stateCode==='19'?'West Bengal':'State '+stateCode,compositionRate:scheme==='composition'?1:0,gstin,tan:''};lsSet('gst_config',APP.gstConfig);APP.shopProfile={name,phone,address:'',gstin,logo:'',bankName:'',bankBranch:'',bankAcc:'',bankIFSC:'',upiId:'',terms:'1. Warranty strictly by Brand Authorized Service Centers.\n2. Goods once sold are not returnable without original invoice.\n3. Physical/liquid damage voids warranty.',isLocked:true,masterPin:'1234',createdAt:new Date().toISOString()};lsSet('shop_profile',APP.shopProfile);APP.emiProviders=[{id:'p_bajaj',name:'Bajaj Finance',commission:6,active:true},{id:'p_hdb',name:'HDB Financial',commission:5,active:true},{id:'p_zest',name:'ZestMoney',commission:7,active:true},{id:'p_idfc',name:'IDFC First',commission:5.5,active:true},{id:'p_other',name:'Other',commission:0,active:true}];lsSet('emi_providers',APP.emiProviders);APP.categories=['Mobile Phone','Mobile Cover','Tempered Glass','Cable','Charger','Earphone','Power Bank','Memory Card','Other'];lsSet('categories',APP.categories);toast('Shop created! Signing in...','success');setTimeout(()=>{document.getElementById('loginUser').value=phone;document.getElementById('loginPass').value=pwd;document.getElementById('shopLoginForm').dispatchEvent(new Event('submit',{cancelable:true}));},1200);}
function showForgotPassword(){const phone=prompt('Registered mobile:');if(!phone)return;const user=APP.users.find(u=>(u.phone||'')===phone);if(!user){toast('No account','error');return;}const pin=prompt('Master PIN:');if(pin!==(APP.shopProfile.masterPin||'1234')){toast('Wrong PIN','error');return;}const newPwd=prompt('New password (min 4):');if(!newPwd||newPwd.length<4)return;user.passwordHash=hashPass(newPwd);lsSet('users',APP.users);toast('Password reset!','success');}

/* CA HSN */
VIEW_RENDERERS.caHSN=()=>{const month=getCurrentMonth();const inv=APP.invoices.filter(i=>i.date.startsWith(month)&&i.saleType==='regular');const months=getMonthList();const hsnMap={};inv.forEach(i=>{(i.items||[]).forEach(it=>{const hsn=it.hsn||'8517';if(!hsnMap[hsn])hsnMap[hsn]={desc:it.desc,qty:0,taxable:0,cgst:0,sgst:0,igst:0,total:0};const line=it.price*it.qty||it.grossAmount*it.qty;const rate=it.gstRate||18;const taxable=line/(1+rate/100);const tax=line-taxable;hsnMap[hsn].qty+=it.qty;hsnMap[hsn].taxable+=taxable;hsnMap[hsn].total+=line;if(i.gstNature==='INTRA'){hsnMap[hsn].cgst+=tax/2;hsnMap[hsn].sgst+=tax/2;}else hsnMap[hsn].igst+=tax;});});const hsnList=Object.keys(hsnMap).map(k=>({hsn:k,...hsnMap[k]}));return `

ceOfSupply||'-',Rate:(i.items[0]||{}).gstRate||18,Taxable:i.totalTaxable,CGST:i.totalCGST,SGST:i.totalSGST,IGST:i.totalIGST}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(b2cRows),'GSTR1_B2C');const hsnMap={};gstInv.forEach(i=>{(i.items||[]).forEach(it=>{const hsn=it.hsn||'8517';if(!hsnMap[hsn])hsnMap[hsn]={HSN:hsn,Desc:it.desc,Rate:it.gstRate||18,Qty:0,Taxable:0,CGST:0,SGST:0,IGST:0};const line=it.price*it.qty||it.grossAmount*it.qty;const r=it.gstRate||18;const taxable=line/(1+r/100);const tax=line-taxable;hsnMap[hsn].Qty+=it.qty;hsnMap[hsn].Taxable+=taxable;if(i.gstNature==='INTRA'){hsnMap[hsn].CGST+=tax/2;hsnMap[hsn].SGST+=tax/2;}else hsnMap[hsn].IGST+=tax;});});XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.values(hsnMap)),'HSN_Summary');const outCgst=gstInv.reduce((s,i)=>s+(i.totalCGST||0),0);const outSgst=gstInv.reduce((s,i)=>s+(i.totalSGST||0),0);const outIgst=gstInv.reduce((s,i)=>s+(i.totalIGST||0),0);const inCgst=itcPur.reduce((s,p)=>s+purchaseGST(p).cgst,0);const inSgst=itcPur.reduce((s,p)=>s+purchaseGST(p).sgst,0);const inIgst=itcPur.reduce((s,p)=>s+purchaseGST(p).igst,0);const gstr3bRows=[{Section:'3.1(a)',Particulars:'Outward taxable supplies','Taxable Value':gstInv.reduce((s,i)=>s+(i.totalTaxable||0),0),CGST:outCgst,SGST:outSgst,IGST:outIgst,Cess:0},{Section:'4(A)(5)',Particulars:'All other ITC','Taxable Value':0,CGST:inCgst,SGST:inSgst,IGST:inIgst,Cess:0},{Section:'5',Particulars:'Tax payable','Taxable Value':0,CGST:Math.max(0,outCgst-inCgst),SGST:Math.max(0,outSgst-inSgst),IGST:Math.max(0,outIgst-inIgst),Cess:0}];XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(gstr3bRows),'GSTR3B_Summary');const summary=[{Month:monthLabel(month),'Total Sales':inv.reduce((s,i)=>s+i.totalGross,0),'Total Purchases':pur.reduce((s,p)=>s+p.totalCost,0),'Total Invoices':inv.length,'Total Bills':pur.length,'Output CGST':outCgst,'Output SGST':outSgst,'Output IGST':outIgst,'Input CGST':inCgst,'Input SGST':inSgst,'Input IGST':inIgst,'Net CGST Payable':Math.max(0,outCgst-inCgst),'Net SGST Payable':Math.max(0,outSgst-inSgst),'Net IGST Payable':Math.max(0,outIgst-inIgst),'Net Total Payable':Math.max(0,outCgst-inCgst)+Math.max(0,outSgst-inSgst)+Math.max(0,outIgst-inIgst)}];XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'Summary');const shopRows=[{'Shop Name':APP.shopProfile.name||'-',GSTIN:APP.gstConfig.gstin||'-',State:APP.gstConfig.stateName||'-','State Code':APP.gstConfig.stateCode||'-','GST Scheme':APP.gstConfig.scheme||'regular','Generated At':new Date().toLocaleString('en-IN')}];XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(shopRows),'Info');XLSX.writeFile(wb,`SmartFix_GST_Package_${month}.xlsx`);logAudit('CA_DOWNLOAD','Full Package '+month);toast('Complete GST Package downloaded!','success',3500);}

</div>

VIEW_AFTER.sales=()=>{renderCart();updateB2BBadge();onSaleTypeChange();};
function onSaleTypeChange(){const st=document.getElementById('saleType')?.value||'regular';const ng=document.getElementById('nongstWarning');const cp=document.getElementById('compositionWarning');if(ng)ng.style.display=st==='nongst'?'block':'none';if(cp)cp.style.display=st==='composition'?'block':'none';recalcSale();}
function updateB2BBadge(){const gstin=document.getElementById('saleCustGST')?.value.trim()||'';const b=document.getElementById('b2bBadge');if(!b)return;if(gstin.length===15){b.className='badge badge-b2b ml-1';b.innerText='B2B';}else{b.className='badge badge-b2c ml-1';b.innerText='B2C';}}
function renderCart(){const tbody=document.getElementById('cartBody');if(!tbody)return;if(!APP.cart.length)APP.cart=[createEmptyCartItem()];tbody.innerHTML=APP.cart.map((it,i)=>`<tr class="border-b"><td class="p-1"><input type="text" value="${esc(it.desc)}" onchange="updateCartItem(${i},'desc',this.value)" class="inp text-xs py-1.5"></td><td class="p-1"><input type="text" value="${esc(it.imei)}" onchange="updateCartItem(${i},'imei',this.value)" class="inp text-xs py-1.5 font-mono"></td><td class="p-1"><input type="text" value="${esc(it.hsn)}" onchange="updateCartItem(${i},'hsn',this.value)" class="inp text-xs py-1.5 font-mono text-center"></td><td class="p-1"><select onchange="updateCartItem(${i},'gstRate',parseInt(this.value))" class="inp text-xs py-1.5"><option value="18" ${it.gstRate==18?'selected':''}>18</option><option value="12" ${it.gstRate==12?'selected':''}>12</option><option value="28" ${it.gstRate==28?'selected':''}>28</option><option value="5" ${it.gstRate==5?'selected':''}>5</option><option value="0" ${it.gstRate==0?'selected':''}>0</option></select></td><td class="p-1"><div class="flex items-center gap-1"><button onclick="changeQty(${i},-1)" class="qty-btn">−</button><span class="text-xs font-bold w-6 text-center">${it.qty}</span><button onclick="changeQty(${i},1)" class="qty-btn">+</button></div></td><td class="p-1"><input type="number" value="${it.price}" onchange="updateCartItem(${i},'price',parseFloat(this.value)||0)" class="inp text-xs py-1.5 font-mono text-right"></td><td class="p-2 text-right font-mono font-bold">${money(it.price*it.qty)}</td><td class="p-1"><button onclick="removeCartRow(${i})" class="text-red-500 text-lg">✕</button></td></tr>`).join('');recalcSale();}
function addCartRow(){APP.cart.push(createEmptyCartItem());renderCart();}
function removeCartRow(i){APP.cart.splice(i,1);if(!APP.cart.length)APP.cart.push(createEmptyCartItem());renderCart();}
function updateCartItem(i,k,v){APP.cart[i][k]=v;if(k==='imei'&&v){const clean=normalizeIMEI(v);const stk=APP.inventory.find(s=>normalizeIMEI(s.imei)===clean&&s.status!=='Sold');if(stk){APP.cart[i].desc=stk.model;APP.cart[i].price=stk.cost;APP.cart[i].purchaseCost=stk.purchaseCost||0;APP.cart[i].stockId=stk.id;APP.cart[i].hsn=stk.hsn||'8517';APP.cart[i].gstRate=stk.gstRate||18;}}renderCart();}
function changeQty(i,d){APP.cart[i].qty=Math.max(1,(APP.cart[i].qty||1)+d);renderCart();}
function clearCart(){if(!confirm('Clear?'))return;APP.cart=[createEmptyCartItem()];renderCart();}
function recalcSale(){const saleType=document.getElementById('saleType')?.value||'regular';let subtotal=0,cgst=0,sgst=0,igst=0;APP.cart.forEach(it=>{const line=it.price*it.qty;if(saleType==='nongst'){subtotal+=line;return;}const rate=saleType==='composition'?(APP.gstConfig.compositionRate||1):(it.gstRate||18);const taxable=line/(1+rate/100);const tax=line-taxable;subtotal+=taxable;const gstType=document.getElementById('saleGSTType')?.value||'INTRA';if(gstType==='INTRA'){cgst+=tax/2;sgst+=tax/2;}else igst+=tax;});const gross=APP.cart.reduce((s,it)=>s+it.price*it.qty,0);const discount=parseFloat(document.getElementById('saleDiscount')?.value)||0;const final=Math.max(0,gross-discount);const setIf=(id,val)=>{const el=document.getElementById(id);if(el)el.innerText=val;};setIf('saleSub',money(subtotal));setIf('saleDisc',money(discount));setIf('saleCGST',money(cgst));setIf('saleSGST',money(sgst));setIf('saleGrand',money(final));setIf('saleTotal',money(final));setIf('saleTotalWords',numberToWords(final));const taxRow=document.getElementById('saleTaxRow');if(taxRow)taxRow.style.display=saleType==='nongst'?'none':'block';}
function finalizeSale(){const items=APP.cart.filter(it=>it.desc&&it.price>0);if(!items.length){toast('Add items','error');return;}const invNo=document.querySelector('.font-mono.font-bold.text-sky-700')?.innerText||nextInvoiceNo();const date=document.getElementById('saleDate').value;const custName=document.getElementById('saleCustName').value.trim()||'Cash Customer';const custPhone=document.getElementById('saleCustPhone').value.trim();const custGST=document.getElementById('saleCustGST').value.trim().toUpperCase();const ledger=document.getElementById('salePayment').value;const gstNature=document.getElementById('saleGSTType').value;const discount=parseFloat(document.getElementById('saleDiscount').value)||0;const saleType=document.getElementById('saleType').value;const placeOfSupply=document.getElementById('salePlaceOfSupply').value.trim()||APP.gstConfig.stateName;const b2b=custGST.length===15;let tG=0,tT=0,tC=0,tS=0,tI=0,tPC=0;items.forEach(it=>{const lt=it.price*it.qty;tG+=lt;tPC+=(it.purchaseCost||0)*it.qty;if(saleType==='nongst'){tT+=lt;return;}const rate=saleType==='composition'?(APP.gstConfig.compositionRate||1):(it.gstRate||18);const taxable=lt/(1+rate/100);const tax=lt-taxable;tT+=taxable;if(gstNature==='INTRA'){tC+=tax/2;tS+=tax/2;}else tI+=tax;});const final=Math.max(0,tG-discount);const factor=tG>0?final/tG:1;tT*=factor;tC*=factor;tS*=factor;tI*=factor;const inv={id:uid('inv'),invoiceNo:invNo,date,customerName:custName,customerPhone:custPhone,customerGSTIN:custGST,saleType,b2b,placeOfSupply,gstNature,ledger,discount,items:JSON.parse(JSON.stringify(items)),totalTaxable:+tT.toFixed(2),totalCGST:+tC.toFixed(2),totalSGST:+tS.toFixed(2),totalIGST:+tI.toFixed(2),totalGross:+final.toFixed(2),totalPurchaseCost:+tPC.toFixed(2),financialYear:getFY(new Date(date)).label,timestamp:new Date().toISOString()};items.forEach(it=>{if(it.stockId){const stk=APP.inventory.find(s=>s.id===it.stockId);if(stk){stk.status='Sold';stk.soldInvoice=invNo;stk.soldDate=date;}}else if(it.imei){const stk=APP.inventory.find(s=>normalizeIMEI(s.imei)===normalizeIMEI(it.imei));if(stk){stk.status='Sold';stk.soldInvoice=invNo;stk.soldDate=date;}}});lsSet('stock',APP.inventory);APP.invoices.unshift(inv);lsSet('invoices',APP.invoices);autoRegisterWarranty(inv);logAudit('SALE',`${invNo} | ${custName} | ₹${final.toFixed(2)} | ${saleType}`);if(ledger==='Credit / Sundry Debtors'&&custName!=='Cash Customer'){let p=APP.customers.find(c=>(c.name||'').toLowerCase()===custName.toLowerCase());if(!p){APP.customers.push({id:uid('cust'),name:custName,phone:custPhone,gstin:custGST,opening:0});lsSet('customers',APP.customers);}}toast(`Invoice ${invNo} saved!`,'success');APP.cart=[createEmptyCartItem()];checkNotifications();setTimeout(()=>printInvoice(inv),300);setTimeout(()=>navigateTo('sales'),500);}

etSearchQuery').value='';APP.activeReturnInvoice=null;renderCreditNotesTable();}

function renderCashBook(){const entries=getAccountEntries('Cash-in-Hand');let inTot=0,outTot=0,bal=0;const t=document.getElementById('cashBookBody');if(!t)return;if(!entries.length)t.innerHTML='<tr><td colspan="6" class="text-center py-6 text-slate-400 text-xs">No cash transactions</td></tr>';else t.innerHTML=entries.map(e=>{inTot+=e.dr;outTot+=e.cr;bal+=(e.dr-e.cr);return '<tr class="hover:bg-slate-50"><td class="p-2.5 font-mono text-slate-600">'+e.date+'</td><td class="p-2.5">'+esc(e.desc)+'</td><td class="p-2.5 font-mono text-[10px] text-slate-500">'+e.ref+'</td><td class="p-2.5 text-right font-mono text-emerald-700">'+(e.dr?'₹'+e.dr.toFixed(2):'-')+'</td><td class="p-2.5 text-right font-mono text-rose-700">'+(e.cr?'₹'+e.cr.toFixed(2):'-')+'</td><td class="p-2.5 text-right font-mono font-bold">₹'+bal.toFixed(2)+'</td></tr>';}).join('');const a=document.getElementById('cashTotalIn');if(a)a.innerText='₹'+inTot.toFixed(2);const b=document.getElementById('cashTotalOut');if(b)b.innerText='₹'+outTot.toFixed(2);const c=document.getElementById('cashBalance');if(c)c.innerText='₹'+bal.toFixed(2);}
function renderBankBook(){const entries=getAccountEntries('Bank / UPI');let inTot=0,outTot=0,bal=0;const t=document.getElementById('bankBookBody');if(!t)return;if(!entries.length)t.innerHTML='<tr><td colspan="6" class="text-center py-6 text-slate-400 text-xs">No bank transactions</td></tr>';else t.innerHTML=entries.map(e=>{inTot+=e.dr;outTot+=e.cr;bal+=(e.dr-e.cr);return '<tr class="hover:bg-slate-50"><td class="p-2.5 font-mono text-slate-600">'+e.date+'</td><td class="p-2.5">'+esc(e.desc)+'</td><td class="p-2.5 font-mono text-[10px] text-slate-500">'+e.ref+'</td><td class="p-2.5 text-right font-mono text-emerald-700">'+(e.dr?'₹'+e.dr.toFixed(2):'-')+'</td><td class="p-2.5 text-right font-mono text-rose-700">'+(e.cr?'₹'+e.cr.toFixed(2):'-')+'</td><td class="p-2.5 text-right font-mono font-bold">₹'+bal.toFixed(2)+'</td></tr>';}).join('');const a=document.getElementById('bankTotalIn');if(a)a.innerText='₹'+inTot.toFixed(2);const b=document.getElementById('bankTotalOut');if(b)b.innerText='₹'+outTot.toFixed(2);const c=document.getElementById('bankBalance');if(c)c.innerText='₹'+bal.toFixed(2);}
function renderTrialBalance(){const acc={'Cash-in-Hand':{dr:0,cr:0},'Bank / UPI':{dr:0,cr:0},'Card Payment':{dr:0,cr:0},'Bajaj / EMI Finance':{dr:0,cr:0},'Sundry Debtors':{dr:0,cr:0},'Sundry Creditors':{dr:0,cr:0},'Sales':{dr:0,cr:0},'Sales Return':{dr:0,cr:0},'Purchases':{dr:0,cr:0},'Expenses':{dr:0,cr:0},'GST Output':{dr:0,cr:0},'GST Input':{dr:0,cr:0}};APP.invoices.forEach(inv=>{if(acc[inv.ledger])acc[inv.ledger].dr+=inv.totalGross;else if(inv.ledger==='Credit / Sundry Debtors')acc['Sundry Debtors'].dr+=inv.totalGross;acc['Sales'].cr+=inv.totalTaxable;acc['GST Output'].cr+=(inv.totalCGST||0)+(inv.totalSGST||0)+(inv.totalIGST||0);});APP.creditNotes.forEach(c=>{acc['Sales Return'].dr+=c.refundTaxable;acc['GST Output'].dr+=c.refundTax;acc['Cash-in-Hand'].cr+=c.refundTotal;});APP.purchases.forEach(p=>{acc['Purchases'].dr+=p.totalTaxable;acc['GST Input'].dr+=p.totalTax;if(p.ledger==='Cash-in-Hand')acc['Cash-in-Hand'].cr+=p.totalCost;else if(p.ledger==='Bank / UPI')acc['Bank / UPI'].cr+=p.totalCost;else acc['Sundry Creditors'].cr+=p.totalCost;});APP.vouchers.forEach(v=>{if(v.type==='EXPENSE'){acc['Expenses'].dr+=v.amount;if(v.account==='Cash-in-Hand')acc['Cash-in-Hand'].cr+=v.amount;else if(v.account==='Bank / UPI')acc['Bank / UPI'].cr+=v.amount;}else if(v.type==='RECEIPT'){if(v.account==='Cash-in-Hand')acc['Cash-in-Hand'].dr+=v.amount;else if(v.account==='Bank / UPI')acc['Bank / UPI'].dr+=v.amount;acc['Sundry Debtors'].cr+=v.amount;}else if(v.type==='CONTRA'){if(v.fromAccount==='Cash-in-Hand')acc['Cash-in-Hand'].cr+=v.amount;else if(v.fromAccount==='Bank / UPI')acc['Bank / UPI'].cr+=v.amount;if(v.toAccount==='Cash-in-Hand')acc['Cash-in-Hand'].dr+=v.amount;else if(v.toAccount==='Bank / UPI')acc['Bank / UPI'].dr+=v.amount;}});const t=document.getElementById('trialBalanceBody');if(!t)return;let totDr=0,totCr=0;t.innerHTML=Object.keys(acc).map(k=>{const a=acc[k];const net=a.dr-a.cr;if(net===0&&a.dr===0&&a.cr===0)return '';let dr=0,cr=0;if(net>0)dr=net;else if(net<0)cr=-net;totDr+=dr;totCr+=cr;if(dr===0&&cr===0)return '';return '<tr class="hover:bg-slate-50"><td class="p-3 font-semibold">'+k+'</td><td class="p-3 text-right font-mono">'+(dr?'₹'+dr.toFixed(2):'-')+'</td><td class="p-3 text-right font-mono">'+(cr?'₹'+cr.toFixed(2):'-')+'</td></tr>';}).join('');const a=document.getElementById('tbTotalDr');if(a)a.innerText='₹'+totDr.toFixed(2);const b=document.getElementById('tbTotalCr');if(b)b.innerText='₹'+totCr.toFixed(2);}
function renderGSTSummary(){let oTax=0,oC=0,oS=0,oI=0;APP.invoices.forEach(inv=>{oTax+=inv.totalTaxable||0;oC+=inv.totalCGST||0;oS+=inv.totalSGST||0;oI+=inv.totalIGST||0;});let rTax=0,rGST=0;APP.creditNotes.forEach(c=>{rTax+=c.refundTaxable;rGST+=c.refundTax;});let iTax=0,iGST=0;APP.purchases.forEach(p=>{iTax+=p.totalTaxable||0;iGST+=p.totalTax||0;});const set=(id,v)=>{const e=document.getElementById(id);if(e)e.innerText='₹'+v.toFixed(2);};set('gstOutTaxable',oTax-rTax);set('gstOutCGST',oC);set('gstOutSGST',oS);set('gstOutIGST',oI);const outTot=(oC+oS+oI)-rGST;set('gstOutTotal',outTot);set('gstInTaxable',iTax);set('gstInTotal',iGST);set('gstNetPayable',outTot-iGST);}

</div>

VIEW_AFTER.purchase=()=>{renderPurchaseRows();};
function onPurchaseTypeChange(){const type=document.getElementById('purType')?.value||'regular';const itcBox=document.getElementById('purITC');if(itcBox)itcBox.parentElement.parentElement.style.display=type==='nongst'?'none':'block';}
function createPurchaseRow(){return{id:uid('pl'),category:APP.categories[0]||'Mobile Phone',model:'',imei:'',qty:1,cost:0,sell:0,gstRate:18};}
function addPurchaseRow(){APP.purchaseLines.push(createPurchaseRow());renderPurchaseRows();}
function removePurchaseRow(i){APP.purchaseLines.splice(i,1);renderPurchaseRows();}
function renderPurchaseRows(){const tbody=document.getElementById('purBody');if(!tbody)return;if(!APP.purchaseLines.length){tbody.innerHTML='<tr><td colspan="8" class="p-4 text-center text-slate-400 text-xs">+ Add Row</td></tr>';return;}tbody.innerHTML=APP.purchaseLines.map((it,i)=>`<tr class="border-b"><td class="p-1"><select onchange="upPurchase(${i},'category',this.value)" class="inp text-xs py-1.5">${APP.categories.map(c=>`<option ${c===it.category?'selected':''}>${esc(c)}</option>`).join('')}</select></td><td class="p-1"><input value="${esc(it.model)}" onchange="upPurchase(${i},'model',this.value)" class="inp text-xs py-1.5"></td><td class="p-1"><input value="${esc(it.imei)}" onchange="upPurchase(${i},'imei',this.value)" class="inp text-xs py-1.5 font-mono"></td><td class="p-1"><input type="number" value="${it.cost}" onchange="upPurchase(${i},'cost',parseFloat(this.value)||0)" class="inp text-xs py-1.5 font-mono text-right"></td><td class="p-1"><input type="number" value="${it.sell}" onchange="upPurchase(${i},'sell',parseFloat(this.value)||0)" class="inp text-xs py-1.5 font-mono text-right text-emerald-700"></td><td class="p-1"><select onchange="upPurchase(${i},'gstRate',parseInt(this.value))" class="inp text-xs py-1.5"><option ${it.gstRate==18?'selected':''}>18</option><option ${it.gstRate==12?'selected':''}>12</option><option ${it.gstRate==28?'selected':''}>28</option><option ${it.gstRate==5?'selected':''}>5</option><option ${it.gstRate==0?'selected':''}>0</option></select></td><td class="p-2 text-right font-mono font-bold">${money(it.cost*it.qty)}</td><td class="p-1"><button onclick="removePurchaseRow(${i})" class="text-red-500 text-lg">✕</button></td></tr>`).join('');recalcPurchase();}
function recalcPurchase(){const purType=document.getElementById('purType')?.value||'regular';let taxable=0,tax=0,total=0;APP.purchaseLines.forEach(it=>{const lt=it.cost*it.qty;total+=lt;if(purType==='nongst'){taxable+=lt;return;}const tx=lt/(1+(it.gstRate||18)/100);taxable+=tx;tax+=(lt-tx);});const e1=document.getElementById('purTotal');if(e1)e1.innerText=money(total);const e2=document.getElementById('purTotalWords');if(e2)e2.innerText=numberToWords(total);const e3=document.getElementById('purTaxable');if(e3)e3.innerText=money(taxable);const e4=document.getElementById('purTax');if(e4)e4.innerText=money(tax);}
function upPurchase(i,k,v){APP.purchaseLines[i][k]=v;renderPurchaseRows();}
function clearPurchase(){if(!confirm('Clear?'))return;APP.purchaseLines=[];renderPurchaseRows();}
function finalizePurchase(){const lines=APP.purchaseLines.filter(l=>l.model&&l.cost>0);if(!lines.length){toast('Add items','error');return;}const supplier=document.getElementById('purSupplier').value.trim();if(!supplier){toast('Supplier required','error');return;}const billNo=document.getElementById('purBillNo').value.trim();const date=document.getElementById('purDate').value;const phone=document.getElementById('purPhone').value.trim();const supplierGSTIN=document.getElementById('purSupplierGST').value.trim();const ledger=document.getElementById('purLedger').value;const purType=document.getElementById('purType').value;const gstType=document.getElementById('purGSTType').value;const itcClaimed=document.getElementById('purITC').checked&&purType==='regular';const purNo=nextPurchaseNo(new Date(date));let totalCost=0,totalTaxable=0,totalTax=0;lines.forEach(l=>{const lt=l.cost*l.qty;totalCost+=lt;if(purType==='nongst'){totalTaxable+=lt;return;}const tx=lt/(1+(l.gstRate||18)/100);totalTaxable+=tx;if(itcClaimed)totalTax+=(lt-tx);});lines.forEach(l=>{APP.inventory.push({id:uid('stk'),model:l.model,imei:l.imei||'',category:l.category,purchaseCost:l.cost,cost:l.sell||l.cost*1.15,gstRate:l.gstRate,status:'Available',supplier,purchaseBillNo:billNo||purNo,isOldStock:false,addedDate:date,hsn:'8517'});});lsSet('stock',APP.inventory);let sup=APP.suppliers.find(s=>(s.name||'').toLowerCase()===supplier.toLowerCase());if(!sup){sup={id:uid('sup'),name:supplier,phone,gstin:supplierGSTIN,opening:0};APP.suppliers.push(sup);lsSet('suppliers',APP.suppliers);}APP.purchases.unshift({id:uid('pur'),purchaseNo:purNo,billNo:billNo||purNo,date,supplierId:sup.id,supplierName:supplier,supplierPhone:phone,supplierGSTIN,ledger,purchaseType:purType,gstType,itcClaimed,lines:JSON.parse(JSON.stringify(lines)),totalTaxable:+totalTaxable.toFixed(2),totalTax:+totalTax.toFixed(2),totalCost:+totalCost.toFixed(2),timestamp:new Date().toISOString()});lsSet('purchases',APP.purchases);logAudit('PURCHASE',`${purNo} | ${supplier} | ₹${totalCost.toFixed(2)} | ITC: ${itcClaimed?'Y':'N'}`);toast('Saved! Stock added.','success');APP.purchaseLines=[];checkNotifications();setTimeout(()=>navigateTo('purchase'),400);}

/* DEALER PAY */
function getSupplierStats(supId){const sup=APP.suppliers.find(s=>s.id===supId);if(!sup)return{purchases:0,paid:0,due:0};const purchases=APP.purchases.filter(p=>p.supplierId===supId&&p.ledger==='Credit / Sundry Creditors').reduce((s,p)=>s+p.totalCost,0)+(sup.opening||0);const paid=APP.supplierPayments.filter(sp=>sp.supplierId===supId).reduce((s,sp)=>s+sp.amount,0);return{purchases,paid,due:purchases-paid};}

</div>

function quickPaySupplier(supId){const sel=document.getElementById('dpSupplier');if(sel)sel.value=supId;const st=getSupplierStats(supId);const a=document.getElementById('dpAmount');if(a)a.value=st.due.toFixed(0);}

VIEW_RENDERERS.emi=()=>{const active=APP.emis.filter(e=>e.status==='active');const completed=APP.emis.filter(e=>e.status==='completed');const totalLoan=APP.emis.reduce((s,e)=>s+(e.loanAmount||0),0);const totalRecv=APP.emis.reduce((s,e)=>s+((e.providerPayments||[]).reduce((x,p)=>x+p.amount,0)),0);const cards=(APP.activeEmiTab==='completed'?completed:active).map(e=>{const provider=APP.emiProviders.find(p=>p.id===e.providerId);const recv=(e.providerPayments||[]).reduce((s,p)=>s+p.amount,0);const due=e.loanAmount-recv;return `<div class="card"><div class="flex items-start justify-between gap-3 mb-2"><div><div class="font-mono font-bold text-sky-700 text-xs">${e.emiNo}</div><div class="font-bold text-slate-900 mt-1">${esc(e.customerName)}</div><div class="text-xs text-slate-600">${esc(e.customerPhone)} · ${esc(e.deviceModel)}</div></div><span class="badge ${e.status==='active'?'badge-received':'badge-delivered'}">${e.status}</span></div><div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 rounded-lg p-2"><div>Provider: <strong>${esc(provider?provider.name:'-')}</strong></div><div>Down: <strong>${money(e.downPayment||0)}</strong></div><div>Loan: <strong>${money(e.loanAmount)}</strong></div><div>Tenure: <strong>${e.tenure}m</strong></div><div>EMI: <strong>${money(e.monthlyEmi)}</strong></div><div>Rate: <strong>${e.interestRate||0}%</strong></div></div><div class="mt-3 pt-3 border-t"><div class="flex justify-between text-xs mb-1"><span>Received:</span><strong class="text-emerald-600">${money(recv)}</strong></div><div class="flex justify-between text-xs"><span>Pending:</span><strong class="text-rose-600">${money(due)}</strong></div></div><div class="flex gap-2 mt-3 pt-3 border-t flex-wrap"><button onclick="recordEmiPayment('${e.id}')" class="btn-icon" style="background:#d1fae5;color:#065f46">💰 Record</button><button onclick="deleteEmi('${e.id}')" class="btn-icon" style="background:#fee2e2;color:#991b1b">🗑</button></div></div>`;}).join('');return `
<div class="p-4 lg:p-6 space-y-4">
<div class="grid grid-cols-3 gap-3"><div class="card"><div class="text-[10px] font-bold text-slate-500 uppercase">Total Loan</div><div class="text-xl font-black mt-1">${moneyInt(totalLoan)}</div></div><div class="card"><div class="text-[10px] font-bold text-slate-500 uppercase">Received</div><div class="text-xl font-black text-emerald-700 mt-1">${moneyInt(totalRecv)}</div></div><div class="card"><div class="text-[10px] font-bold text-slate-500 uppercase">Pending</div><div class="text-xl font-black text-rose-700 mt-1">${moneyInt(totalLoan-totalRecv)}</div></div></div>
<div class="flex flex-wrap items-center justify-between gap-3"><div class="flex flex-wrap gap-2"><div class="tab-pill ${APP.activeEmiTab==='plans'?'active':''}" onclick="APP.activeEmiTab='plans';renderView('emi')">Active (${active.length})</div><div class="tab-pill ${APP.activeEmiTab==='completed'?'active':''}" onclick="APP.activeEmiTab='completed';renderView('emi')">Completed (${completed.length})</div></div><button onclick="openNewEmiModal()" class="btn-primary">+ New EMI</button></div>
<div class="space-y-3">${cards||'<div class="card text-center py-12"><div class="text-5xl mb-3">💳</div><div>No EMI plans</div></div>'}</div>
</div>`;};
function openNewEmiModal(){const html=`<div class="modal-overlay" id="emiModal" onclick="if(event.target===this)closeModal('emiModal')"><div class="modal-box" onclick="event.stopPropagation()"><div class="bg-gradient-to-r from-sky-500 to-blue-700 p-4 flex justify-between items-center"><div><div class="text-white font-bold">New EMI</div><div class="text-sky-100 text-xs font-mono mt-0.5">${nextEmiNo()}</div></div><button onclick="closeModal('emiModal')" class="text-white text-xl">✕</button></div><div class="modal-body space-y-3"><div><label class="inp-lbl">Provider</label><select id="emiProvider" class="inp">${APP.emiProviders.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="grid grid-cols-2 gap-3"><div><label class="inp-lbl">Customer</label><input type="text" id="emiCustName" class="inp"></div><div><label class="inp-lbl">Phone</label><input type="tel" id="emiCustPhone" class="inp font-mono" maxlength="10"></div></div><div><label class="inp-lbl">Device</label><input type="text" id="emiDevice" class="inp"></div><div class="grid grid-cols-3 gap-3"><div><label class="inp-lbl">Down ₹</label><input type="number" id="emiDown" class="inp font-mono" value="0"></div><div><label class="inp-lbl">Loan ₹</label><input type="number" id="emiLoan" class="inp font-mono"></div><div><label class="inp-lbl">Tenure</label><select id="emiTenure" class="inp"><option>3</option><option>6</option><option selected>9</option><option>12</option></select></div></div><div class="grid grid-cols-3 gap-3"><div><label class="inp-lbl">Rate %</label><input type="number" id="emiRate" class="inp font-mono" value="0"></div><div><label class="inp-lbl">EMI ₹</label><input type="number" id="emiMonthly" class="inp font-mono"></div><div><label class="inp-lbl">Start</label><input type="date" id="emiStart" class="inp"></div></div><div class="flex gap-2 pt-2"><button onclick="closeModal('emiModal')" class="btn-secondary flex-1">Cancel</button><button onclick="saveEmiPlan()" class="btn-primary flex-1">Create</button></div></div></div></div>`;document.body.insertAdjacentHTML('beforeend',html);document.getElementById('emiStart').value=fmtDate(new Date());const calc=()=>{const loan=parseFloat(document.getElementById('emiLoan').value)||0;const t=parseInt(document.getElementById('emiTenure').value)||9;const r=parseFloat(document.getElementById('emiRate').value)||0;document.getElementById('emiMonthly').value=((loan*(1+r/100))/t).toFixed(0);};['emiLoan','emiTenure','emiRate'].forEach(id=>document.getElementById(id).addEventListener('input',calc));}
function saveEmiPlan(){const providerId=document.getElementById('emiProvider').value;const customerName=document.getElementById('emiCustName').value.trim();const customerPhone=document.getElementById('emiCustPhone').value.trim();const deviceModel=document.getElementById('emiDevice').value.trim();const downPayment=parseFloat(document.getElementById('emiDown').value)||0;const loanAmount=parseFloat(document.getElementById('emiLoan').value)||0;const tenure=parseInt(document.getElementById('emiTenure').value)||9;const interestRate=parseFloat(document.getElementById('emiRate').value)||0;const monthlyEmi=parseFloat(document.getElementById('emiMonthly').value)||0;const startDate=document.getElementById('emiStart').value;if(!customerName||!customerPhone||!loanAmount){toast('Fill required','error');return;}APP.emis.unshift({id:uid('emi'),emiNo:nextEmiNo(),providerId,customerName,customerPhone,deviceModel,downPayment,loanAmount,tenure,interestRate,monthlyEmi,startDate:startDate||fmtDate(new Date()),status:'active',providerPayments:[],createdAt:new Date().toISOString()});lsSet('emis',APP.emis);closeModal('emiModal');toast('Created','success');renderView('emi');}
function recordEmiPayment(emiId){const e=APP.emis.find(x=>x.id===emiId);if(!e)return;const recv=(e.providerPayments||[]).reduce((s,p)=>s+p.amount,0);const amt=prompt(`Pending: ${money(e.loanAmount-recv)}\n\nReceived ₹:`,(e.loanAmount-recv).toFixed(0));if(!amt)return;const amount=parseFloat(amt);if(!amount)return;const ref=prompt('Ref:')||'';e.providerPayments=e.providerPayments||[];e.providerPayments.push({date:fmtDate(new Date()),amount,ref,ts:new Date().toISOString()});if(recv+amount>=e.loanAmount)e.status='completed';lsSet('emis',APP.emis);toast(`Recorded ${money(amount)}`,'success');renderView('emi');}
function deleteEmi(emiId){const pin=prompt('PIN:');if(pin!==(APP.shopProfile.masterPin||'1234')){toast('Wrong','error');return;}if(!confirm('Delete?'))return;APP.emis=APP.emis.filter(x=>x.id!==emiId);lsSet('emis',APP.emis);toast('Deleted','success');renderView('emi');}
