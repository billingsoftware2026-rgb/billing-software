<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SmartFix ERP</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%230ea5e9'/%3E%3Ctext x='256' y='340' font-size='260' text-anchor='middle' fill='white'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SmartFix ERP">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
*{-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{background:#0f172a;font-family:'Inter',system-ui,-apple-system,sans-serif}
.app-shell{display:flex;height:100dvh;overflow:hidden}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-up{animation:fadeSlideUp .5s cubic-bezier(.16,1,.3,1) both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.float-anim{animation:float 3s ease-in-out infinite}
.sidebar{width:240px;background:#0f172a;border-right:1px solid #1e293b;transition:transform .3s}
@media(max-width:1023px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 16px;margin:2px 8px;border-radius:10px;color:#94a3b8;font-weight:500;font-size:14px;cursor:pointer;transition:.15s;user-select:none}
.nav-item:hover{background:#1e293b;color:#f1f5f9}
.nav-item.active{background:linear-gradient(135deg,#0ea5e9,#0369a1);color:white;box-shadow:0 4px 16px rgba(14,165,233,.35)}
.nav-item .icon{font-size:18px;width:22px;text-align:center}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:1px solid #1e293b;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0));z-index:55}
@media(max-width:1023px){.bottom-nav{display:flex}}
.bottom-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 4px;color:#64748b;font-size:10px;font-weight:600;cursor:pointer;border-radius:8px;transition:.15s}
.bottom-item.active{color:#38bdf8}
.bottom-item .bi-icon{font-size:20px;margin-bottom:2px}
.main-content{flex:1;overflow-y:auto;background:#f8fafc;padding-bottom:80px}
@media(min-width:1024px){.main-content{padding-bottom:0}}
.topbar{background:#0f172a;border-bottom:1px solid #1e293b;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.card{background:#fff;border-radius:14px;padding:16px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.inp{width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:9px 12px;font-size:13px;background:#fff;color:#0f172a;transition:.15s;outline:none}
.inp:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.12)}
.inp-lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#64748b;margin-bottom:4px}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;border:none;cursor:pointer;font-size:13px;transition:.15s;box-shadow:0 4px 12px rgba(14,165,233,.3)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{background:#1e293b;color:#e2e8f0;font-weight:600;padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-size:13px}
.btn-secondary:hover{background:#334155}
.btn-success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;border:none;cursor:pointer;font-size:13px;box-shadow:0 4px 12px rgba(34,197,94,.3)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-weight:700;padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-size:13px}
.btn-icon{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}
.btn-icon:hover{background:#e2e8f0}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em}
.badge-received{background:#fef3c7;color:#92400e}
.badge-diagnosing{background:#dbeafe;color:#1e40af}
.badge-repairing{background:#e0e7ff;color:#3730a3}
.badge-ready{background:#d1fae5;color:#065f46}
.badge-delivered{background:#f1f5f9;color:#475569}
.badge-cancelled{background:#fee2e2;color:#991b1b}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:.3s cubic-bezier(.16,1,.3,1);z-index:9999;pointer-events:none;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:linear-gradient(135deg,#22c55e,#16a34a)}
.toast.error{background:linear-gradient(135deg,#ef4444,#dc2626)}
.toast.warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,.5);display:flex;flex-direction:column}
.modal-body{overflow-y:auto;padding:20px}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stat-card{padding:14px;border-radius:12px;color:#fff}
.tab-pill{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;background:#f1f5f9;color:#64748b;display:inline-block}
.tab-pill.active{background:#0ea5e9;color:#fff}
#printRoot{display:none}
@media print{body>*:not(#printRoot){display:none!important}#printRoot{display:block!important}@page{margin:5mm}.no-print{display:none!important}}
.thermal-receipt{width:76mm;font-family:'Courier New',monospace;font-size:11px;line-height:1.35;color:#000;padding:2mm;margin:0 auto}
.thermal-receipt .center{text-align:center}
.thermal-receipt .right{text-align:right}
.thermal-receipt .bold{font-weight:700}
.thermal-receipt .big{font-size:14px}
.thermal-receipt .hr{border-top:1px dashed #000;margin:4px 0}
.thermal-receipt table{width:100%;border-collapse:collapse}
.thermal-receipt td{padding:1px 0;font-size:10px}
.qty-btn{width:26px;height:26px;border-radius:6px;background:#e2e8f0;border:none;font-weight:700;cursor:pointer;font-size:14px}
.qty-btn:hover{background:#cbd5e1}
.data-table{width:100%;font-size:12px;border-collapse:collapse}
.data-table thead{background:#f1f5f9;color:#64748b;font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:.03em}
.data-table th{padding:9px 12px;text-align:left}
.data-table th.text-right{text-align:right}
.data-table th.text-center{text-align:center}
.data-table td{padding:9px 12px;border-top:1px solid #f1f5f9}
.data-table tbody tr:hover{background:#f8fafc}
</style>
</head>
<body>

<div id="printRoot"></div>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen" class="min-h-screen w-full flex items-center justify-center p-4 relative overflow-hidden" style="background:radial-gradient(ellipse at top,#1e3a8a 0%,#0f172a 45%,#020617 100%);">
  <div class="absolute w-[400px] h-[400px] rounded-full blur-[100px] opacity-30" style="background:#0ea5e9;top:-100px;left:-100px"></div>
  <div class="absolute w-[300px] h-[300px] rounded-full blur-[100px] opacity-20" style="background:#8b5cf6;bottom:-80px;right:-80px"></div>
  <div class="relative w-full max-w-md animate-fade-up">
    <div class="text-center mb-8">
      <div class="inline-flex w-20 h-20 bg-gradient-to-br from-sky-400 to-blue-700 rounded-[22px] items-center justify-center text-white text-4xl shadow-2xl shadow-sky-500/40 float-anim mb-4">🔧</div>
      <h1 class="text-3xl font-black tracking-tight text-white">SmartFix <span class="text-sky-400">ERP</span></h1>
      <p class="text-slate-400 text-xs mt-1.5 font-medium">Tally-Grade Mobile Shop Management</p>
      <p class="text-[10px] text-slate-500 mt-1">v4.0 · Offline · Multi-User · WiFi Sync</p>
    </div>
    <div class="bg-white/[0.07] backdrop-blur-2xl border border-white/10 rounded-3xl p-6 shadow-2xl">
      <div class="flex bg-black/20 rounded-xl p-1 mb-5">
        <button type="button" onclick="switchLoginMode('shop')" id="loginTab-shop" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow">🏪 Shop Login</button>
        <button type="button" onclick="switchLoginMode('customer')" id="loginTab-customer" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-400">👤 Customer</button>
      </div>
      <form id="shopLoginForm" onsubmit="doShopLogin(event)" class="space-y-4">
        <div><label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">User ID / Mobile</label>
          <input type="text" id="loginUser" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-sky-400 focus:bg-white/10" placeholder="Enter User ID" required></div>
        <div><label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
          <input type="password" id="loginPass" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-sky-400 focus:bg-white/10" placeholder="Enter Password" required></div>
        <div class="flex justify-between items-center text-xs">
          <label class="flex items-center gap-2 text-slate-400 cursor-pointer"><input type="checkbox" id="rememberMe" class="rounded"><span>Remember me</span></label>
          <a href="javascript:void(0)" onclick="showForgotPassword()" class="text-sky-400 hover:text-sky-300 font-semibold">Forgot?</a>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-sky-500/30 active:scale-[.98]">Sign In →</button>
      </form>
      <form id="customerLoginForm" onsubmit="doCustomerLogin(event)" class="space-y-4" style="display:none">
        <div><label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Mobile Number</label>
          <input type="tel" id="custLoginPhone" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-400 font-mono" placeholder="10-digit mobile" maxlength="10" required></div>
        <div><label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">IMEI Last 6 Digits</label>
          <input type="text" id="custLoginIMEI6" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-400 font-mono tracking-widest" placeholder="123456" maxlength="6">
          <p class="text-[10px] text-slate-500 mt-1.5">Check invoice or phone box</p></div>
        <div><label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Or Invoice Number</label>
          <input type="text" id="custLoginInv" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-400 font-mono" placeholder="SFP-202627-0001">
          <p class="text-[10px] text-slate-500 mt-1.5">Either works</p></div>
        <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-500/30 active:scale-[.98]">View My Devices →</button>
      </form>
      <div id="firstTimeSetupBox" class="mt-5 pt-5 border-t border-white/10 text-center" style="display:none">
        <p class="text-xs text-slate-400 mb-3">First time? Set up your shop now.</p>
        <button type="button" onclick="startShopSetup()" class="text-xs bg-white/10 hover:bg-white/20 text-white font-bold px-5 py-2.5 rounded-lg transition">✨ Setup New Shop</button>
      </div>
    </div>
    <div class="text-center mt-6 text-[10px] text-slate-500">
      <div>SmartFix ERP © 2026 · Dev: Debapriya Sarkar</div>
      <div class="flex items-center justify-center gap-2 mt-2"><span class="sync-dot bg-emerald-500"></span><span id="loginSyncStatus">Offline Ready</span></div>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell" class="app-shell" style="display:none">
  <aside id="sidebar" class="sidebar flex flex-col">
    <div class="p-4 border-b border-slate-800 flex items-center gap-3">
      <div class="w-9 h-9 bg-gradient-to-br from-sky-400 to-blue-600 rounded-xl flex items-center justify-center text-white text-lg shadow-lg shadow-sky-500/30">🔧</div>
      <div class="min-w-0 flex-1"><div class="text-white font-black text-sm tracking-tight">SmartFix ERP</div><div class="text-[10px] text-slate-500 truncate" id="sidebarShopName">Shop</div></div>
    </div>
    <nav id="sidebarNav" class="flex-1 overflow-y-auto py-2"></nav>
    <div class="p-3 border-t border-slate-800">
      <div class="flex items-center gap-2 p-2 rounded-lg bg-slate-800/50">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-sky-500 to-blue-700 flex items-center justify-center text-white text-xs font-bold" id="userAvatar">U</div>
        <div class="flex-1 min-w-0"><div class="text-xs font-bold text-white truncate" id="userNameDisplay">User</div><div class="text-[10px] text-slate-500 capitalize" id="userRoleDisplay">Owner</div></div>
        <button type="button" onclick="doLogout()" class="text-slate-500 hover:text-red-400 p-1.5 rounded" title="Logout">⎋</button>
      </div>
    </div>
  </aside>
  <div id="sidebarOverlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/60 z-[58] hidden"></div>
  <div class="flex-1 flex flex-col min-w-0">
    <div class="topbar">
      <div class="flex items-center gap-3">
        <button type="button" onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1.5">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div><div class="text-white font-bold text-base" id="pageTitle">Dashboard</div><div class="text-[10px] text-slate-500" id="pageSubtitle">Welcome</div></div>
      </div>
      <div class="flex items-center gap-2">
        <div id="syncIndicator" class="hidden sm:flex items-center gap-1.5 text-[10px] bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full">
          <span class="sync-dot bg-emerald-500"></span><span class="text-emerald-400 font-semibold" id="syncStatusText">Synced</span>
        </div>
        <button type="button" onclick="quickBackup()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">💾</button>
        <button type="button" onclick="openNotifications()" class="relative bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm p-2 rounded-lg">
          🔔<span id="notifBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center" style="display:none">0</span>
        </button>
      </div>
    </div>
    <main id="mainContent" class="main-content flex-1"></main>
  </div>
  <nav id="bottomNav" class="bottom-nav"></nav>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   STATE
   ============================================================ */
const APP = {
  version: '4.0.0',
  user: null,
  shopProfile: {},
  users: [],
  invoices: [],
  purchases: [],
  supplierPayments: [],
  creditNotes: [],
  vouchers: [],
  inventory: [],
  serviceJobs: [],
  warranties: [],
  emis: [],
  emiProviders: [],
  staff: [],
  salaryPayments: [],
  categories: [],
  auditLog: [],
  settings: {
    printSize: 'a4',
    barcodeEnabled: false,
    autoBackup: true,
    wifiSyncEnabled: true,
    defaultBrandWarranty: 12,
    defaultShopWarranty: 6
  },
  currentView: null,
  activeServiceTab: 'all',
  activeWarrantyTab: 'active',
  activeEmiTab: 'plans',
  activeStockTab: 'all',
  cart: [],
  purchaseLines: []
};

/* ============================================================
   STORAGE & SYNC
   ============================================================ */
const LSP = 'sfp_';
function lsGet(k, def) { try { const v = localStorage.getItem(LSP+k); return v ? JSON.parse(v) : def; } catch(e) { return def; } }
function lsSet(k, v) {
  try { localStorage.setItem(LSP+k, JSON.stringify(v)); broadcastSync(k); return true; }
  catch(e) { toast('Storage full! Backup & clear.', 'error', 5000); return false; }
}
function lsRemove(k) { try { localStorage.removeItem(LSP+k); } catch(e) {} }

let syncChannel = null;
try {
  if (typeof BroadcastChannel !== 'undefined') {
    syncChannel = new BroadcastChannel('smartfix-sync');
    syncChannel.onmessage = (ev) => {
      if (ev.data && ev.data.type === 'data-updated') {
        loadAllData();
        showSyncIndicator('Synced', 'emerald');
        if (APP.currentView && VIEW_RENDERERS[APP.currentView]) renderView(APP.currentView);
      }
    };
  }
} catch(e) {}
window.addEventListener('storage', (ev) => {
  if (ev.key && ev.key.startsWith(LSP)) { loadAllData(); showSyncIndicator('Synced', 'emerald'); }
});
function broadcastSync(key) {
  if (syncChannel && APP.settings.wifiSyncEnabled) {
    try { syncChannel.postMessage({ type: 'data-updated', key, ts: Date.now() }); } catch(e) {}
  }
}
function showSyncIndicator(text, color) {
  const el = document.getElementById('syncStatusText'); if (!el) return;
  el.innerText = text;
  el.className = color === 'emerald' ? 'text-emerald-400 font-semibold' : color === 'amber' ? 'text-amber-400 font-semibold' : 'text-rose-400 font-semibold';
  const dot = document.querySelector('#syncIndicator .sync-dot');
  if (dot) dot.className = 'sync-dot ' + (color === 'emerald' ? 'bg-emerald-500' : color === 'amber' ? 'bg-amber-500' : 'bg-rose-500');
}

/* ============================================================
   UTILS
   ============================================================ */
function toast(msg, type = 'info', duration = 2500) {
  const el = document.getElementById('toast'); if (!el) return;
  el.innerText = msg;
  el.className = 'toast show ' + (type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warn' ? 'warn' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), duration);
}
function fmtDate(d) { const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function fmtDateTime(d) { const dt = new Date(d); return dt.toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
function money(n) { return '₹' + (parseFloat(n)||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function moneyInt(n) { return '₹' + Math.round(parseFloat(n)||0).toLocaleString('en-IN'); }
function getFY(dt) {
  dt = dt || new Date();
  const y=dt.getFullYear(), m=dt.getMonth();
  if (m >= 3) return { label:`FY ${y}-${(y+1).toString().slice(-2)}`, start:new Date(y,3,1), end:new Date(y+1,2,31,23,59,59) };
  return { label:`FY ${y-1}-${y.toString().slice(-2)}`, start:new Date(y-1,3,1), end:new Date(y,2,31,23,59,59) };
}
function normalizeIMEI(s) { return (s||'').toString().trim().toUpperCase().replace(/[\s\-_]/g,''); }
function hashPass(str) { let h=0; for (let i=0;i<str.length;i++) h=((h<<5)-h+str.charCodeAt(i))|0; return 'h'+Math.abs(h).toString(36); }
function esc(s) { return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(p='id') { return p+'_'+Date.now()+'_'+Math.floor(Math.random()*10000); }
function numberToWords(num) {
  const a=['','ONE ','TWO ','THREE ','FOUR ','FIVE ','SIX ','SEVEN ','EIGHT ','NINE ','TEN ','ELEVEN ','TWELVE ','THIRTEEN ','FOURTEEN ','FIFTEEN ','SIXTEEN ','SEVENTEEN ','EIGHTEEN ','NINETEEN '];
  const b=['','','TWENTY ','THIRTY ','FORTY ','FIFTY ','SIXTY ','SEVENTY ','EIGHTY ','NINETY '];
  let n=('000000000'+Math.floor(num||0)).substr(-9);
  let m=n.match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/); if(!m) return '';
  let str='';
  str+=(m[1]!=0)?(a[Number(m[1])]||b[m[1][0]]+a[m[1][1]])+'CRORE ':'';
  str+=(m[2]!=0)?(a[Number(m[2])]||b[m[2][0]]+a[m[2][1]])+'LAKH ':'';
  str+=(m[3]!=0)?(a[Number(m[3])]||b[m[3][0]]+a[m[3][1]])+'THOUSAND ':'';
  str+=(m[4]!=0)?(a[Number(m[4])]||b[m[4][0]]+a[m[4][1]])+'HUNDRED ':'';
  str+=(m[5]!=0)?((str!='')?'AND ':'')+(a[Number(m[5])]||b[m[5][0]]+a[m[5][1]])+'RUPEES ONLY':'RUPEES ONLY';
  return str.trim();
}

function doShopLogin(e) {
  e.preventDefault();

  const pwd = document.getElementById('loginPass').value;
  const user = APP.users.find(u => (u.userId || '').toLowerCase() === uidVal || (u.phone || '') === uidVal);
  if (!user) { toast('User not found', 'error'); return; }

function doCustomerLogin(e) {
  e.preventDefault();
  const phone = document.getElementById('custLoginPhone').value.trim();
  const imei6 = document.getElementById('custLoginIMEI6').value.trim();
  const invNo = document.getElementById('custLoginInv').value.trim().toUpperCase();
  if (!phone || (!imei6 && !invNo)) { toast('Enter phone + IMEI last 6 OR invoice no', 'error'); return; }
  const matches = APP.invoices.filter(inv => {
    if ((inv.customerPhone || '').trim() !== phone) return false;
    if (invNo && inv.invoiceNo.toUpperCase() === invNo) return true;
    if (imei6) return (inv.items || []).some(it => normalizeIMEI(it.imei||'').endsWith(imei6));
    return false;
  });
  const serviceMatches = APP.serviceJobs.filter(j => (j.customerPhone || '').trim() === phone);
  if (!matches.length && !serviceMatches.length) { toast('No records found', 'error', 3500); return; }
  APP.user = {
    id: 'cust_' + phone,
    name: (matches[0] && matches[0].customerName) || (serviceMatches[0] && serviceMatches[0].customerName) || 'Customer',
    phone, role: 'customer', isCustomer: true,
    matchedInvoices: matches.map(m => m.invoiceNo),

  };

function renderCart() {
  const tbody = document.getElementById('cartBody'); if (!tbody) return;
  if (!APP.cart.length) APP.cart = [createEmptyCartItem()];
  tbody.innerHTML = APP.cart.map((it, i) => `
    <tr class="border-b">
      <td class="p-1"><input type="text" value="${esc(it.desc)}" onchange="updateCartItem(${i},'desc',this.value)" placeholder="Model" class="inp text-xs py-1.5" style="padding:6px 8px"></td>
      <td class="p-1"><input type="text" value="${esc(it.imei)}" onchange="updateCartItem(${i},'imei',this.value)" placeholder="IMEI" class="inp text-xs py-1.5 font-mono" style="padding:6px 8px"></td>
      <td class="p-1"><input type="text" value="${esc(it.hsn)}" onchange="updateCartItem(${i},'hsn',this.value)" class="inp text-xs py-1.5 font-mono text-center" style="padding:6px 4px"></td>
      <td class="p-1"><select onchange="updateCartItem(${i},'gstRate',parseInt(this.value))" class="inp text-xs py-1.5" style="padding:6px 4px"><option value="18" ${it.gstRate==18?'selected':''}>18</option><option value="12" ${it.gstRate==12?'selected':''}>12</option><option value="28" ${it.gstRate==28?'selected':''}>28</option><option value="0" ${it.gstRate==0?'selected':''}>0</option></select></td>
      <td class="p-1"><div class="flex items-center gap-1"><button onclick="changeQty(${i},-1)" class="qty-btn">−</button><span class="text-xs font-bold w-6 text-center">${it.qty}</span><button onclick="changeQty(${i},1)" class="qty-btn">+</button></div></td>
      <td class="p-1"><input type="number" value="${it.price}" onchange="updateCartItem(${i},'price',parseFloat(this.value)||0)" class="inp text-xs py-1.5 font-mono text-right" style="padding:6px 6px"></td>
      <td class="p-2 text-right font-mono font-bold">${money(it.price*it.qty)}</td>
      <td class="p-1"><button onclick="removeCartRow(${i})" class="text-red-500 text-lg">✕</button></td>
    </tr>`).join('');

}

function addCartRow() { APP.cart.push(createEmptyCartItem()); renderCart(); }
function removeCartRow(i) { APP.cart.splice(i, 1); if (!APP.cart.length) APP.cart.push(createEmptyCartItem()); renderCart(); }
function updateCartItem(i, k, v) {
  APP.cart[i][k] = v;
  // Auto-detect stock by IMEI
  if (k === 'imei' && v) {
    const clean = normalizeIMEI(v);
    const stk = APP.inventory.find(s => normalizeIMEI(s.imei) === clean && s.status !== 'Sold');
    if (stk) {
      APP.cart[i].desc = stk.model;
      APP.cart[i].price = stk.cost;
      APP.cart[i].purchaseCost = stk.purchaseCost || 0;
      APP.cart[i].stockId = stk.id;
      APP.cart[i].hsn = stk.hsn || '8517';
      APP.cart[i].gstRate = stk.gstRate || 18;
    }
  }
  renderCart();
}
function changeQty(i, d) { APP.cart[i].qty = Math.max(1, (APP.cart[i].qty || 1) + d); renderCart(); }
function clearCart() { if (!confirm('Clear all items?')) return; APP.cart = [createEmptyCartItem()]; renderCart(); }

function recalcSale() {
  let subtotal = 0, cgst = 0, sgst = 0, igst = 0;
  APP.cart.forEach(it => {
    const line = it.price * it.qty;
    const taxable = line / (1 + (it.gstRate||18)/100);
    const tax = line - taxable;
    subtotal += taxable;
    const gstType = document.getElementById('saleGSTType')?.value || 'INTRA';
    if (gstType === 'INTRA') { cgst += tax/2; sgst += tax/2; }
    else igst += tax;
  });
  const gross = APP.cart.reduce((s, it) => s + it.price*it.qty, 0);
  const discount = parseFloat(document.getElementById('saleDiscount')?.value) || 0;
  const final = Math.max(0, gross - discount);
  const els = {
    sub: document.getElementById('saleSub'),
    disc: document.getElementById('saleDisc'),
    cgst: document.getElementById('saleCGST'),
    sgst: document.getElementById('saleSGST'),
    grand: document.getElementById('saleGrand'),
    total: document.getElementById('saleTotal'),
    words: document.getElementById('saleTotalWords')
  };
  if (els.sub) els.sub.innerText = money(subtotal);
  if (els.disc) els.disc.innerText = money(discount);
  if (els.cgst) els.cgst.innerText = money(cgst);
  if (els.sgst) els.sgst.innerText = money(sgst);
  if (els.grand) els.grand.innerText = money(final);
  if (els.total) els.total.innerText = money(final);
  if (els.words) els.words.innerText = numberToWords(final);
}
document.addEventListener('input', (e) => {
  if (['saleDiscount','saleGSTType'].includes(e.target.id)) recalcSale();
});

function finalizeSale() {
  const items = APP.cart.filter(it => it.desc && it.price > 0);
  if (!items.length) { toast('Add items first', 'error'); return; }
  const invNo = document.getElementById('saleInvNo').innerText;
  const date = document.getElementById('saleDate').value;
  const custName = document.getElementById('saleCustName').value.trim() || 'Cash Customer';
  const custPhone = document.getElementById('saleCustPhone').value.trim();
  const custGST = document.getElementById('saleCustGST').value.trim();
  const ledger = document.getElementById('salePayment').value;
  const gstType = document.getElementById('saleGSTType').value;
  const discount = parseFloat(document.getElementById('saleDiscount').value) || 0;

  let tG=0, tT=0, tC=0, tS=0, tI=0, tPC=0;
  items.forEach(it => {
    const lt = it.price*it.qty, ltx = lt/(1+(it.gstRate||18)/100), tax = lt-ltx;
    tG += lt; tT += ltx; tPC += (it.purchaseCost || 0) * it.qty;
    if (gstType === 'INTRA') { tC += tax/2; tS += tax/2; } else tI += tax;
  });
  const final = Math.max(0, tG - discount);
  const factor = tG > 0 ? final / tG : 1;
  tT *= factor; tC *= factor; tS *= factor; tI *= factor;

  const inv = {
    id: uid('inv'),
    invoiceNo: invNo, date,
    customerName: custName, customerPhone: custPhone, customerGSTIN: custGST,
    taxType: gstType, ledger, discount,
    items: JSON.parse(JSON.stringify(items)),
    totalTaxable: +tT.toFixed(2), totalCGST: +tC.toFixed(2), totalSGST: +tS.toFixed(2), totalIGST: +tI.toFixed(2),
    totalGross: +final.toFixed(2), totalPurchaseCost: +tPC.toFixed(2),
    financialYear: getFY(new Date(date)).label,
    timestamp: new Date().toISOString()
  };

  // Mark stock sold
  items.forEach(it => {
    if (it.stockId) {
      const stk = APP.inventory.find(s => s.id === it.stockId);
      if (stk) { stk.status = 'Sold'; stk.soldInvoice = invNo; stk.soldDate = date; }
    } else if (it.imei) {
      const stk = APP.inventory.find(s => normalizeIMEI(s.imei) === normalizeIMEI(it.imei));
      if (stk) { stk.status = 'Sold'; stk.soldInvoice = invNo; stk.soldDate = date; }
    }
  });
  lsSet('stock', APP.inventory);

  APP.invoices.unshift(inv);
  lsSet('invoices', APP.invoices);
  autoRegisterWarranty(inv);
  logAudit('SALE', `${invNo} | ${custName} | ₹${final.toFixed(2)}`);

  // Auto party for credit
  if (ledger === 'Credit / Sundry Debtors' && custName !== 'Cash Customer') {
    let p = APP.customers.find(c => (c.name||'').toLowerCase() === custName.toLowerCase());
    if (!p) { APP.customers.push({ id: uid('cust'), name: custName, phone: custPhone, gstin: custGST, opening: 0 }); lsSet('customers', APP.customers); }
  }

  toast(`Invoice ${invNo} saved!`, 'success');
  APP.cart = [createEmptyCartItem()];
  checkNotifications();

  setTimeout(() => { printInvoice(inv); }, 300);
  setTimeout(() => { navigateTo('sales'); }, 500);
}

function saveServiceJob() {
  const name = document.getElementById('sjCustName').value.trim();
  const phone = document.getElementById('sjCustPhone').value.trim();
  const model = document.getElementById('sjModel').value.trim();
  const imei = document.getElementById('sjIMEI').value.trim();
  const problem = document.getElementById('sjProblem').value.trim();
  const estCost = parseFloat(document.getElementById('sjEstCost').value) || 0;
  const advance = parseFloat(document.getElementById('sjAdvance').value) || 0;
  const techId = document.getElementById('sjTechnician').value;
  const expDate = document.getElementById('sjExpectedDate').value;
  if (!name || !phone || !model || !problem) { toast('Fill required fields', 'error'); return; }
  const file = document.getElementById('sjPhoto').files[0];
  const finish = (photoData) => {
    const job = {
      id: uid('job'), jobNo: nextJobNo(),
      customerName: name, customerPhone: phone, model, imei, problem,
      estimatedCost: estCost, advance,
      technicianId: techId || null,
      technicianName: techId ? (APP.users.find(u => u.id === techId) || {}).name : null,
      expectedDate: expDate || null,
      status: 'Received', photo: photoData || '',
      spareParts: [], finalCost: 0, deliveredAt: null,
      createdAt: new Date().toISOString(),
      statusHistory: [{ status: 'Received', ts: new Date().toISOString(), user: APP.user.name }]
    };
    APP.serviceJobs.unshift(job);
    lsSet('service_jobs', APP.serviceJobs);
    logAudit('SERVICE_CREATE', `${job.jobNo} | ${name}`);
    closeModal('serviceModal');
    toast(`Job ${job.jobNo} created`, 'success');
    if (APP.currentView === 'service') renderView('service');
    setTimeout(() => { if (confirm(`Print job card for ${job.jobNo}?`)) printServiceJobCard(job.id); }, 400);
  };
  if (file) {
    const r = new FileReader();
    r.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement('canvas');
        let w = img.width, h = img.height; const max = 600;
        if (w > h && w > max) { h = Math.round(h*max/w); w = max; } else if (h > max) { w = Math.round(w*max/h); h = max; }
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        finish(cv.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = () => finish('');
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  } else finish('');
}

function addSparePart(jobId) {
  const job = APP.serviceJobs.find(j => j.id === jobId); if (!job) return;
  const avail = APP.inventory.filter(i => i.status !== 'Sold' && i.status !== 'Used in Service');
  if (!avail.length) { toast('No stock items available', 'warn'); return; }
  const listText = avail.slice(0, 30).map((it, i) => `${i+1}. ${it.model} (${it.imei || 'no-imei'}) - ₹${it.cost}`).join('\n');
  const choice = prompt(`Available Stock:\n${listText}\n\nEnter item number:`);
  if (!choice) return;
  const idx = parseInt(choice, 10) - 1;
  if (idx < 0 || idx >= avail.length) { toast('Invalid', 'error'); return; }
  const item = avail[idx];
  const priceStr = prompt('Charge for this part (₹):', item.cost);
  if (priceStr === null) return;
  const price = parseFloat(priceStr) || item.cost;
  job.spareParts = job.spareParts || [];
  job.spareParts.push({ stockId: item.id, model: item.model, imei: item.imei || '', purchaseCost: item.purchaseCost || 0, cost: price });
  item.status = 'Used in Service';
  item.usedInJob = job.jobNo;
  lsSet('stock', APP.inventory);
  job.finalCost = (job.finalCost || 0) + price;
  lsSet('service_jobs', APP.serviceJobs);
  logAudit('SERVICE_PART', `${job.jobNo} + ${item.model}`);
  toast(`Part added: ${item.model}`, 'success');
  if (APP.currentView === 'service') renderView('service');
}

function deliverJob(jobId) {
  const job = APP.serviceJobs.find(j => j.id === jobId); if (!job) return;

  job.statusHistory.push({ status: 'Delivered', ts: new Date().toISOString(), user: APP.user.name });
  lsSet('service_jobs', APP.serviceJobs);
  logAudit('SERVICE_DELIVERED', `${job.jobNo} | Due: ₹${due}`);
  closeModal('jobDetailModal');
  toast(`Delivered! Due: ${money(due)}`, 'success');
  if (APP.currentView === 'service') renderView('service');
  setTimeout(() => { if (confirm('Print service bill?')) printServiceFinalBill(jobId); }, 400);

function deleteServiceJob(jobId) {
  const pin = prompt('Master PIN:'); if (pin !== (APP.shopProfile.masterPin || '1234')) { toast('Wrong PIN', 'error'); return; }
  const job = APP.serviceJobs.find(j => j.id === jobId); if (!job) return;
  if (!confirm(`Delete ${job.jobNo}?`)) return;
  (job.spareParts || []).forEach(p => {
    const it = APP.inventory.find(i => i.id === p.stockId);
    if (it && it.status === 'Used in Service') { it.status = 'Available'; delete it.usedInJob; }
  });
  lsSet('stock', APP.inventory);
  APP.serviceJobs = APP.serviceJobs.filter(j => j.id !== jobId);
  lsSet('service_jobs', APP.serviceJobs);
  logAudit('SERVICE_DELETE', job.jobNo);
  toast('Job deleted', 'success');
  renderView('service');
}

function addMonths(d, m) { const dt = new Date(d); dt.setMonth(dt.getMonth() + m); return dt.toISOString(); }
function getWarrantyStatus(w) {
  const now = new Date();
  const brandEnd = new Date(w.brandWarrantyEnd);
  const shopEnd = new Date(w.shopWarrantyEnd);
  if (now <= brandEnd) return 'active';
  if (now <= shopEnd) return 'shop-only';
  return 'expired';
}
function autoRegisterWarranty(inv) {
  (inv.items || []).forEach(it => {
    if (!it.imei) return;
    const norm = normalizeIMEI(it.imei);
    if (APP.warranties.some(w => normalizeIMEI(w.imei) === norm)) return;
    const now = new Date(inv.date);
    const bm = APP.settings.defaultBrandWarranty || 12;
    const sm = APP.settings.defaultShopWarranty || 6;
    APP.warranties.push({
      id: uid('warr'), imei: norm, model: it.desc,
      customerName: inv.customerName, customerPhone: inv.customerPhone,
      invoiceNo: inv.invoiceNo, purchaseDate: inv.date,
      brandWarrantyMonths: bm, shopWarrantyMonths: sm,
      brandWarrantyEnd: addMonths(now, bm), shopWarrantyEnd: addMonths(now, sm),
      status: 'active', claims: []
    });
  });
  lsSet('warranties', APP.warranties);
}

function filterWarrantyList(q) {
  q = (q||'').toLowerCase().trim();
  const c = document.getElementById('warrantyListContainer'); if (!c) return;
  let list = APP.warranties;
  if (APP.activeWarrantyTab === 'expired') list = list.filter(w => getWarrantyStatus(w) === 'expired');
  else list = list.filter(w => getWarrantyStatus(w) !== 'expired');
  if (q) list = list.filter(w => (w.imei+' '+w.customerPhone+' '+w.model+' '+w.customerName).toLowerCase().includes(q));
  if (!list.length) { c.innerHTML = '<div class="card text-center py-8 text-slate-400 text-sm">No matches</div>'; return; }
  c.innerHTML = list.map(w => {
    const st = getWarrantyStatus(w);
    const stClass = st === 'active' ? 'bg-emerald-100 text-emerald-800' : st === 'shop-only' ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-600';
    return `<div class="card"><div class="font-bold text-slate-900">${esc(w.model)}</div><div class="text-xs font-mono text-slate-600">${esc(w.imei)}</div><div class="text-xs text-slate-600">${esc(w.customerName)} · ${esc(w.customerPhone)}</div><span class="text-[10px] font-bold px-2 py-0.5 rounded ${stClass} mt-2 inline-block">${st}</span></div>`;
  }).join('');
}

function addWarrantyClaim(wId) {
  const w = APP.warranties.find(x => x.id === wId); if (!w) return;
  const issue = prompt('Issue:'); if (!issue) return;
  const resolution = prompt('Resolution:', 'Sent to service center'); if (resolution === null) return;
  w.claims = w.claims || [];
  w.claims.push({ date: fmtDate(new Date()), issue, resolution, ts: new Date().toISOString() });
  lsSet('warranties', APP.warranties);
  logAudit('WARRANTY_CLAIM', `${w.imei} | ${issue}`);
  toast('Claim recorded', 'success');
  renderView('warranty');
}

function searchWarrantyByIMEI(imei) {
  const w = APP.warranties.find(x => normalizeIMEI(x.imei) === normalizeIMEI(imei));
  if (!w) { toast('Not found', 'warn'); return; }
  alert(`Warranty Found\n\nModel: ${w.model}\nIMEI: ${w.imei}\nCustomer: ${w.customerName}\nPhone: ${w.customerPhone}\nPurchase: ${w.purchaseDate}\nBrand till: ${new Date(w.brandWarrantyEnd).toLocaleDateString()}\nShop till: ${new Date(w.shopWarrantyEnd).toLocaleDateString()}\nStatus: ${getWarrantyStatus(w)}`);
}

function saveEmiPlan() {
  const providerId = document.getElementById('emiProvider').value;
  const customerName = document.getElementById('emiCustName').value.trim();
  const customerPhone = document.getElementById('emiCustPhone').value.trim();
  const deviceModel = document.getElementById('emiDevice').value.trim();
  const downPayment = parseFloat(document.getElementById('emiDown').value) || 0;
  const loanAmount = parseFloat(document.getElementById('emiLoan').value) || 0;
  const tenure = parseInt(document.getElementById('emiTenure').value) || 9;
  const interestRate = parseFloat(document.getElementById('emiRate').value) || 0;
  const monthlyEmi = parseFloat(document.getElementById('emiMonthly').value) || 0;

function recordEmiPayment(emiId) {
  const e = APP.emis.find(x => x.id === emiId); if (!e) return;
  const recv = (e.providerPayments||[]).reduce((s, p) => s + p.amount, 0);
  const amt = prompt(`Pending: ${money(e.loanAmount-recv)}\n\nReceived ₹:`, (e.loanAmount-recv).toFixed(0));
  if (!amt) return;
  const amount = parseFloat(amt);
  if (!amount || amount <= 0) { toast('Invalid', 'error'); return; }
  const ref = prompt('Ref / UTR:', '') || '';
  e.providerPayments = e.providerPayments || [];
  e.providerPayments.push({ date: fmtDate(new Date()), amount, ref, ts: new Date().toISOString() });
  if (recv + amount >= e.loanAmount) e.status = 'completed';
  lsSet('emis', APP.emis);
  logAudit('EMI_PAYMENT', `${e.emiNo} +₹${amount}`);
  toast(`Recorded ${money(amount)}`, 'success');
  renderView('emi');
}

function viewEmiDetails(emiId) {

}

function renderPurchaseRows() {
  const tbody = document.getElementById('purBody'); if (!tbody) return;
  if (!APP.purchaseLines.length) { tbody.innerHTML = '<tr><td colspan="8" class="p-4 text-center text-slate-400 text-xs">Click + Add Row to add items</td></tr>'; return; }
  tbody.innerHTML = APP.purchaseLines.map((it, i) => `

      <td class="p-1"><button onclick="removePurchaseRow(${i})" class="text-red-500 text-lg">✕</button></td>
    </tr>`).join('');
  const total = APP.purchaseLines.reduce((s, it) => s + it.cost * it.qty, 0);
  const el1 = document.getElementById('purTotal'); if (el1) el1.innerText = money(total);
  const el2 = document.getElementById('purTotalWords'); if (el2) el2.innerText = numberToWords(total);
}
function upPurchase(i, k, v) { APP.purchaseLines[i][k] = v; renderPurchaseRows(); }
function clearPurchase() { if (!confirm('Clear all rows?')) return; APP.purchaseLines = []; renderPurchaseRows(); }

function finalizePurchase() {
  const lines = APP.purchaseLines.filter(l => l.model && l.cost > 0);
  if (!lines.length) { toast('Add items first', 'error'); return; }
  const supplier = document.getElementById('purSupplier').value.trim();
  if (!supplier) { toast('Enter supplier name', 'error'); return; }
  const billNo = document.getElementById('purBillNo').value.trim();
  const date = document.getElementById('purDate').value;
  const phone = document.getElementById('purPhone').value.trim();
  const ledger = document.getElementById('purLedger').value;
  const gstType = document.getElementById('purGSTType').value;

  const purNo = nextPurchaseNo(new Date(date));
  let totalCost = 0, totalTaxable = 0, totalTax = 0;
  lines.forEach(l => { const lt = l.cost * l.qty; totalCost += lt; const tx = lt / (1 + (l.gstRate||18)/100); totalTaxable += tx; totalTax += (lt - tx); });

  // Add to inventory
  lines.forEach(l => {
    APP.inventory.push({
      id: uid('stk'), model: l.model, imei: l.imei || '', category: l.category,
      purchaseCost: l.cost, cost: l.sell || l.cost * 1.15, gstRate: l.gstRate,
      status: 'Available', supplier, purchaseBillNo: billNo || purNo,
      isOldStock: false, addedDate: date, hsn: '8517'
    });
  });
  lsSet('stock', APP.inventory);

  // Find/create supplier
  let sup = APP.suppliers.find(s => (s.name||'').toLowerCase() === supplier.toLowerCase());
  if (!sup) { sup = { id: uid('sup'), name: supplier, phone, gstin: '', opening: 0 }; APP.suppliers.push(sup); lsSet('suppliers', APP.suppliers); }

  const purchase = {
    id: uid('pur'), purchaseNo: purNo, billNo: billNo || purNo, date,
    supplierId: sup.id, supplierName: supplier, supplierPhone: phone,
    ledger, gstType, lines: JSON.parse(JSON.stringify(lines)),
    totalTaxable: +totalTaxable.toFixed(2), totalTax: +totalTax.toFixed(2), totalCost: +totalCost.toFixed(2),
    timestamp: new Date().toISOString()
  };
  APP.purchases.unshift(purchase);
  lsSet('purchases', APP.purchases);
  logAudit('PURCHASE_CREATE', `${purNo} | ${supplier} | ₹${totalCost.toFixed(2)}`);
  toast(`Purchase ${purNo} saved! Stock added.`, 'success');
  APP.purchaseLines = [];
  checkNotifications();
  setTimeout(() => navigateTo('purchase'), 400);
}

function getSupplierStats(supId) {
  const sup = APP.suppliers.find(s => s.id === supId); if (!sup) return { purchases:0, paid:0, due:0 };
  const purchases = APP.purchases.filter(p => p.supplierId === supId && p.ledger === 'Credit / Sundry Creditors').reduce((s, p) => s + p.totalCost, 0) + (sup.opening || 0);
  const paid = APP.supplierPayments.filter(sp => sp.supplierId === supId).reduce((s, sp) => s + sp.amount, 0);
  return { purchases, paid, due: purchases - paid };
}

function saveDealerPayment() {
  const supId = document.getElementById('dpSupplier').value;
  const date = document.getElementById('dpDate').value;
  const amount = parseFloat(document.getElementById('dpAmount').value) || 0;
  const mode = document.getElementById('dpMode').value;
  const ref = document.getElementById('dpRef').value.trim();
  const note = document.getElementById('dpNote').value.trim();
  if (!supId) { toast('Select supplier', 'error'); return; }
  if (!date || amount <= 0) { toast('Invalid date/amount', 'error'); return; }

  const rec = { id: uid('sp'), supplierId: supId, supplierName: sup.name, amount, date, mode, refNo: ref, narration: note, timestamp: new Date().toISOString() };
  APP.supplierPayments.unshift(rec);

  // Auto voucher

  document.getElementById('dpRef').value = '';

function deleteDealerPayment(id) {

  APP.supplierPayments = APP.supplierPayments.filter(x => x.id !== id);

function saveStockItem() {

function deleteParty(type, id) {
  const pin = prompt('Master PIN:'); if (pin !== (APP.shopProfile.masterPin || '1234')) { toast('Wrong PIN', 'error'); return; }
  if (type === 'customer') {
    if (!confirm('Delete customer?')) return;
    APP.customers = APP.customers.filter(c => c.id !== id); lsSet('customers', APP.customers);
  } else {
    const st = getSupplierStats(id);
    if (st.paid > 0) { toast('Cannot delete: has payments', 'error'); return; }
    if (!confirm('Delete supplier?')) return;
    APP.suppliers = APP.suppliers.filter(s => s.id !== id); lsSet('suppliers', APP.suppliers);
  }
  toast('Deleted', 'success');
  renderView('parties');
}

function setRepRange(r) {
  const today = new Date(); let from = today, to = today;
  if (r === 'today') { from = today; to = today; }
  else if (r === 'month') { from = new Date(today.getFullYear(), today.getMonth(), 1); to = today; }
  else if (r === 'fy') { const fy = getFY(today); from = fy.start; to = fy.end; }
  const f = document.getElementById('repFrom'); const t = document.getElementById('repTo');
  if (f) f.value = fmtDate(from); if (t) t.value = fmtDate(to);
  renderView('reports');
}

function exportReportsExcel() {
  const wb = XLSX.utils.book_new();
  const sales = APP.invoices.map(r => ({ Date: r.date, Invoice: r.invoiceNo, Customer: r.customerName, Phone: r.customerPhone, Taxable: r.totalTaxable, CGST: r.totalCGST, SGST: r.totalSGST, IGST: r.totalIGST, Total: r.totalGross }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sales), 'Sales');
  const purchases = APP.purchases.map(r => ({ Date: r.date, PurchaseNo: r.purchaseNo, Supplier: r.supplierName, Taxable: r.totalTaxable, GST: r.totalTax, Total: r.totalCost }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(purchases), 'Purchases');
  const payments = APP.supplierPayments.map(r => ({ Date: r.date, Supplier: r.supplierName, Amount: r.amount, Mode: r.mode, Ref: r.refNo }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(payments), 'DealerPayments');
  const jobs = APP.serviceJobs.map(r => ({ JobNo: r.jobNo, Date: r.createdAt, Customer: r.customerName, Phone: r.customerPhone, Model: r.model, Status: r.status, Cost: r.finalCost || r.estimatedCost }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(jobs), 'ServiceJobs');
  const emis = APP.emis.map(r => ({ EMINo: r.emiNo, Customer: r.customerName, Phone: r.customerPhone, Provider: (APP.emiProviders.find(p => p.id === r.providerId)||{}).name, Loan: r.loanAmount, Tenure: r.tenure, Status: r.status }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(emis), 'EMI');
  const stock = APP.inventory.map(r => ({ Category: r.category, Model: r.model, IMEI: r.imei, Purchase: r.purchaseCost, Sell: r.cost, Status: r.status }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stock), 'Stock');
  XLSX.writeFile(wb, `SmartFixERP_Report_${fmtDate(new Date())}.xlsx`);
  toast('Excel exported', 'success');
}

function reprintInvoice(invNo) {
  const inv = APP.invoices.find(i => i.invoiceNo === invNo);
  if (inv) printInvoice(inv);
}

function saveStaffMember() {
  const name = document.getElementById('stName').value.trim();
  const phone = document.getElementById('stPhone').value.trim();
  const designation = document.getElementById('stDesignation').value.trim();
  const salary = parseFloat(document.getElementById('stSalary').value) || 0;
  const joining = document.getElementById('stJoining').value;
  if (!name || salary <= 0) { toast('Name & salary required', 'error'); return; }
  APP.staff.push({ id: uid('stf'), name, phone, designation, salary, joining });
  lsSet('staff', APP.staff);
  logAudit('STAFF_ADD', name);
  toast('Staff added', 'success');
  renderView('staff');
}

function deleteStaffMember(id) {
  const pin = prompt('Master PIN:'); if (pin !== (APP.shopProfile.masterPin || '1234')) { toast('Wrong PIN', 'error'); return; }
  if (!confirm('Delete staff?')) return;
  APP.staff = APP.staff.filter(s => s.id !== id);
  lsSet('staff', APP.staff);
  toast('Deleted', 'success');
  renderView('staff');
}

function payStaffSalary(staffId) {
  const s = APP.staff.find(x => x.id === staffId); if (!s) return;
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today = new Date();
  const amtStr = prompt(`${s.name}'s Salary\nBase: ₹${s.salary}\n\nEnter Amount ₹:`, s.salary);
  if (!amtStr) return;
  const amount = parseFloat(amtStr); if (!amount) return;
  const bonusStr = prompt('Bonus ₹:', '0') || '0';
  const bonus = parseFloat(bonusStr) || 0;
  const modeStr = prompt('Mode (Cash/Bank):', 'Cash') || 'Cash';
  const mode = modeStr.toLowerCase().includes('bank') ? 'Bank / UPI' : 'Cash-in-Hand';
  const monthLabel = months[today.getMonth()] + ' ' + today.getFullYear();
  const rec = {
    id: uid('sal'), staffId, staffName: s.name, designation: s.designation,
    payDate: fmtDate(today), month: today.getMonth()+1, year: today.getFullYear(), monthLabel,
    salary: amount, bonus, total: amount + bonus, payMode: mode, note: ''
  };
  APP.salaryPayments.unshift(rec);
  lsSet('salary_payments', APP.salaryPayments);
  APP.vouchers.unshift({ id: uid('vch'), type: 'EXPENSE', date: fmtDate(today), amount: amount + bonus, category: 'Salary - ' + s.name, account: mode, narration: 'Salary for ' + monthLabel });
  lsSet('vouchers', APP.vouchers);
  logAudit('SALARY_PAID', `${s.name} | ${monthLabel} | ₹${amount+bonus}`);
  toast(`Salary paid: ${money(amount+bonus)}`, 'success');
  renderView('staff');
  setTimeout(() => { if (confirm('Print salary slip?')) printSalarySlip(rec.id); }, 400);
}

function quickBackup() {
  const snapshot = buildSnapshot();
  const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `SmartFixERP_Backup_${fmtDate(new Date())}.json`; a.click();
  URL.revokeObjectURL(url);
  lsSet('last_backup', new Date().toISOString());
  toast('Backup downloaded', 'success');
}
function buildSnapshot() {
  return {
    version: APP.version, exportedAt: new Date().toISOString(),
    shopProfile: APP.shopProfile, users: APP.users, invoices: APP.invoices, purchases: APP.purchases,
    supplierPayments: APP.supplierPayments, creditNotes: APP.creditNotes, vouchers: APP.vouchers,
    inventory: APP.inventory, serviceJobs: APP.serviceJobs, warranties: APP.warranties,
    emis: APP.emis, emiProviders: APP.emiProviders, staff: APP.staff, salaryPayments: APP.salaryPayments,
    customers: APP.customers, suppliers: APP.suppliers,
    categories: APP.categories, auditLog: APP.auditLog, settings: APP.settings
  };
}
function openRestoreDialog() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    if (!confirm('Restore will REPLACE all data. Continue?')) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.shopProfile && !data.invoices) { toast('Invalid backup', 'error'); return; }
        const map = { shopProfile:'shop_profile', users:'users', invoices:'invoices', purchases:'purchases', supplierPayments:'supplier_payments', creditNotes:'credit_notes', vouchers:'vouchers', inventory:'stock', serviceJobs:'service_jobs', warranties:'warranties', emis:'emis', emiProviders:'emi_providers', staff:'staff', salaryPayments:'salary_payments', customers:'customers', suppliers:'suppliers', categories:'categories', auditLog:'audit_log', settings:'settings' };
        Object.keys(data).forEach(k => { if (data[k] !== undefined && map[k]) lsSet(map[k], data[k]); });
        toast('Restored! Reloading...', 'success');
        setTimeout(() => location.reload(), 900);
      } catch(e) { toast('Error: ' + e.message, 'error', 4000); }
    };
    reader.readAsText(file);
  };
  input.click();
}

   ============================================================ */
function checkNotifications() {
  const readyJobs = APP.serviceJobs.filter(j => j.status === 'Ready').length;
  const expiringWarranties = APP.warranties.filter(w => {
    const days = (new Date(w.brandWarrantyEnd) - new Date()) / (1000*60*60*24);
    return days > 0 && days <= 30;
  }).length;
  const total = readyJobs + expiringWarranties;
  const badge = document.getElementById('notifBadge');
  if (badge) { if (total > 0) { badge.innerText = total; badge.style.display = 'flex'; } else badge.style.display = 'none'; }
}
function openNotifications() {
  const items = [];
  APP.serviceJobs.filter(j => j.status === 'Ready').forEach(j => items.push(`🔧 ${j.jobNo} ready (${j.customerName})`));
  APP.warranties.forEach(w => {
    const days = (new Date(w.brandWarrantyEnd) - new Date()) / (1000*60*60*24);
    if (days > 0 && days <= 30) items.push(`🛡️ Warranty expires in ${Math.round(days)} days: ${w.model}`);
  });
  if (!items.length) { toast('No notifications', 'info'); return; }
  alert('Notifications:\n\n' + items.join('\n'));
}

function tryAutoLogin() {
  const uid = lsGet('current_user_id', null);
  if (!uid) return false;
  const user = APP.users.find(u => u.id === uid);
  if (!user || user.status === 'disabled') return false;
  APP.user = { ...user, passwordHash: undefined };
  enterApp();
  return true;
}

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  loadAllData();
  if (APP.users.length === 0) document.getElementById('firstTimeSetupBox').style.display = 'block';
  if (!tryAutoLogin()) document.getElementById('loginScreen').style.display = 'flex';
  if (APP.settings.autoBackup) {
    const today = fmtDate(new Date());
    const lastAuto = lsGet('last_auto_backup', null);
    if (lastAuto !== today) {
      setTimeout(() => {
        lsSet('last_auto_backup', today);
        lsSet('daily_backup_' + today, buildSnapshot());
        const keys = Object.keys(localStorage).filter(k => k.startsWith(LSP + 'daily_backup_'));
        if (keys.length > 30) keys.sort().slice(0, keys.length - 30).forEach(k => localStorage.removeItem(k));
      }, 2500);
    }
  }
  showSyncIndicator('Synced', 'emerald');
});
